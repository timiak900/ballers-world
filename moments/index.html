<title>Ballers Moments</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700&display=swap">
<style>
/* Layout: a TV-camera night match fills the screen; broadcast scorebug on top, commentary strip at the bottom */
:root{
  --night:#070c0a; --panel:rgba(8,14,11,.86); --rule:rgba(255,255,255,.14);
  --ink:#f2f6ef; --mute:#a3b4a9; --home:#7cc4ff; --away:#e0344a; --gold:#ffd24a;
  --disp:'Saira Condensed','Arial Narrow',Impact,sans-serif; --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toprow{display:flex;gap:8px;align-items:stretch}
.bug{flex:1;min-width:0;display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow:hidden;font-family:var(--disp);letter-spacing:.02em}
.bug .tm{display:flex;align-items:center;gap:6px;padding:5px 8px;font-weight:800;font-size:18px;white-space:nowrap}
.bug .tm i{width:5px;align-self:stretch;border-radius:2px}
.bug .sc{display:flex;align-items:center;padding:0 9px;font-weight:800;font-size:21px;white-space:nowrap;background:rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
.bug .clk{margin-left:auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:3px 9px;min-width:0}
.bug .clk b{font-size:19px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.bug .clk small{font-family:var(--body);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.snd{flex:none;width:58px;pointer-events:auto;background:var(--panel);border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:0 6px;font:600 12px/1.15 var(--body)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--rule);color:var(--ink);border-radius:999px;padding:7px 12px;font:700 12px var(--body);letter-spacing:.04em;text-transform:uppercase}
.chip[aria-pressed=true]{background:var(--ink);color:var(--night)}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
.say{max-width:520px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:8px 14px;font:600 14px/1.35 var(--body);text-align:center}
.say b{color:var(--gold)}
.say small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.gauge{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:4;width:32px;height:190px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;display:flex;flex-direction:column-reverse;overflow:hidden;pointer-events:none}
.gauge span{flex:1;display:flex;align-items:center;justify-content:center;font:700 9px var(--body);color:var(--mute);letter-spacing:.06em;writing-mode:vertical-rl;transform:rotate(180deg);border-top:1px solid var(--rule)}
.gauge span.on{background:var(--ink);color:var(--night)}
.gauge span.over.on{background:var(--away);color:var(--ink)}
.card{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgba(3,6,5,.4)}
.card .box{width:min(370px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card .eyebrow{font:700 12px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.card h1{margin:0;font:800 40px/0.95 var(--disp);letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.card p{margin:0;color:var(--mute);font:500 15px/1.45 var(--body)}
.card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.card li{font:500 13px/1.35 var(--body);color:var(--ink);display:flex;gap:8px}
.card li b{flex:none;width:92px;color:var(--gold);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding-top:2px}
.card .row{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;border:0;border-radius:10px;padding:13px 10px;font:800 17px var(--disp);letter-spacing:.05em;text-transform:uppercase;background:var(--ink);color:var(--night)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.btn:focus-visible,.chip:focus-visible,.snd:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.big{position:fixed;left:0;right:0;top:40%;z-index:6;padding:0 16px;text-align:center;pointer-events:none;font:800 clamp(40px,13vw,104px)/1 var(--disp);letter-spacing:.02em;text-transform:uppercase;color:var(--ink);text-shadow:0 4px 0 rgba(0,0,0,.4)}
.big.g{color:var(--gold)}
@media (prefers-reduced-motion:no-preference){ .big:not([hidden]){animation:pop .5s cubic-bezier(.2,1.6,.4,1)} @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}} }
</style>

<canvas id="c" aria-label="Match"></canvas>
<div class="hud">
  <div class="toprow"><div class="bug" id="bug"></div><button class="snd" id="snd" aria-pressed="false">Sound<br>off</button></div>
  <div class="chips" id="chips"></div>
</div>
<div class="gauge" id="gauge" hidden><span class="lo">Low</span><span class="mid">Mid</span><span class="top">Top</span><span class="over">Over</span></div>

<div class="foot"><div class="say" id="say"></div></div>
<div class="card" id="card" hidden><div class="box" id="cardBox"></div></div>

<script>
// ===== world: x = across the pitch (+ toward the camera), y = distance from the goal line we attack, z = up. metres, seconds =====
const G=9.81, DRAG=0.0135, ROLL=2.3, R=0.11, GW=3.66, GH=2.44, GD=2.0, ROOF=1.0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), sig=x=>1/(1+Math.exp(-x)), rnd=Math.random, lerp=(a,b,t)=>a+(b-a)*t;
const gauss=()=>{ let u=0,v=0; while(!u) u=rnd(); while(!v) v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const $=s=>document.querySelector(s);
const ME={fin:82,dri:80,pas:74,hea:76,vol:78,tac:58,pen:80,comp:78};
const KIT={us:{shirt:'#7cc4ff',dark:'#3f86c4',shorts:'#f4f6f8',socks:'#7cc4ff',boot:'#111',num:'#0d2238'},them:{shirt:'#d22f45',dark:'#8e1a2b',shorts:'#1b1b22',socks:'#d22f45',boot:'#f2f2f2',num:'#fff'},gk:{shirt:'#c4ef4a',dark:'#7e9c22',shorts:'#1b1b1b',socks:'#c4ef4a',boot:'#111',num:'#111'},gk2:{shirt:'#ff8a1f',dark:'#b5560a',shorts:'#1b1b1b',socks:'#ff8a1f',boot:'#111',num:'#111'}};
const SKIN=['#8a5a3b','#c98e64','#5a3a26','#e2b48f','#a8714d','#6e4630'], HAIR=['#16100b','#2b1d12','#0e0b09','#6b4a2b','#1b1410','#3a2614'];

// ===== situations =====
const SCN={
  counter:{label:'Counter',eyebrow:"Champions League · QF 2nd leg · 84'",title:'Break on them',text:'1-1 on the night, 2-2 on aggregate. They pushed up and left space in behind. Score and you\'re in the semi-final.',
    bug:{h:'NGT',a:'RIV',hs:1,as:1,clk:'84:12',sub:'UCL QF 2nd leg · agg 2-2'},
    us:[{n:9,name:'You',me:1,x:-2,y:37},{n:7,name:'Okafor',x:15,y:31,role:'run'},{n:10,name:'Lindqvist',x:-14,y:30,role:'run'},{n:8,name:'Brandt',x:6,y:43,role:'sup'}],
    them:[{n:6,x:0,y:32.5},{n:5,x:-5,y:23},{n:4,x:6,y:23.5},{n:3,x:-15.5,y:25},{n:2,x:15.5,y:24}],gk:{x:0,y:1.6}},
  edge:{label:'Edge of the box',eyebrow:"League · derby · 90+2'",title:'Last chance',text:'2-2 in stoppage time. You\'ve got it 20 yards out with a man on you. Beat him, find a pass or hit it.',
    bug:{h:'NGT',a:'WHT',hs:2,as:2,clk:'92:40',sub:'League · derby'},
    us:[{n:9,name:'You',me:1,x:3,y:22},{n:7,name:'Okafor',x:15,y:23,role:'run'},{n:10,name:'Lindqvist',x:-9,y:18.5,role:'run'}],
    them:[{n:6,x:2.6,y:19.3},{n:5,x:-3.5,y:13},{n:4,x:7.5,y:12.5},{n:3,x:-10.5,y:15},{n:2,x:12.5,y:17.5}],gk:{x:.4,y:1.7}},
  cross:{label:'Cross',eyebrow:"Champions League · group · 71'",title:'Get it in the box',text:'0-1 down. Okafor is free on the wing and you\'re in the box. Whip it in, then attack the ball. Tap as it arrives to head or volley it.',
    bug:{h:'NGT',a:'BSL',hs:0,as:1,clk:'71:30',sub:'UCL group stage'},
    us:[{n:7,name:'Okafor',x:24,y:15},{n:9,name:'You',me:1,x:1,y:15,role:'run',run:[-1.5,6.5]},{n:10,name:'Lindqvist',x:-8,y:18,role:'run',run:[-5,9]}],
    them:[{n:2,x:21,y:12.5},{n:5,x:2.5,y:10},{n:4,x:-3,y:9.5},{n:3,x:-10,y:12},{n:6,x:6,y:19}],gk:{x:1.2,y:1.6}},
  defend:{label:'Tackle',eyebrow:"League · 88' · 1-0 up",title:'Last man back',text:'Your corner broke down. You\'re the only one back and their winger is running at you. Hold and drag to move. Tap to tackle. Swipe to slide in.',
    bug:{h:'NGT',a:'WHT',hs:1,as:0,clk:'88:21',sub:'League · protect the lead'},def:1,
    us:[{n:9,name:'You',me:1,x:-1,y:24},{n:4,name:'Varga',x:9,y:31,role:'cover'}],
    them:[{n:11,x:-5,y:38,role:'carry'},{n:9,x:8,y:40,role:'run'}],gk:{x:0,y:1.6}},
  pen:{label:'Penalty',eyebrow:"Cup final · 88'",title:'From the spot',text:'0-0 with two minutes left. You won the penalty and you\'re taking it. Their keeper likes to dive early.',
    bug:{h:'NGT',a:'KST',hs:0,as:0,clk:'88:03',sub:'Cup final'},pen:1,
    us:[{n:9,name:'You',me:1,x:0,y:11.7}],them:[],gk:{x:0,y:.15},
    extras:[{t:'us',x:-8,y:19.5},{t:'them',x:-5,y:20.2},{t:'us',x:-2,y:20.8},{t:'them',x:2,y:20.8},{t:'us',x:5,y:20.2},{t:'them',x:8,y:19.5}]}
};

// ===== state =====
const C=$('#c'), X=C.getContext('2d');
let W=0,H=0,DPR=1,CY=400, ST=null, scnKey='counter', tally={g:0,n:0}, simT=0, TOUCH=null;
const ball={x:0,y:0,z:0,vx:0,vy:0,vz:0,c:0,owner:null,spin:0,trail:[]};
const net=Array.from({length:21},(_,i)=>({x:-GW+i*(2*GW/20),d:0,v:0}));

function mkP(o,team,i){ return {team,num:o.n||0,name:o.name||'',me:!!o.me,role:o.role||'',run:o.run||null,x:o.x,y:o.y,vx:0,vy:0,tx:o.x,ty:o.y,face:Math.PI*1.5,spd:team==='gk'?5.6:team==='us'?7.4:7.0,extra:!!o.extra,skin:SKIN[(i*5+2)%SKIN.length],hair:HAIR[(i*3+1)%HAIR.length],ph:rnd()*6,sp:0,act:null,z:0,roll:0,stun:0,cd:0,touchCd:0,dive:0,diveDir:1}; }
function start(k){ scnKey=k||scnKey; const s=SCN[scnKey]; const P=[]; let i=0;
  s.us.forEach(o=>P.push(mkP(o,'us',i++))); s.them.forEach(o=>P.push(mkP(o,'them',i++)));
  const gk=mkP(s.gk,'gk',i++); gk.num=1; P.push(gk); (s.extras||[]).forEach(o=>P.push(mkP({...o,extra:1},o.t,i++)));
  const def=!!s.def; ST={mode:def?'def':'att',phase:'intro',P,gk,carrier:null,pass:null,shot:null,air:null,result:null,endAt:0,lastPasser:null,lastShooter:null,path:null,pathT:0,pathT0:0,slow:1,pen:!!s.pen,tried:new Set(),kickQ:null,joy:null,inNet:false,hitWood:null,kp:null,kpDone:0,first:true,ai:{t:0,side:0,passed:false}};
  net.forEach(n=>{ n.d=0; n.v=0; }); ball.trail=[]; ball.z=0;
  const c=def?P.find(p=>p.role==='carry'):P[s.start||0]; ST.carrier=c; giveBall(c); faceGoal(c);
  P.forEach(p=>{ if(p.team==='us'&&!def) p.face=-Math.PI/2; if(p.team==='them') p.face=def?-Math.PI/2:Math.PI/2; if(p.team==='gk') p.face=Math.PI/2; if(def&&p.team==='us') p.face=Math.PI/2; });
  if(def){ gk.team='gk'; ST.kitGK='gk2'; } else ST.kitGK='gk';
  if(def) defInit(); else ST.me_down=()=>false;
  planRuns(); positionKeeper(true); camSnap(); renderBug(); renderChips(); hideBig(); showIntro(); say(''); }
const team=t=>ST.P.filter(p=>p.team===t&&!p.extra);
const live=()=>ST.P.filter(p=>!p.extra);
const meP=()=>ST.P.find(p=>p.me);

// ===== ball physics =====
function stepBall(b,dt){ const hs=Math.hypot(b.vx,b.vy);
  if(b.z>0.001||b.vz>0.01){ const sp=Math.hypot(hs,b.vz);
    b.vx-=DRAG*sp*b.vx*dt; b.vy-=DRAG*sp*b.vy*dt; b.vz-=(DRAG*sp*b.vz+G)*dt;
    if(b.c&&hs>1){ const a=b.c*Math.min(1,hs/18), nx=-b.vy/hs, ny=b.vx/hs; b.vx+=nx*a*dt; b.vy+=ny*a*dt; b.c*=Math.exp(-.25*dt); }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
    if(b.z<=0){ b.z=0; if(b.vz<-1.4){ b.vz=-b.vz*.48; b.vx*=.8; b.vy*=.8; b.c*=.3; } else b.vz=0; }
  } else { b.z=0; b.vz=0; if(hs>0){ const ns=Math.max(0,hs-(ROLL+DRAG*hs*hs)*dt); b.vx*=ns/hs; b.vy*=ns/hs; b.c*=Math.exp(-2*dt); } b.x+=b.vx*dt; b.y+=b.vy*dt; } }
function predict(b0,T){ const b={x:b0.x,y:b0.y,z:b0.z,vx:b0.vx,vy:b0.vy,vz:b0.vz,c:b0.c}; const out=[]; const dt=1/60;
  for(let t=0;t<=T;t+=dt){ out.push({t,x:b.x,y:b.y,z:b.z,s:Math.hypot(b.vx,b.vy)}); for(let k=0;k<4;k++) stepBall(b,dt/4); if(b.y<-GD-.5) break; } return out; }
function crossY(b0,yp,T=3){ const b={x:b0.x,y:b0.y,z:b0.z,vx:b0.vx,vy:b0.vy,vz:b0.vz,c:b0.c}; const dt=1/240; let t=0;
  while(t<T){ const px=b.x,py=b.y,pz=b.z; stepBall(b,dt); t+=dt; if(b.y<=yp&&py>yp){ const f=(py-yp)/(py-b.y); return {x:px+(b.x-px)*f,z:pz+(b.z-pz)*f,t:t-dt+dt*f,s:Math.hypot(b.vx,b.vy,b.vz)}; } if(b.z<=0&&Math.hypot(b.vx,b.vy)<.4) return null; } return null; }
function solve(from,aimX,ht,speed,c){ const z0=from.z||0; let th=Math.atan2(aimX-from.x,from.y); let T=from.y/speed; let vz=(ht-z0+.5*G*T*T)/T;
  for(let i=0;i<12;i++){ const b={x:from.x,y:from.y,z:z0,vx:Math.sin(th)*speed,vy:-Math.cos(th)*speed,vz,c}; const cr=crossY(b,0); if(!cr){ vz+=1.5; continue; } th+=(aimX-cr.x)/Math.max(4,from.y)*.95; vz+=(ht-cr.z)/Math.max(.2,cr.t)*.9; }
  return {vx:Math.sin(th)*speed,vy:-Math.cos(th)*speed,vz}; }
// a lofted ball that arrives at (tx,ty) at about head height
function loft(from,tx,ty,zA){ const d=Math.hypot(tx-from.x,ty-from.y), ux=(tx-from.x)/d, uy=(ty-from.y)/d; let vh=clamp(d/(.5+d/17),9,25), T=d/vh*1.12, vz=(zA+.5*G*T*T)/T;
  for(let i=0;i<6;i++){ const b={x:from.x,y:from.y,z:0,vx:ux*vh,vy:uy*vh,vz,c:0}; let t=0,z=null; const dt=1/120; while(t<4){ const px=b.x,py=b.y; stepBall(b,dt); t+=dt; if(Math.hypot(b.x-from.x,b.y-from.y)>=d){ z=b.z; break; } if(b.z<=0&&b.vz<=0&&t>.2&&Math.hypot(b.vx,b.vy)<1) break; } if(z==null){ vh*=1.12; continue; } vz+=(zA-z)/Math.max(.3,t)*.9; }
  return {vx:ux*vh,vy:uy*vh,vz}; }

// ===== possession helpers =====
function giveBall(p){ ball.owner=p; ball.vx=ball.vy=ball.vz=0; ball.c=0; ball.z=0; stickBall(); }
function stickBall(){ const p=ball.owner; if(!p) return; if(p.team==='gk'){ const h=hands(p); ball.x=h.x; ball.y=h.y; ball.z=Math.max(0,p.z+.95); return; } ball.x=p.x+Math.cos(p.face)*.5; ball.y=p.y+Math.sin(p.face)*.5; ball.z=0; }
function faceGoal(p){ p.face=Math.atan2(0-p.y,(p.x*.15)-p.x); }
function offsideLine(){ const ys=ST.P.filter(p=>(p.team==='them'||p.team==='gk')&&!p.extra).map(p=>p.y).sort((a,b)=>a-b); return ys.length>1?ys[1]:0; }
function isOff(p){ if(ST.mode!=='att'||ST.pen) return false; const L=offsideLine(); return p.team==='us'&&p!==ST.carrier&&p.y<L-.25&&p.y<ball.y-.2; }
function planRuns(){ const car=ST.carrier; if(!car) return; if(ST.mode==='def'){ return; } const lanes=[-9,-3,3,9]; const used=[];
  team('us').filter(m=>m!==car).forEach(m=>{ if(m.role==='sup'){ m.tx=clamp(car.x+(m.x>=car.x?8:-8),-26,26); m.ty=car.y+6; return; }
    if(m.run&&ST.first){ m.tx=m.run[0]; m.ty=m.run[1]; return; }
    let L=null; lanes.forEach(l=>{ if(!used.includes(l)&&(L==null||Math.abs(l-m.x)<Math.abs(L-m.x))) L=l; }); used.push(L);
    m.tx=L; m.ty=Math.max(6.5,Math.min(m.y,car.y)-10); }); }
function positionKeeper(snap){ const g=ST.gk; if(ST.pen){ g.tx=0; g.ty=.15; } else { const by=Math.max(1,ball.y); const ky=clamp(1.1+Math.max(0,22-by)*.05,1,2.4); g.ty=ky; g.tx=clamp(ball.x*ky/by*1.15,-2.2,2.2); } if(snap){ g.x=g.tx; g.y=g.ty; } }
function hands(g){ const sp=g.dive>0?.6+g.dive*.9:.35; return {x:g.x+(g.dive>0?g.diveDir*sp:0),y:g.y+.3}; }
const footPt=p=>({x:p.x+Math.cos(p.face)*.45,y:p.y+Math.sin(p.face)*.45});
const inBox=(x,y)=>Math.abs(x)<20.16&&y<16.5&&y>0;

// ===== camera (a TV gantry on the near side) =====
const CAMD=36, CAMZ=17, NRM=Math.hypot(CAMD,CAMZ); const F=[-CAMD/NRM,0,-CAMZ/NRM], U=[-CAMZ/NRM,0,CAMD/NRM];
const cam={x:0,y:20,f:600,shake:0};
function P3(x,y,z){ const dx=x-(cam.x+CAMD), dy=y-cam.y, dz=z-CAMZ; const dep=dx*F[0]+dz*F[2]; const s=cam.f/Math.max(.5,dep); return [W/2-dy*s, CY-(dx*U[0]+dz*U[2])*s, s, dep]; }
function unproj(sx,sy){ const hz=CY-cam.f*(F[2]/(-U[2]))+12; sy=Math.max(sy,CY-cam.f*Math.tan(Math.atan2(CAMZ,CAMD))+18); const a=(sx-W/2)/cam.f, b=-(sy-CY)/cam.f; const d=[F[0]+b*U[0],-a,F[2]+b*U[2]]; if(d[2]>=-.01) d[2]=-.01; const t=-CAMZ/d[2]; return {x:cam.x+CAMD+d[0]*t,y:cam.y+d[1]*t}; }

    if(facing>-.2){ const fc=P3(W3.hd[0]+ch*.05,W3.hd[1]+sh*.05,W3.hd[2]-.02); X.beginPath(); X.arc(fc[0],fc[1],r*.78,0,7); X.fillStyle=sk; X.fill(); } }});
  parts.sort((a,b)=>b.d-a.d).forEach(q=>q.f());
  if(p.me&&!p.extra){ const [hx,hy]=Pj.hd; const t='YOU'; X.font='800 11px Barlow,system-ui,sans-serif'; X.textAlign='center'; X.textBaseline='middle'; const w=X.measureText(t).width+10; X.fillStyle='#ffd24a'; rr(hx-w/2,hy-s0*.38-18,w,15,4); X.fill(); X.fillStyle='#0a120e'; X.fillText(t,hx,hy-s0*.38-10.5); }
  if(ST.phase==='aim'&&isOff(p)){ const [hx,hy]=Pj.hd; X.font='800 10px Barlow,system-ui,sans-serif'; X.textAlign='center'; X.fillStyle='#ff5a6a'; X.fillText('OFFSIDE',hx,hy-s0*.38-(p.me?24:8)); } }
function shade(hex,f){ const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255; return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`; }
function rr(x,y,w,h,r){ X.beginPath(); X.moveTo(x+r,y); X.arcTo(x+w,y,x+w,y+h,r); X.arcTo(x+w,y+h,x,y+h,r); X.arcTo(x,y+h,x,y,r); X.arcTo(x,y,x+w,y,r); X.closePath(); }
function drawBall(){ const [gx,gy,gs]=P3(ball.x,ball.y,0), [x,y,s]=P3(ball.x,ball.y,ball.z+R); const r=Math.max(2.6,R*1.3*s);
  const sh=[]; for(let i=0;i<10;i++){ const t=i/10*Math.PI*2; sh.push([ball.x+Math.cos(t)*.17*(1+ball.z*.1),ball.y+Math.sin(t)*.17*(1+ball.z*.1)]); } poly(sh,`rgba(0,0,0,${.4/(1+ball.z*.5)})`);
  if(ball.trail.length>2){ X.beginPath(); ball.trail.forEach((t,i)=>{ const q=P3(t[0],t[1],t[2]+R); i?X.lineTo(q[0],q[1]):X.moveTo(q[0],q[1]); }); X.lineTo(x,y); X.lineCap='round'; X.lineWidth=r*1.3; X.strokeStyle='rgba(255,255,255,.14)'; X.stroke(); }
  X.save(); X.translate(x,y); X.beginPath(); X.arc(0,0,r,0,7); X.fillStyle='#fbfbf6'; X.fill(); X.rotate(ball.spin); X.fillStyle='#1b1b1b'; for(let i=0;i<3;i++){ const a=i*2.094; X.beginPath(); X.arc(Math.cos(a)*r*.58,Math.sin(a)*r*.58,r*.27,0,7); X.fill(); } X.beginPath(); X.arc(0,0,r*.22,0,7); X.fill();
  const hl=X.createRadialGradient(-r*.35,-r*.4,0,0,0,r); hl.addColorStop(0,'rgba(255,255,255,.5)'); hl.addColorStop(.6,'rgba(255,255,255,0)'); hl.addColorStop(1,'rgba(0,0,0,.28)'); X.beginPath(); X.arc(0,0,r,0,7); X.fillStyle=hl; X.fill(); X.restore(); }
function drawUI(){ const T=TOUCH, J=ST.joy;
  if(J){ X.beginPath(); X.arc(J.sx,J.sy,60,0,7); X.lineWidth=2; X.strokeStyle='rgba(255,255,255,.35)'; X.stroke(); X.fillStyle='rgba(255,255,255,.06)'; X.fill(); X.beginPath(); X.arc(J.kx,J.ky,22,0,7); X.fillStyle='rgba(255,255,255,.55)'; X.fill(); }
  else if(T&&T.pts.length>1){ const it=T.it; const k=cam.f/NRM;
    if(it&&it.kind==='pass'){ const to=it.to; const risky=team('them').some(d=>distSeg(d,ball,to)<1.5); const a=P3(ball.x,ball.y,0), b=P3(to.x,to.y,0); X.setLineDash([6,6]); X.beginPath(); X.moveTo(a[0],a[1]); X.lineTo(b[0],b[1]); X.lineWidth=2.5; X.strokeStyle=it.lofted?'#7cc4ff':risky?'#ffb02e':'#5fe08a'; X.stroke(); X.setLineDash([]);
      const ring=[]; for(let i=0;i<=24;i++){ const t=i/24*Math.PI*2; ring.push([to.x+Math.cos(t)*.8,to.y+Math.sin(t)*.8]); } pline(ring,2,it.lofted?'#7cc4ff':risky?'#ffb02e':'#5fe08a'); tag(b[0],b[1]-b[2]*2.3,(it.lofted?(to.y<22?'CROSS':'CHIP'):'PASS')+(risky&&!it.lofted?' · RISKY':''),it.lofted?'#7cc4ff':risky?'#ffb02e':'#5fe08a'); }
    if(it&&it.kind==='shot'){ const ht=shotHeight(it.p); const v=solve(ball,it.gx,ht,clamp(19+Math.min(it.p,1)*10+it.vel*2.4,18,33.5),-it.bow*15); const b={x:ball.x,y:ball.y,z:0,vx:v.vx,vy:v.vy,vz:v.vz,c:-it.bow*15}; const pth=predict(b,2).filter(s=>s.y>-.2);
      X.setLineDash([2,7]); X.lineCap='round'; X.beginPath(); pth.forEach((s,i)=>{ const q=P3(s.x,s.y,s.z+R); i?X.lineTo(q[0],q[1]):X.moveTo(q[0],q[1]); }); X.lineWidth=3; X.strokeStyle='rgba(255,255,255,.8)'; X.stroke(); X.setLineDash([]);
      const over=ht>GH-.12, wide=Math.abs(it.gx)>GW; const m=P3(0,0,Math.min(ht,GH+.6)); const mm=P3(clamp(it.gx,-GW-2,GW+2),0,Math.min(ht,GH+.6)); X.beginPath(); X.arc(mm[0],mm[1],Math.max(6,.3*mm[2]),0,7); X.lineWidth=2.5; X.strokeStyle=over||wide?'#ff5a6a':'#ffd24a'; X.stroke(); tag(mm[0],mm[1]-Math.max(16,.8*mm[2]),over?'OVER':wide?'WIDE':it.bow?'CURL':'SHOOT',over||wide?'#ff5a6a':'#ffd24a'); }
    if(it&&it.kind==='space'){ const a=P3(ball.x,ball.y,0), b=P3(ball.x+it.ux*it.d,ball.y+it.uy*it.d,0); X.setLineDash([6,6]); X.beginPath(); X.moveTo(a[0],a[1]); X.lineTo(b[0],b[1]); X.lineWidth=2; X.strokeStyle='rgba(255,255,255,.5)'; X.stroke(); X.setLineDash([]); tag(b[0],b[1]-14,'INTO SPACE','#e9f1f6'); }
    X.beginPath(); T.pts.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1])); X.lineCap='round'; X.lineJoin='round'; X.lineWidth=7; X.strokeStyle='rgba(255,255,255,.22)'; X.stroke(); X.lineWidth=2.5; X.strokeStyle='rgba(255,255,255,.9)'; X.stroke(); }
  // the air ball: a ring where he'll meet it, tightening as it arrives
  if(ST.air){ const A=ST.air; const left=A.tC-simT; const c=P3(A.x,A.y,A.z); const r=Math.max(10,(12+clamp(left,0,.8)*60)); X.beginPath(); X.arc(c[0],c[1],r,0,7); X.lineWidth=3; X.strokeStyle=Math.abs(left)<.13?'#5fe08a':'#ffd24a'; X.stroke(); X.beginPath(); X.arc(c[0],c[1],10,0,7); X.lineWidth=1.5; X.strokeStyle='rgba(255,255,255,.7)'; X.stroke(); tag(c[0],c[1]-r-14,A.kind==='header'?'TAP · HEADER':'TAP · VOLLEY','#ffd24a'); } }
function tag(x,y,t,col){ X.font='800 12px Barlow,system-ui,sans-serif'; X.textAlign='center'; X.textBaseline='middle'; const w=X.measureText(t).width+12; X.fillStyle='rgba(8,14,11,.85)'; rr(x-w/2,y-10,w,20,5); X.fill(); X.fillStyle=col; X.fillText(t,x,y+.5); }
function distSeg(p,a,b){ const vx=b.x-a.x, vy=b.y-a.y, l=vx*vx+vy*vy||1; const t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/l,0,1); return Math.hypot(a.x+vx*t-p.x,a.y+vy*t-p.y); }
function draw(){ X.setTransform(DPR,0,0,DPR,0,0); X.clearRect(0,0,W,H); if(cam.shake>0) X.translate((rnd()-.5)*cam.shake*14,(rnd()-.5)*cam.shake*14);
  drawWorld(); drawGoal('back');
  const items=ST.P.map(p=>({d:P3(p.x,p.y,1)[3],f:()=>drawPlayer(p)})); items.push({d:P3(ball.x,ball.y,ball.z)[3]-.05,f:drawBall}); items.push({d:P3(GW,0,1)[3],f:()=>drawGoal('front')});
  items.sort((a,b)=>b.d-a.d).forEach(i=>i.f()); drawUI(); }

// ===== loop =====
let last=performance.now();
function frame(now){ requestAnimationFrame(frame); const real=Math.min(.04,(now-last)/1000); last=now; if(!ST) return;
  const ph=ST.phase; let run=ph!=='intro'&&ph!=='done'&&ph!=='aim';
  if(ST.mode==='def'&&ph==='def') run=ST.touching||ST.busy>0||!!ST.pass||!!ST.kickQ||!!ST.myTackle; if(ST.result&&ph!=='done') run=true;
  let slow=1; if(ST.phase==='shot'&&!ST.result&&ST.kp){ const left=ST.kp.T-(simT-ST.pathT0); if(left<.42&&left>-.25) slow=.32; } if(ST.air){ slow=.3; } if(ST.result&&ST.result.kind==='goal'&&simT<ST.endAt-1.3) slow=.5;
  ST.slow+=(slow-ST.slow)*Math.min(1,real*10); const dt=run?real*ST.slow:0;
  if(dt>0){ simT+=dt; if(ST.busy>0) ST.busy-=dt;
    if(ST.kickQ&&simT>=ST.kickQ.at){ const q=ST.kickQ; ST.kickQ=null; q.fn(); }
    // your dribble
    if(ST.mode==='att'&&(ph==='drib'||ph==='settle')&&ST.carrier&&!ST.result){ const r=dribble(ST.carrier,ph==='drib'?ST.joy:null,dt); if(r==='lost'){ ST.carrier=null; finish('lost','Lost it','Knocked it too far. Turned over.'); } else if(r===true&&ph==='settle'){ giveBall(ST.carrier); ST.phase='aim'; say(''); } resolveTackle(); }
    physics(dt); updateAI(dt); updateKeeper(dt); stepPlayers(dt); airResolve();
    if(ST.mode==='att'&&ph==='pass'&&!ST.result&&!ball.owner&&Math.hypot(ball.vx,ball.vy)<.6&&ball.z<=0){ ST.looseT=(ST.looseT||0)+dt; const near=live().filter(p=>p.team!=='gk').sort((a,b)=>Math.hypot(a.x-ball.x,a.y-ball.y)-Math.hypot(b.x-ball.x,b.y-ball.y))[0]; if(near){ near.tx=ball.x; near.ty=ball.y; near.sprint=true; } if(ST.looseT>2) finish('lost','Lost it','Nobody gets there first. Turned over.'); } else ST.looseT=0;
    if(ST.phase==='shot'&&!ST.result&&Math.hypot(ball.vx,ball.vy)<.4&&ball.z<=0&&simT-ST.pathT0>1) finish(ST.mode==='def'?'won':'saved','Off target','It dies before it gets there.');
    if(ST.mode==='def'&&ST.phase==='shot'&&ST.shot&&!ST.result&&simT-ST.pathT0>3.5) finish('won','Cleared','Scrambled away.');
    if(ST.result&&ST.phase!=='done'&&simT>=ST.endAt){ ST.phase='done'; showResult(); } }
  animPlayers(real*(run?ST.slow:.25)); ST.P.forEach(p=>{ if(p.act&&p.act.k==='cele'&&dt===0) p.act.t+=real; }); updateNet(dt||real*.0);
  const hs=Math.hypot(ball.vx,ball.vy); ball.spin+=hs*dt/(R*3); if(hs>10&&!ball.owner&&dt>0){ ball.trail.push([ball.x,ball.y,ball.z]); if(ball.trail.length>9) ball.trail.shift(); } else if(ball.trail.length&&dt>0) ball.trail.shift();
  camStep(real); draw(); }

// ===== HUD =====
function renderBug(){ const b=SCN[scnKey].bug; $('#bug').innerHTML=`<div class="tm"><i style="background:var(--home)"></i>${b.h}</div><div class="sc">${b.hs}–${b.as}</div><div class="tm">${b.a}<i style="background:var(--away)"></i></div><div class="clk"><b>${b.clk}</b><small>${b.sub}</small></div>`; }
function renderChips(){ $('#chips').innerHTML=Object.entries(SCN).map(([k,s])=>`<button class="chip" aria-pressed="${k===scnKey}" data-k="${k}">${s.label}</button>`).join(''); }
$('#chips').addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(b) start(b.dataset.k); });
function hint(){ if(!ST) return ''; if(ST.mode==='def') return ST.phase==='def'?'Time moves when you do. Hold and drag to move · tap to tackle · swipe to slide':''; if(ST.phase!=='aim') return ''; if(ST.pen) return 'Swipe at goal. Longer swipe, higher shot. Bend it to curl.'; return ST.first?'Hold and drag to dribble · quick swipe to pass or shoot · long swipe chips or crosses · bend it to curl':'Dribble, pass or shoot.'; }
function say(t){ const s=$('#say'); if(!ST){ s.innerHTML=''; return; } const h=hint(); s.innerHTML=`${t?`<b>${t}</b>`:''}${h?`<small>${h}</small>`:''}`; s.parentNode.hidden=!t&&!h; }
function showBig(t,g){ const b=$('#big'); b.className='big'+(g?' g':''); b.textContent=t; b.hidden=false; }
function hideBig(){ $('#big').hidden=true; }
function showIntro(){ const s=SCN[scnKey]; const ctl=s.def?[['Move','Hold and drag anywhere'],['Tackle','Tap. Win it when he lets it run'],['Slide','Swipe toward the ball. Miss and you\'re on the floor']]:s.pen?[['Shoot','Swipe at the goal'],['Height','Longer swipe, higher shot'],['Curl','Bend your swipe']]:[['Dribble','Hold and drag anywhere. Time moves when you do'],['Pass','Quick swipe at a teammate. Long swipe chips it'],['Shoot','Quick swipe at goal. Bend it to curl'],['Head/volley','Tap as the cross arrives']];
  $('#cardBox').innerHTML=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p>${s.text}</p><ul>${ctl.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('')}</ul><div class="row"><button class="btn" id="go">Play</button></div>`; $('#card').hidden=false;
  $('#go').onclick=()=>{ $('#card').hidden=true; ST.phase=ST.mode==='def'?'def':'aim'; if(ST.mode==='def'){ defInit(); } SFX.ambient(); say(''); }; }
function showResult(){ const r=ST.result; tally.n++; hideBig(); const keys=Object.keys(SCN); const nx=keys[(keys.indexOf(scnKey)+1)%keys.length]; const won=['goal','won','pen_won','fk_won'].includes(r.kind)&&ST.mode!=='def'||ST.mode==='def'&&r.kind==='won';
  const penBtn=r.extra&&r.extra.pen?`<button class="btn" id="takepen">Take the penalty</button>`:`<button class="btn" id="next">${SCN[nx].label}</button>`;
  $('#cardBox').innerHTML=`<div class="eyebrow">${won?'Moment won':'Moment lost'} · ${tally.g} of ${tally.n} this session</div><h1>${r.title}</h1><p>${r.line}</p><div class="row"><button class="btn sec" id="again">Again</button>${penBtn}</div>`; $('#card').hidden=false;
  $('#again').onclick=()=>{ start(scnKey); $('#go').click(); }; const nb=$('#next'); if(nb) nb.onclick=()=>start(nx); const pb=$('#takepen'); if(pb) pb.onclick=()=>start('pen'); }

// ===== sound =====
const SFX=(()=>{ let ac=null,on=false,amb=null; const noise=d=>{ const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate); const a=b.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=rnd()*2-1; return b; };
  function burst(d,f,q,g,type='bandpass'){ if(!on) return; const s=ac.createBufferSource(); s.buffer=noise(d); const fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const gn=ac.createGain(); const t=ac.currentTime; gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(fl).connect(gn).connect(ac.destination); s.start(); }
  function tone(f,d,g,type='sine'){ if(!on) return; const o=ac.createOscillator(); o.type=type; o.frequency.value=f; const gn=ac.createGain(); const t=ac.currentTime; gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(gn).connect(ac.destination); o.start(); o.stop(t+d); }
  return { toggle(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; } } on=!on; if(on){ ac.resume(); this.ambient(); } else if(amb){ amb.stop(); amb=null; } return on; },
    ambient(){ if(!on||amb) return; amb=ac.createBufferSource(); amb.buffer=noise(3); amb.loop=true; const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=600; f.Q.value=.6; const g=ac.createGain(); g.gain.value=.05; amb.connect(f).connect(g).connect(ac.destination); amb.start(); },
    kick(p){ tone(90,.12,.5*p+.2); burst(.05,1800,1,.3*p+.1); }, touch(v){ tone(140,.06,.12*(v||1)); }, post(){ tone(1650,.5,.18,'triangle'); tone(2480,.35,.08,'triangle'); }, parry(){ burst(.08,900,1.2,.35); }, catch(){ burst(.1,500,1,.35); tone(110,.1,.2); },
    net(){ burst(.5,3200,.7,.25,'highpass'); }, roar(p){ burst(2.6*p+.6,700,.5,.5*p,'bandpass'); }, whistle(){ tone(2900,.35,.12,'square'); } }; })();
$('#snd').onclick=e=>{ const on=SFX.toggle(); e.currentTarget.innerHTML=on?'Sound<br>on':'Sound<br>off'; e.currentTarget.setAttribute('aria-pressed',on); };

// ===== boot =====
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; C.width=Math.round(W*DPR); C.height=Math.round(H*DPR); const hud=document.querySelector('.hud').getBoundingClientRect(); CY=hud.bottom+(H-hud.bottom)*(W<H?.42:.5); }
window.addEventListener('resize',resize); resize(); makeCrowd(); start('counter'); resize(); camSnap(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(resize); requestAnimationFrame(frame);
window.__m={state:()=>({phase:ST.phase,res:ST.result&&ST.result.kind,carrier:ST.carrier&&ST.carrier.num,ball:[ball.x,ball.y,ball.z].map(v=>+v.toFixed(2)),me:[meP().x,meP().y].map(v=>+v.toFixed(1))}),
  play:()=>{ $('#go').click(); }, act:(it)=>{ if(it.to!=null) it.to=team('us').find(p=>p.num===it.to); act(it); }, joy:(x,y,m)=>{ if(ST.mode==='att'&&ST.phase==='aim'){ ST.phase='drib'; ball.owner=null; } ST.joy=x==null?null:{x,y,m:m||1,sx:-99,sy:-99,kx:-99,ky:-99}; ST.touching=x!=null; if(x==null&&ST.phase==='drib') ST.phase='settle'; },
  tap:()=>{ if(ST.air) ST.air.tap=simT; }, tackle:(d)=>defTackle(d||null), proj:(x,y,z)=>P3(x,y,z||0), start};
</script>
