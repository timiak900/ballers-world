<style>
/* Layout: a TV-camera night match fills the screen. Scorebug on top, joystick under the left thumb, action buttons under the right */
:root{
  --night:#070c0a; --panel:rgba(8,14,11,.86); --rule:rgba(255,255,255,.15);

  --disp:'Saira Condensed','Arial Narrow',Impact,sans-serif; --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toprow{display:flex;gap:8px;align-items:stretch}
.bug{flex:1;min-width:0;display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow:hidden;font-family:var(--disp);letter-spacing:.02em}
.bug .tm{display:flex;align-items:center;gap:6px;padding:5px 8px;font-weight:800;font-size:18px;white-space:nowrap}
.bug .tm i{width:5px;align-self:stretch;border-radius:2px}
.bug .sc{display:flex;align-items:center;padding:0 9px;font-weight:800;font-size:21px;white-space:nowrap;background:rgba(255,255,255,.07);font-variant-numeric:tabular-nums}
.bug .clk{margin-left:auto;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;padding:3px 9px;min-width:0}
.bug .clk b{font-size:19px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.bug .clk small{font-family:var(--body);font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.snd{flex:none;width:58px;pointer-events:auto;background:var(--panel);border:1px solid var(--rule);color:var(--ink);border-radius:6px;padding:0 6px;font:600 12px/1.15 var(--body)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--panel);border:1px solid var(--rule);color:var(--ink);border-radius:999px;padding:7px 12px;font:700 12px var(--body);letter-spacing:.04em;text-transform:uppercase}
.chip[aria-pressed=true]{background:var(--ink);color:var(--night)}
.say{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 96px);z-index:5;max-width:min(520px,calc(100% - 32px));background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:7px 13px;font:700 14px/1.3 var(--body);color:var(--gold);text-align:center;pointer-events:none}
.pad{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;gap:10px;align-items:end;justify-items:end}
.b{border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 15px var(--disp);letter-spacing:.06em;text-transform:uppercase;color:var(--night);position:relative;overflow:hidden;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.35)}

.card .box{width:min(370px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:9px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.card .row{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;border:0;border-radius:10px;padding:13px 10px;font:800 17px var(--disp);letter-spacing:.05em;text-transform:uppercase;background:var(--ink);color:var(--night)}

@media (prefers-reduced-motion:no-preference){ .big:not([hidden]){animation:pop .5s cubic-bezier(.2,1.6,.4,1)} @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}} }

<script>
// ===== world: x across the pitch, y = distance from the goal line we attack, z up. metres, seconds =====
const G=9.81, DRAG=0.0135, ROLL=2.3, R=0.11, GW=3.66, GH=2.44, GD=2.0, ROOF=1.0, SPEED=.85;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), sig=x=>1/(1+Math.exp(-x)), rnd=Math.random, lerp=(a,b,t)=>a+(b-a)*t;
const gauss=()=>{ let u=0,v=0; while(!u) u=rnd(); while(!v) v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
const $=s=>document.querySelector(s);
const ME={fin:82,dri:80,pas:74,hea:76,vol:78,tac:58,pen:80,comp:78,pace:84};
const KIT={us:{shirt:'#7cc4ff',shorts:'#f4f6f8',socks:'#7cc4ff',boot:'#111',num:'#0d2238'},them:{shirt:'#d22f45',shorts:'#1b1b22',socks:'#d22f45',boot:'#f2f2f2',num:'#fff'},gk:{shirt:'#c4ef4a',shorts:'#1b1b1b',socks:'#c4ef4a',boot:'#111',num:'#111'},gk2:{shirt:'#ff8a1f',shorts:'#1b1b1b',socks:'#ff8a1f',boot:'#111',num:'#111'}};
const SKIN=['#8a5a3b','#c98e64','#5a3a26','#e2b48f','#a8714d','#6e4630'], HAIR=['#16100b','#2b1d12','#0e0b09','#6b4a2b','#1b1410','#3a2614'];

// ===== situations (the near touchline is x = -34) =====
const SCN={
  counter:{label:'Counter',eyebrow:"Champions League · QF 2nd leg · 84'",title:'Break on them',text:'1-1 on the night, 2-2 on aggregate. Brandt has it in midfield. Make a run in behind and call for it. Score and you\'re in the semi-final.',
    bug:{h:'NGT',a:'RIV',hs:1,as:1,clk:'84:12',sub:'UCL QF 2nd leg · agg 2-2'},carry:'Brandt',
    us:[{n:9,name:'You',me:1,x:-3,y:30.5},{n:8,name:'Brandt',x:2,y:41},{n:7,name:'Okafor',x:15,y:33,role:'run'},{n:10,name:'Lindqvist',x:-14,y:34,role:'run'}],
    them:[{n:6,x:6,y:33.5},{n:5,x:-3.4,y:28.8},{n:4,x:6,y:27.5},{n:3,x:-15,y:29},{n:2,x:15,y:29}],gk:{x:0,y:1.6}},
  edge:{label:'Edge of the box',eyebrow:"League · derby · 90+2'",title:'Last chance',text:'2-2 in stoppage time. You\'ve got it 20 yards out with a man on you. Beat him, lay it off or hit it.',
    bug:{h:'NGT',a:'WHT',hs:2,as:2,clk:'92:40',sub:'League · derby'},carry:'You',
    us:[{n:9,name:'You',me:1,x:-3,y:22},{n:7,name:'Okafor',x:-15,y:23,role:'run'},{n:10,name:'Lindqvist',x:9,y:18.5,role:'run'}],
    them:[{n:6,x:-2.6,y:19.4},{n:5,x:3.5,y:13},{n:4,x:-7.5,y:12.5},{n:3,x:10.5,y:15},{n:2,x:-12.5,y:17.5}],gk:{x:-.4,y:1.7}},
  cross:{label:'Cross',eyebrow:"Champions League · group · 71'",title:'Attack the cross',text:'0-1 down. Okafor is flying down the wing. Lose your man, call for it, and tap Shoot as the ball arrives to head or volley it.',
    bug:{h:'NGT',a:'BSL',hs:0,as:1,clk:'71:30',sub:'UCL group stage'},carry:'Okafor',
    us:[{n:7,name:'Okafor',x:-25,y:24,role:'wing'},{n:9,name:'You',me:1,x:-1,y:17},{n:10,name:'Lindqvist',x:7,y:20,role:'run'}],
    them:[{n:2,x:-21,y:15.5},{n:5,x:-.4,y:15.6},{n:4,x:4,y:13},{n:3,x:-6,y:12},{n:6,x:3,y:22}],gk:{x:-1,y:1.7}},
  defend:{label:'Tackle',eyebrow:"League · 88' · 1-0 up",title:'Last man back',text:'Your corner broke down. You\'re the only one back and their winger is running at you. Stay on your feet, show him wide, pick your moment.',
    bug:{h:'NGT',a:'WHT',hs:1,as:0,clk:'88:21',sub:'League · protect the lead'},def:1,
    us:[{n:9,name:'You',me:1,x:1,y:24},{n:4,name:'Varga',x:-9,y:31,role:'cover'}],
    them:[{n:11,x:5,y:38,role:'carry',pace:8.2},{n:9,x:-8,y:40,role:'run'}],gk:{x:0,y:1.6}},
  pen:{label:'Penalty',eyebrow:"Cup final · 88'",title:'From the spot',text:'0-0 with two minutes left. You won it, you\'re taking it. Their keeper likes to go early.',
    bug:{h:'NGT',a:'KST',hs:0,as:0,clk:'88:03',sub:'Cup final'},pen:1,
    us:[{n:9,name:'You',me:1,x:1.05,y:13.6}],them:[],gk:{x:0,y:.2},
    extras:[{t:'us',x:-9,y:19.5},{t:'them',x:-6,y:20.3},{t:'us',x:-3,y:20.8},{t:'them',x:3,y:20.8},{t:'us',x:6,y:20.3},{t:'them',x:9,y:19.5}]}
};

// ===== state =====
const C=$('#c'), X=C.getContext('2d');
let W=0,H=0,DPR=1,CY=400, ST=null, scnKey='counter', tally={g:0,n:0}, simT=0;
const ball={x:0,y:0,z:0,vx:0,vy:0,vz:0,c:0,owner:null,spin:0,trail:[]};
const net=Array.from({length:21},(_,i)=>({x:-GW+i*(2*GW/20),d:0,v:0}));
function mkP(o,team,i){ return {team,num:o.n||0,name:o.name||'',me:!!o.me,role:o.role||'',x:o.x,y:o.y,vx:0,vy:0,tx:o.x,ty:o.y,face:-Math.PI/2,spd:o.pace||(team==='gk'?5.6:o.me?ME.pace/11.2:team==='us'?7.2:7.0),extra:!!o.extra,skin:SKIN[(i*5+2)%SKIN.length],hair:HAIR[(i*3+1)%HAIR.length],ph:rnd()*6,sp:0,act:null,z:0,stun:0,cd:0,touchCd:0,dive:0,diveDir:1,held:0,think:0}; }
function start(k){ scnKey=k||scnKey; const s=SCN[scnKey]; const P=[]; let i=0;
  s.us.forEach(o=>P.push(mkP(o,'us',i++))); s.them.forEach(o=>P.push(mkP(o,'them',i++)));
  const gk=mkP(s.gk,'gk',i++); gk.num=1; gk.face=Math.PI/2; P.push(gk); (s.extras||[]).forEach(o=>P.push(mkP({...o,extra:1},o.t,i++)));
  ST={mode:s.def?'def':s.pen?'pen':'att',phase:'intro',P,gk,carrier:null,pass:null,shot:null,air:null,result:null,endAt:0,lastPasser:null,lastShooter:null,path:null,pathT:0,pathT0:0,slow:1,tried:new Set(),kickQ:null,J:null,inNet:false,hitWood:null,kp:null,kpDone:0,callT:-9,ai:{t:0,side:0,passed:false},charge:null,aim:{x:-1.6,z:1.2},penStage:0,kitGK:s.def?'gk2':'gk',btn:{}};
  net.forEach(n=>{ n.d=0; n.v=0; }); ball.trail=[]; ball.z=0; ball.vx=ball.vy=ball.vz=0; ball.owner=null;
  P.forEach(p=>{ if(p.team==='them') p.face=s.def?-Math.PI/2:Math.PI/2; if(s.def&&p.team==='us') p.face=Math.PI/2; });
  if(ST.mode==='pen'){ const me=meP(); ball.x=0; ball.y=11; me.face=Math.atan2(11-me.y,0-me.x); }
  else { const c=s.def?P.find(p=>p.role==='carry'):P.find(p=>p.name===s.carry); ST.carrier=c; c.face=Math.atan2(-c.y,(c.x*.2)-c.x); ball.x=c.x+Math.cos(c.face)*.5; ball.y=c.y+Math.sin(c.face)*.5; c.held=c.me?1:-.35; }
  if(ST.mode==='att'){ const me=meP(); ST.marker=team('them').slice().sort((a,b)=>Math.hypot(a.x-me.x,a.y-me.y)-Math.hypot(b.x-me.x,b.y-me.y))[0]; if(ST.carrier===me) ST.marker=null; }
  planRuns(); positionKeeper(true); camSnap(); renderBug(); renderChips(); hideBig(); setPad(null); showIntro(); say(''); }
const team=t=>ST.P.filter(p=>p.team===t&&!p.extra);
const live=()=>ST.P.filter(p=>!p.extra);
const meP=()=>ST.P.find(p=>p.me);

// ===== ball physics =====
function stepBall(b,dt){ const hs=Math.hypot(b.vx,b.vy);
  if(b.z>0.001||b.vz>0.01){ const sp=Math.hypot(hs,b.vz);
    b.vx-=DRAG*sp*b.vx*dt; b.vy-=DRAG*sp*b.vy*dt; b.vz-=(DRAG*sp*b.vz+G)*dt;
    if(b.c&&hs>1){ const a=b.c*Math.min(1,hs/18), nx=-b.vy/hs, ny=b.vx/hs; b.vx+=nx*a*dt; b.vy+=ny*a*dt; b.c*=Math.exp(-.25*dt); }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt;
    if(b.z<=0){ b.z=0; if(b.vz<-1.4){ b.vz=-b.vz*.48; b.vx*=.8; b.vy*=.8; b.c*=.3; } else b.vz=0; }
  } else { b.z=0; b.vz=0; if(hs>0){ const ns=Math.max(0,hs-(ROLL+DRAG*hs*hs)*dt); b.vx*=ns/hs; b.vy*=ns/hs; b.c*=Math.exp(-2*dt); } b.x+=b.vx*dt; b.y+=b.vy*dt; } }
function predict(b0,T){ const b={x:b0.x,y:b0.y,z:b0.z,vx:b0.vx,vy:b0.vy,vz:b0.vz,c:b0.c}; const out=[]; const dt=1/60;
  for(let t=0;t<=T;t+=dt){ out.push({t,x:b.x,y:b.y,z:b.z,s:Math.hypot(b.vx,b.vy)}); for(let k=0;k<4;k++) stepBall(b,dt/4); if(b.y<-GD-.5) break; } return out; }
function crossY(b0,yp,T=3){ const b={x:b0.x,y:b0.y,z:b0.z,vx:b0.vx,vy:b0.vy,vz:b0.vz,c:b0.c}; const dt=1/240; let t=0;
  while(t<T){ const px=b.x,py=b.y,pz=b.z; stepBall(b,dt); t+=dt; if(b.y<=yp&&py>yp){ const f=(py-yp)/(py-b.y); return {x:px+(b.x-px)*f,z:pz+(b.z-pz)*f,t:t-dt+dt*f,s:Math.hypot(b.vx,b.vy,b.vz)}; } if(b.z<=0&&Math.hypot(b.vx,b.vy)<.4) return null; } return null; }
function solve(from,aimX,ht,speed,c){ const z0=from.z||0; let th=Math.atan2(aimX-from.x,from.y); let T=from.y/speed; let vz=(ht-z0+.5*G*T*T)/T;
  for(let i=0;i<12;i++){ const b={x:from.x,y:from.y,z:z0,vx:Math.sin(th)*speed,vy:-Math.cos(th)*speed,vz,c}; const cr=crossY(b,0); if(!cr){ vz+=1.5; continue; } th+=(aimX-cr.x)/Math.max(4,from.y)*.95; vz+=(ht-cr.z)/Math.max(.2,cr.t)*.9; }
  return {vx:Math.sin(th)*speed,vy:-Math.cos(th)*speed,vz}; }
function loft(from,tx,ty,zA){ const d=Math.hypot(tx-from.x,ty-from.y), ux=(tx-from.x)/d, uy=(ty-from.y)/d; let vh=clamp(d/(.5+d/17),9,25), T=d/vh*1.12, vz=(zA+.5*G*T*T)/T;
  for(let i=0;i<6;i++){ const b={x:from.x,y:from.y,z:0,vx:ux*vh,vy:uy*vh,vz,c:0}; let t=0,z=null; const dt=1/120; while(t<4){ stepBall(b,dt); t+=dt; if(Math.hypot(b.x-from.x,b.y-from.y)>=d){ z=b.z; break; } if(b.z<=0&&b.vz<=0&&t>.2&&Math.hypot(b.vx,b.vy)<1) break; } if(z==null){ vh*=1.12; continue; } vz+=(zA-z)/Math.max(.3,t)*.9; }
  return {vx:ux*vh,vy:uy*vh,vz}; }

// ===== helpers =====
function stickBall(){ const p=ball.owner; if(!p) return; if(p.team==='gk'){ const h=hands(p); ball.x=h.x; ball.y=h.y; ball.z=Math.max(0,p.z+.95); return; } ball.x=p.x+Math.cos(p.face)*.5; ball.y=p.y+Math.sin(p.face)*.5; ball.z=0; }
function giveBall(p){ ball.owner=p; ball.vx=ball.vy=ball.vz=0; ball.c=0; stickBall(); }
const footPt=p=>({x:p.x+Math.cos(p.face)*.45,y:p.y+Math.sin(p.face)*.45});
const atFeet=p=>{ const f=footPt(p); return Math.hypot(ball.x-f.x,ball.y-f.y)<.75&&ball.z<.4; };
const inBox=(x,y)=>Math.abs(x)<20.16&&y<16.5&&y>0;
function offsideLine(){ const ys=ST.P.filter(p=>(p.team==='them'||p.team==='gk')&&!p.extra).map(p=>p.y).sort((a,b)=>a-b); return ys.length>1?ys[1]:0; }
function isOff(p){ if(ST.mode!=='att') return false; const L=offsideLine(); return p.team==='us'&&p!==ST.carrier&&p.y<L-.25&&p.y<ball.y-.2; }
function nearestOpp(p){ let m=99,o=null; ST.P.forEach(q=>{ if(q.extra||q.team===p.team||q.team==='gk'||(p.team==='gk')) return; const d=Math.hypot(q.x-p.x,q.y-p.y); if(d<m){ m=d; o=q; } }); return {d:m,o}; }
function oppNear(x,y){ let m=99; team('them').forEach(q=>{ m=Math.min(m,Math.hypot(q.x-x,q.y-y)); }); return m; }
function distSeg(p,a,b){ const vx=b.x-a.x, vy=b.y-a.y, l=vx*vx+vy*vy||1; const t=clamp(((p.x-a.x)*vx+(p.y-a.y)*vy)/l,0,1); return Math.hypot(a.x+vx*t-p.x,a.y+vy*t-p.y); }
function laneRisk(a,b){ let m=99; team('them').forEach(q=>{ if(q.stun>0) return; m=Math.min(m,distSeg(q,a,b)); }); return m; }

const CAM={p:[0,0,0],F:[1,0,0],R:[0,-1,0],U:[0,0,1],f:600}; const cs={px:-34,py:20,pz:16,lx:0,ly:20,lz:0,f:600};

let last=performance.now();
function frame(now){ requestAnimationFrame(frame); const real=Math.min(.04,(now-last)/1000); last=now; if(!ST||window.__headless) return; tick(real); camStep(real); draw(); }
function tick(real){
  const run=ST.phase==='live'||(ST.result&&ST.phase!=='done');
  let slow=1; if(ST.shot&&!ST.result&&ST.kp){ const left=ST.kp.T-(simT-ST.pathT0); if(left<.42&&left>-.25) slow=.35; } if(ST.air&&ST.air.p.me) slow=.4; if(ST.result&&ST.result.kind==='goal'&&simT<ST.endAt-1.3) slow=.5;
  ST.slow+=(slow-ST.slow)*Math.min(1,real*10); const dt=run?real*ST.slow*SPEED:0;
  if(dt>0){ simT+=dt; if(ST.kickQ&&simT>=ST.kickQ.at){ const q=ST.kickQ; ST.kickQ=null; q.fn(); }
    if(ST.want){ if(simT>ST.want.until||ST.carrier!==meP()) ST.want=null; else if(canKick(meP())&&!ST.kickQ){ const f=ST.want.fn; ST.want=null; f(); } }
    physics(dt); if(!ST.result) updateAI(dt); updateKeeper(dt); stepPlayers(dt); airResolve();
    if(ST.shot&&!ST.result&&Math.hypot(ball.vx,ball.vy)<.4&&ball.z<=0&&simT-ST.pathT0>1) finish(ST.mode==='def'?'won':'saved','Off target','It dies before it gets there.');
    if(ST.mode==='def'&&ST.shot&&!ST.result&&simT-ST.pathT0>3.5) finish('won','Cleared','Scrambled away.');
    if(ST.mode==='def'&&!ST.result&&!ST.shot&&simT-(ST.t0||0)>13) finish('won','Held him up','You stood him up until help arrived.');
    if(ST.result&&ST.phase!=='done'&&simT>=ST.endAt){ ST.phase='done'; if(!window.__headless) showResult(); } }
  animPlayers(real*(run?ST.slow*SPEED:.25)); ST.P.forEach(p=>{ if(p.act&&p.act.k==='cele'&&dt===0) p.act.t+=real; }); updateNet(dt);
  const hs=Math.hypot(ball.vx,ball.vy); ball.spin+=hs*dt/(R*3); if(hs>10&&!ball.owner&&dt>0){ ball.trail.push([ball.x,ball.y,ball.z]); if(ball.trail.length>9) ball.trail.shift(); } else if(ball.trail.length&&dt>0) ball.trail.shift();
  // buttons follow the play
  if(ST.phase==='live'&&!ST.result){ const me=meP(); let k='wait'; if(ST.mode==='def') k='def'; else if(ST.mode==='pen') k=ST.penStage?'wait':'pen'; else if(ST.air&&ST.air.p.me) k='air'; else if(ST.carrier===me) k='ball'; else if(!ST.shot) k='off'; setPad(k); }
  if(ST.charge){ $('#pw').style.height=Math.min(100,chargeP()/1.2*100)+'%'; } else $('#pw').style.height='0'; }

function showBig(t,g){ const b=$('#big'); b.className='big'+(g?' g':''); b.textContent=t; b.hidden=false; }
function hideBig(){ $('#big').hidden=true; }
function showIntro(){ const s=SCN[scnKey]; const ctl=s.def?[['Move','Hold anywhere on the left and drag'],['Tackle','Wait until he lets it run, then tap'],['Slide','Commits you. Miss and you\'re on the floor']]:s.pen?[['Aim','Drag on the goal'],['Shoot','Hold for power, release to strike. Too much and it\'s in row Z']]:[['Move','Hold anywhere on the left and drag'],['Call','Shout for it when you\'re free'],['Shoot','Hold for power. Push the stick to pick a corner'],['Pass/Cross','Tap. Goes to whoever you\'re facing'],['Headers','Tap Shoot as the cross arrives']];
  $('#cardBox').innerHTML=`<div class="eyebrow">${s.eyebrow}</div><h1>${s.title}</h1><p>${s.text}</p><ul>${ctl.map(([a,b])=>`<li><b>${a}</b><span>${b}</span></li>`).join('')}</ul><div class="row"><button class="btn" id="go">Play</button></div>`; $('#card').hidden=false;
  $('#go').onclick=()=>{ $('#card').hidden=true; ST.phase='live'; ST.t0=simT; SFX.ambient(); SFX.whistle(); if(ST.mode!=='pen') $('#joyhint').hidden=false; }; }
function showResult(){ const r=ST.result; tally.n++; hideBig(); const keys=Object.keys(SCN); const nx=keys[(keys.indexOf(scnKey)+1)%keys.length]; const won=ST.mode==='def'?r.kind==='won':['goal','pen_won','fk_won'].includes(r.kind);
  const nextBtn=r.extra&&r.extra.pen?`<button class="btn" id="takepen">Take the penalty</button>`:`<button class="btn" id="next">${SCN[nx].label}</button>`;
  $('#cardBox').innerHTML=`<div class="eyebrow">${won?'Moment won':'Moment lost'} · ${tally.g} of ${tally.n} this session</div><h1>${r.title}</h1><p>${r.line}</p><div class="row"><button class="btn sec" id="again">Again</button>${nextBtn}</div>`; $('#card').hidden=false;
  $('#again').onclick=()=>{ start(scnKey); $('#go').click(); }; const nb=$('#next'); if(nb) nb.onclick=()=>start(nx); const pb=$('#takepen'); if(pb) pb.onclick=()=>start('pen'); }

// ===== sound =====
const SFX=(()=>{ let ac=null,on=false,amb=null; const noise=d=>{ const b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate); const a=b.getChannelData(0); for(let i=0;i<a.length;i++) a[i]=rnd()*2-1; return b; };
  function burst(d,f,q,g,type='bandpass'){ if(!on) return; const s=ac.createBufferSource(); s.buffer=noise(d); const fl=ac.createBiquadFilter(); fl.type=type; fl.frequency.value=f; fl.Q.value=q; const gn=ac.createGain(); const t=ac.currentTime; gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(fl).connect(gn).connect(ac.destination); s.start(); }
  function tone(f,d,g,type='sine'){ if(!on) return; const o=ac.createOscillator(); o.type=type; o.frequency.value=f; const gn=ac.createGain(); const t=ac.currentTime; gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.001,t+d); o.connect(gn).connect(ac.destination); o.start(); o.stop(t+d); }
  return { toggle(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; } } on=!on; if(on){ ac.resume(); this.ambient(); } else if(amb){ amb.stop(); amb=null; } return on; },
    ambient(){ if(!on||amb) return; amb=ac.createBufferSource(); amb.buffer=noise(3); amb.loop=true; const f=ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=600; f.Q.value=.6; const g=ac.createGain(); g.gain.value=.05; amb.connect(f).connect(g).connect(ac.destination); amb.start(); },
    kick(p){ tone(90,.12,.5*p+.2); burst(.05,1800,1,.3*p+.1); }, touch(v){ tone(140,.06,.12*(v||1)); }, post(){ tone(1650,.5,.18,'triangle'); tone(2480,.35,.08,'triangle'); }, parry(){ burst(.08,900,1.2,.35); }, catch(){ burst(.1,500,1,.35); tone(110,.1,.2); },
    net(){ burst(.5,3200,.7,.25,'highpass'); }, roar(p){ burst(2.6*p+.6,700,.5,.5*p,'bandpass'); }, whistle(){ tone(2900,.35,.12,'square'); }, call(){ burst(.18,1200,2,.12); } }; })();
$('#snd').onclick=e=>{ const on=SFX.toggle(); e.currentTarget.innerHTML=on?'Sound<br>on':'Sound<br>off'; e.currentTarget.setAttribute('aria-pressed',on); };

// ===== boot =====
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); W=window.innerWidth; H=window.innerHeight; C.width=Math.round(W*DPR); C.height=Math.round(H*DPR); const hud=document.querySelector('.hud').getBoundingClientRect(); CY=hud.bottom+(H-hud.bottom)*(W<H?.4:.48); }
window.addEventListener('resize',resize); resize(); makeCrowd(); start('counter'); resize(); camSnap(); if(document.fonts&&document.fonts.ready) document.fonts.ready.then(resize); requestAnimationFrame(frame);
window.simTime=()=>simT; window.ballPos=()=>ball; window.offL=()=>offsideLine(); window.__m={tick, ST:()=>ST, me:meP, myShot, myPass, penShoot, defTackle, state:()=>{ const me=meP(); return {phase:ST.phase,res:ST.result&&ST.result.kind,title:ST.result&&ST.result.title,carrier:ST.carrier&&ST.carrier.num,ball:[ball.x,ball.y,ball.z].map(v=>+v.toFixed(1)),me:[me.x,me.y].map(v=>+v.toFixed(1)),air:!!ST.air,pad:padKey}; },
  play:()=>$('#go').click(), joy:(x,y,m)=>{ ST.J=x==null?null:{x,y,m:m==null?1:m}; }, down:id=>btnDown(id), up:id=>btnUp(id), aim:(x,z)=>{ ST.aim={x,z}; }, proj:(x,y,z)=>P3(x,y,z||0), start};
</script>
