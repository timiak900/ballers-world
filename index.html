const BENCH={ST:{acc:.42,conv:.16,pass:.72,drib:.45,duel:.45,aer:.45,lost:13,kp:1,def:.8},LW:{acc:.38,conv:.12,pass:.76,drib:.5,duel:.45,aer:.35,lost:13,kp:1.5,def:1},RW:{acc:.38,conv:.12,pass:.76,drib:.5,duel:.45,aer:.35,lost:13,kp:1.5,def:1},CAM:{acc:.38,conv:.11,pass:.8,drib:.5,duel:.45,aer:.35,lost:11,kp:2,def:1.2},CM:{acc:.33,conv:.08,pass:.85,drib:.5,duel:.5,aer:.45,lost:8,kp:1.2,def:2.5},CDM:{acc:.3,conv:.06,pass:.87,drib:.5,duel:.55,aer:.5,lost:6,kp:.7,def:4},CB:{acc:.3,conv:.06,pass:.86,drib:.5,duel:.58,aer:.6,lost:5,kp:.3,def:3.5},LB:{acc:.3,conv:.06,pass:.8,drib:.5,duel:.52,aer:.45,lost:8,kp:1,def:3},RB:{acc:.3,conv:.06,pass:.8,drib:.5,duel:.52,aer:.45,lost:8,kp:1,def:3}};
function improveList(t){ const m=S.me, b=BENCH[m.pos]||BENCH.CM, out=[]; const p90=x=>t.mins?x/t.mins*90:0; if(t.mins<270) return out;
  const add=(ok,area,msg,attrs,sess,score)=>{ if(!ok) out.push({area,msg,attrs,sess,score}); };
  if(t.sh>=8){ add(t.sot/t.sh>=b.acc,'Shot accuracy',`${Math.round(t.sot/t.sh*100)}% on target (aim for ${Math.round(b.acc*100)}%+)`,['fin','pow','com'],'Attacking',b.acc-t.sot/t.sh); add(t.g/t.sh>=b.conv,'Finishing',`${Math.round(t.g/t.sh*100)}% of shots scored (aim for ${Math.round(b.conv*100)}%+)`,['fin','com','pos'],'Attacking',(b.conv-t.g/t.sh)*2); }
  if(t.xg>=3&&t.g<t.xg-1.5) add(false,'Big chances',`${t.g} goals from ${t.xg.toFixed(1)} xG: you're leaving goals out there`,['fin','com'],'Attacking',(t.xg-t.g)/t.xg);
  if(t.pa>=60) add(t.pc/t.pa>=b.pass,'Passing',`${Math.round(t.pc/t.pa*100)}% completion (aim for ${Math.round(b.pass*100)}%+)`,['sho','vis','com'],'Possession',b.pass-t.pc/t.pa);
  if(t.drA>=8) add(t.drib/t.drA>=b.drib,'Dribbling',`${Math.round(t.drib/t.drA*100)}% of take-ons completed (aim for ${Math.round(b.drib*100)}%+)`,['dri','agi','bal'],'Attacking',b.drib-t.drib/t.drA);
  if(t.dA>=20) add(t.dW/t.dA>=b.duel,'Duels',`${Math.round(t.dW/t.dA*100)}% of duels won (aim for ${Math.round(b.duel*100)}%+)`,['str','sta','agg'],'Defensive',b.duel-t.dW/t.dA);
  if(t.aA>=8) add(t.aW/t.aA>=b.aer,'Aerials',`${Math.round(t.aW/t.aA*100)}% of headers won (aim for ${Math.round(b.aer*100)}%+)`,['hea','jum','str'],'Set pieces',b.aer-t.aW/t.aA);
  if(t.touch>=150) add(p90(t.lost)<=b.lost,'Ball retention',`${p90(t.lost).toFixed(1)} possessions lost per 90 (aim for under ${b.lost})`,['bc','com','bal'],'Possession',(p90(t.lost)-b.lost)/b.lost);
  add(p90(t.kp)>=b.kp*.8,'Chance creation',`${p90(t.kp).toFixed(1)} key passes per 90 (aim for ${b.kp}+)`,['vis','cro','sho'],'Possession',(b.kp-p90(t.kp))/b.kp*.6);
  if(['CB','LB','RB','CDM','CM'].includes(m.pos)) add(p90((t.tk||0)+(t.int||0))>=b.def*.8,'Defensive work',`${p90((t.tk||0)+(t.int||0)).toFixed(1)} tackles + interceptions per 90 (aim for ${b.def}+)`,['sta','int','def'],'Defensive',(b.def-p90((t.tk||0)+(t.int||0)))/b.def);
  return out.sort((a,b)=>b.score-a.score).slice(0,4); }
function splitRows(rs){ const g=(l,arr)=>{ const r=arr.map(x=>x.rating).filter(x=>x!=null); return `<div class="bd"><div class="bdl"><b>${l}</b><span>${arr.length} game${arr.length===1?'':'s'}${arr.length?` · ${arr.reduce((s,x)=>s+(x.g||0),0)} G · ${arr.reduce((s,x)=>s+(x.a||0),0)} A`:''}</span></div><div></div>${r.length?rt(avg(r)):'<span class="rt n">–</span>'}</div>`; };
  const k=rs.filter(x=>x.ol!=null&&x.ml!=null); return g('Home',rs.filter(x=>x.home))+g('Away',rs.filter(x=>!x.home))+(k.length?g('vs stronger teams',k.filter(x=>x.ol-x.ml>=4))+g('vs similar teams',k.filter(x=>Math.abs(x.ol-x.ml)<4))+g('vs weaker teams',k.filter(x=>x.ml-x.ol>=4)):''); }
function depthView(t,rs){ const p90=x=>t.mins?(x/t.mins*90).toFixed(1):'0.0'; const pc=(a,b)=>b?Math.round(a/b*100)+'%':'–';
  const sec=(title,rows)=>`<div class="lbl">${title}</div><div class="kv skv">${rows.map(([l,v])=>`<span>${l}</span><b class="num">${v}</b>`).join('')}</div>`;
  const imp=improveList(t);
  return `${imp.length?`<div class="impbox"><div class="lbl" style="color:var(--text)">Where you're losing marks</div>${imp.map(x=>`<div class="imp"><div><b>${x.area}</b><span>${esc(x.msg)}</span><span class="note">Work on ${x.attrs.map(k=>`${ANAME[k]} <b>${S.me.attrs[k]}</b>`).join(' · ')}</span></div><button class="btn sec" data-act="go" data-arg="training:0">${esc(x.sess)} training ›</button></div>`).join('')}</div>`:(t.mins>=270?'<p class="note">Nothing stands out as a weakness right now. Keep it up.</p>':'<p class="note">Play a few more full games and this page will show where you can improve.</p>')}
   ${sec('Shooting',[['Shots per 90',p90(t.sh||0)],['On target',pc(t.sot||0,t.sh||0)],['Conversion',pc(t.g,t.sh||0)],['Goals vs xG',`${t.g} / ${(t.xg||0).toFixed(1)} (${(t.g-(t.xg||0))>=0?'+':''}${(t.g-(t.xg||0)).toFixed(1)})`],['Shots inside the box',pc(t.sIn||0,t.sh||0)],['Big chances missed',t.bcm||0]])}
   ${sec('Passing & creating',[['Passes per 90',p90(t.pa||0)],['Pass completion',pc(t.pc||0,t.pa||0)],['Key passes per 90',p90(t.kp||0)],['Assists',t.a]])}
   ${sec('On the ball',[['Touches per 90',p90(t.touch||0)],['Take-ons per 90',p90(t.drA||0)],['Take-on success',pc(t.drib||0,t.drA||0)],['Possession lost per 90',p90(t.lost||0)]])}
   ${sec('Without the ball',[['Pressures per 90',p90(t.press||0)],['Tackles per 90',p90(t.tk||0)],['Interceptions per 90',p90(t.int||0)],['Duels won',`${pc(t.dW||0,t.dA||0)} (${t.dW||0}/${t.dA||0})`],['Aerials won',`${pc(t.aW||0,t.aA||0)} (${t.aW||0}/${t.aA||0})`]])}
   ${rs.length?`<div class="lbl">Form splits</div><div class="bdlist">${splitRows(rs)}</div>`:''}`; }
VIEWS['career:0']=()=>{ const m=S.me; const cur={s:S.season,y:S.year,club:myClubId(),ss:m.ss,current:true}; const all=m.career.concat([cur]); const F=SCOPES[CSCOPE].f; CSEASON=CSEASON||'all';
  const nats=CSCOPE==='intl'?[...new Set(all.flatMap(c=>Object.keys(c.ss||{}).filter(k=>k.startsWith('I:')).map(intlNationOf)))]:[]; if(CSCOPE==='intl'&&(!INAT||!nats.includes(INAT))) INAT=nats[0]||null;
  const tabs=`<div class="seg">${Object.entries(SCOPES).map(([k,v])=>`<button class="chip" aria-pressed="${CSCOPE===k}" data-act="cscope" data-arg="${k}">${v.n}</button>`).join('')}</div>`;
  const modeT=`<div class="mtabs"><button class="${STATMODE==='overview'?'on':''}" data-act="statmode" data-arg="overview">Overview</button><button class="${STATMODE==='depth'?'on':''}" data-act="statmode" data-arg="depth">In-depth</button></div>`;
  const natT=nats.length>1?`<div class="seg">${nats.map(n=>`<button class="chip" aria-pressed="${INAT===n}" data-act="inat" data-arg="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:'';
  const pick=`<select data-ch="cseason" aria-label="Season"><option value="all" ${CSEASON==='all'?'selected':''}>All seasons</option>${all.slice().reverse().map(c=>`<option value="${c.s}" ${String(CSEASON)===String(c.s)?'selected':''}>${c.y}/${String(c.y+1).slice(2)}${c.current?' (current)':''}</option>`).join('')}</select>`;
  const seasons=CSEASON==='all'?all:all.filter(x=>String(x.s)===String(CSEASON));
  const tot=sumSS(seasons.flatMap(c=>statScopeEntries(c,F).map(([,v])=>v)));
  for(const k of ['drA','dA','dW','aA','aW','sIn','sOut','lost','press','pc','pa','int','touch','bcm']) tot[k]=seasons.flatMap(c=>statScopeEntries(c,F).map(([,v])=>v[k]||0)).reduce((s,x)=>s+x,0);
  let rs; if(CSCOPE==='intl') rs=(m.intl.history||[]).filter(h=>!INAT||h.nation===INAT||(!h.nation&&INAT===nationRow(m.intlNat)[1])).map(h=>({rating:h.rating,g:h.g,a:h.a,home:true})).reverse(); else rs=(m.results||[]).filter(r=>(CSCOPE==='youth')===!!r.youth&&r.rating!=null&&r.mins&&(CSEASON==='all'||String(r.s)===String(CSEASON)));
  const head=`<div class="stack">${modeT}<div class="split">${tabs}<span class="grow"></span>${pick}</div>${natT}`;
  const empty={club:'No senior club appearances yet.',intl:'No international games yet. Keep performing and the call will come.',youth:'No club youth games recorded.'}[CSCOPE];
  if(!tot.apps) return `<div class="dash c1">${W('Career stats',`${head}<p class="empty">${empty}</p></div>`)}</div>`;
  if(STATMODE==='depth') return `<div class="dash c1">${W('Career stats',`${head}${depthView(tot,CSCOPE==='intl'?[]:rs)}</div>`)}</div>`;
  const ar=avg(tot.rat); const p90=tot.mins?((tot.g+tot.a)/tot.mins*90).toFixed(2):'0.00';
  const big=[['Apps',tot.apps],['Goals',tot.g],['Assists',tot.a],['Avg rating',ar?ar.toFixed(2):'–']];
  const more=[['Starts',tot.starts],['Minutes',tot.mins.toLocaleString()],['Goals + assists per 90',p90],['Expected goals (xG)',tot.xg.toFixed(1)],['Shots',`${tot.sh}${tot.sh?` · ${Math.round(tot.sot/tot.sh*100)}% on target`:''}`],['Key passes',tot.kp],['Player of the Match',tot.motm]].concat(['GK','CB','LB','RB','CDM'].includes(m.pos)?[['Clean sheets',tot.cs]]:[]).concat([['Yellow cards',tot.yc]]);
  let rows; if(CSEASON==='all') rows=all.slice().reverse().map(c=>{ const l=statScopeEntries(c,F); if(!l.length) return ''; const sub=CSCOPE==='intl'?l.map(([k])=>compName(k)).join(', '):(c.club!=null?cname(c.club):'Free agent')+(c.loan?' (loan)':''); return bdRow(`${c.y}/${String(c.y+1).slice(2)}`,sub,sumSS(l.map(([,v])=>v))); }).join('');
  else rows=seasons.flatMap(c=>statScopeEntries(c,F)).map(([k,v])=>bdRow(esc(compName(k)),'',sumSS([v]))).join('');
  return `<div class="dash c1">${W('Career stats',`${head}<div class="sbig">${big.map(([l,v])=>`<div><b class="num">${v}</b><span>${l}</span></div>`).join('')}</div>
   <div class="kv skv">${more.map(([l,v])=>`<span>${l}</span><b class="num">${v}</b>`).join('')}</div><div class="lbl">Rating form</div>${ratingTrend2(rs.map(r=>r.rating))}
   <div class="lbl">${CSEASON==='all'?'By season':'By competition'}</div><div class="bdlist">${rows}<div class="bd tot"><div class="bdl"><b>Total</b></div><div class="bdn"><span><b>${tot.apps}</b>apps</span><span><b>${tot.g}</b>G</span><span><b>${tot.a}</b>A</span></div>${ar?rt(ar):'<span class="rt n">–</span>'}</div></div></div>`)}</div>`; };

{ const _soc=VIEWS['media:2']; VIEWS['media:2']=()=>{ const m=S.me; const s=Math.round(m.sent==null?55:m.sent); const fh=m.folHist||[]; const wk=fh.length>=2?m.followers-fh[fh.length-2]:0; const cd=(m.postCd||0)>evDayAbs();

   ${W(`This season · ${S.year}/${String(S.year+1).slice(2)}`,`<div class="kv skv">${line('Wages',season.wage)}${line('Sponsors',season.spons)}${line('Match bonuses',season.bonus)}${line('Tax',season.tax,true)}${line('Agent',season.agent,true)}${line('Lifestyle',season.life,true)}${line('Fines',season.fines,true)}${line('Other',season.other,season.other<0)}</div>`)}

// ---------- timeline, legacy, awards nights ----------
function timelineItems(){ const m=S.me, it=[]; const yOf=s=>{ const c=(m.career||[]).find(x=>x.s===s); return c?c.y:S.year-(S.season-s); };
  for(const [id,b] of Object.entries(m.badges||{})){ const B=(typeof BADGES!=='undefined'?BADGES:[]).find(x=>x[0]===id); if(!B) continue; if(!/debut|first_goal|first_assist|first_motm|hat|goals50|goals100|apps100|apps50/.test(id)) continue; it.push({y:b.y,k:'badge',t:B[2],d:B[3]}); }
  (m.moves||[]).forEach(x=>it.push({y:x.y,k:'move',t:`${x.type==='Loan'?'Loan to':'Joined'} ${club(x.to)?club(x.to).name:'a new club'}`,d:x.fee?`Fee ${money(x.fee)}`:x.type}));
  (m.trophies||[]).forEach(x=>it.push({y:x.y,k:'trophy',t:x.name,d:x.club!=null&&club(x.club)?club(x.club).name:x.nation||''}));
  (m.awards||[]).filter(a=>!/Player of the Month/.test(a.name)).forEach(x=>it.push({y:x.y,k:'award',t:x.name,d:''}));
  const firsts={}; (m.intl.history||[]).slice().reverse().forEach(h=>{ const k=(h.nation||'')+h.level; if(firsts[k]) return; firsts[k]=1; it.push({y:null,when:h.when,k:'intl',t:`First ${h.level==='Senior'?'senior':h.level} cap${h.nation?' for '+h.nation:''}`,d:`vs ${h.opp}`}); });
  (m.tourHist||[]).forEach(t=>it.push({y:t.y,k:'tour',t:`${t.name}${t.won?' winner':''}`,d:`${t.nation}${t.lvl==='Senior'?'':' '+t.lvl} · ${t.won?'Champions':'Out in the '+String(t.out).toLowerCase()}`}));
  if(m.retired) it.push({y:m.retired.y,k:'retire',t:'Retired',d:`Aged ${m.retired.age}`});
  return it.sort((a,b)=>(b.y||0)-(a.y||0)); }

// ---------- light / dark mode (remembered on this device) ----------
function themePref(){ try{ return localStorage.getItem('bw-theme')||'dark'; }catch(e){ return 'dark'; } }
function applyTheme(){ const p=themePref(); const light=p==='light'||(p==='system'&&typeof matchMedia!=='undefined'&&matchMedia('(prefers-color-scheme: light)').matches); document.documentElement.setAttribute('data-theme',light?'light':'dark'); try{ const mt=document.querySelector('meta[name="theme-color"]'); if(mt) mt.setAttribute('content',light?'#f3f5f9':'#0a0e15'); }catch(e){} }
try{ applyTheme(); if(typeof matchMedia!=='undefined') matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme); }catch(e){}
VIEWS['saves:2']=()=>{ const p=themePref(); return `<div class="dash c1">${W('Appearance',`<div class="stack"><div class="lfgrid">${[['dark','Dark','Easy on the eyes at night.'],['light','Light','Bright and clear in daylight.'],['system','Match my phone','Follows your phone’s light or dark setting.']].map(([k,l,d])=>`<button class="lfo ${p===k?'on':''}" data-act="theme" data-arg="${k}"><b>${l}</b><i>${d}</i></button>`).join('')}</div><p class="note">Saved on this device.</p></div>`)}</div>`; };
ACT.theme=k=>{ try{ localStorage.setItem('bw-theme',k); }catch(e){} applyTheme(); render(); };

// ---------- helpers ----------
const rshort=r=>r; const dutyL=d=>({D:'De',S:'Su',A:'At',St:'St',Co:'Co'}[d]||d);
function condBar(v){ v=Math.round(v); return `<div class="cbar" title="Condition ${v}%"><i style="width:${v}%;background:${v>=85?'var(--pos)':v>=70?'var(--warn)':'var(--neg)'}"></i></div>`; }
function morPill(v){ const l=moraleLabel(v); return `<span class="pill ${v>=68?'g':v>=42?'':'r'}">${l}</span>`; }
function avgR(p){ return p.ss&&p.ss.s===S.season&&p.ss.ap?(p.ss.r/p.ss.ap):null; }
function statusPill(p){ if(p.inj&&p.inj.d>0) return `<span class="pill r" title="${esc(p.inj.t)}">Inj ${p.inj.d}d</span>`; if(p.sus>0) return `<span class="pill r">Ban ${p.sus}</span>`; if(p.tl) return '<span class="pill y">Listed</span>'; if(p.unhappy) return '<span class="pill r">Unhappy</span>'; return ''; }
function ovrCls(o,lvl){ return o>=lvl+3?'c-hi':o>=lvl-3?'':'c-lo'; }
function potLabel(p){ const mine=p.c===S.M.club; const g=p.pt-p.o; if(mine) return `${p.pt}`; const lo=Math.max(p.o,p.pt-ri(0,4)), hi=Math.min(99,p.pt+3); return `${lo}–${hi}`; }

  const d=S.days[S.day]; const up=mUpcoming().find(x=>!x.res); const lid=c.league; const order=lid&&S.leagues[lid]?sortedTable(lid):[]; const pos=order.indexOf(c.id);

   ${W('Squad alerts',alerts.length?`<div class="lines">${alerts.map(p=>`<div><button class="lnk" data-act="mPl" data-arg="${p.id}">${esc(p.n)}</button>${statusPill(p)}</div>`).join('')}</div>`:'<p class="empty">Everyone fit and happy.</p>','squad:1')}
   ${W('Tactic',`<div class="stack"><div class="row sb"><b>${esc(M.tactics[M.cur].name||'Tactic')}</b><span class="note">${esc(M.tactics[M.cur].f)}</span></div>${meter('Familiarity',M.tactics[M.cur].fam||0)}<p class="note">${MENT_NAMES[M.tactics[M.cur].ti.ment]} mentality.</p></div>`,'tactics:0')}</div>`; };
function mUpcoming(){ const M=S.M, c=mgrClub(); if(!c) return []; const out=[]; const lid=c.league;
  if(lid&&S.leagues[lid]){ const R=leagueRounds(lid); const n=LEAGUE_WEEKS.length; R.forEach((rd,r)=>{ const pr=rd.find(x=>x.includes(c.id)); if(!pr) return; const w=LEAGUE_WEEKS[Math.floor(r*n/R.length)]; const done=M.results.find(x=>x.s===S.season&&x.w===w&&x.comp==='L'&&x.opp===(pr[0]===c.id?pr[1]:pr[0]));
    out.push({w,comp:'L',name:LMETA(lid).name,home:pr[0]===c.id,opp:pr[0]===c.id?pr[1]:pr[0],res:done||null}); }); }
  M.results.filter(x=>x.s===S.season&&x.comp!=='L').forEach(x=>out.push({w:x.w,comp:x.comp,name:x.cname,home:x.home,opp:x.opp,res:x}));
  return out.sort((a,b)=>a.w-b.w); }

// ---------- player profile ----------
function mPlayerModal(pid){ const p=P(pid); const c=club(p.c); const mine=p.c===S.M.club; const at=pa(p); const isGK=p.p==='GK'; const fam=pfam(p);
  const grp=(isGK?[['Goalkeeping',GK_ATTRS.map(k=>[k,GK_NAMES[k]])]]:[]).concat(GROUPS);
  const roles=Object.keys(MROLES).filter(k=>MROLES[k].f.some(f=>(fam[f]||0)>=.8)).map(k=>{ const f=MROLES[k].f.filter(x=>(fam[x]||0)>=.8).sort((a,b)=>fam[b]-fam[a])[0]; const slot=Object.keys(SLOT_FAM).find(s=>SLOT_FAM[s]===f); return [k,roleRating(p,k,MROLES[k].d[0],slot),f]; }).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const ss=p.ss&&p.ss.s===S.season?p.ss:null;
  const acts=mine?`<button class="btn sec" data-act="mTL" data-arg="${p.id}">${p.tl?'Remove from transfer list':'Transfer list'}</button><button class="btn sec" data-act="mRenew" data-arg="${p.id}">Offer new contract</button><button class="btn sec" data-act="mRelease" data-arg="${p.id}">Release</button>`
    :`<button class="btn" data-act="mBid" data-arg="${p.id}">${ctOf(p)<=0?'Offer contract (free)':'Make offer'}</button><button class="btn sec" data-act="mShort" data-arg="${p.id}">${S.M.shortlist.includes(p.id)?'Remove from shortlist':'Shortlist'}</button>`;
  modal(`<div class="row sb"><div class="row">${crest(c,1)}<div><p class="disp">${esc(p.n)}</p><span class="note">${esc(c.name)} · ${p.a} · ${esc(p.nt)} · ${esc(archName(p))}</span></div></div><div class="row"><div class="ovrbox"><b>${p.o}</b><span>OVR</span></div><div class="ovrbox"><b>${potLabel(p)}</b><span>POT</span></div></div></div>
   <div class="kv kv4"><span>Value</span><b>${money(marketValue(p))}</b><span>Wage</span><b>${mine||p.wg?money(mWage(p))+' pw':'Unknown'}</b><span>Contract</span><b>${Math.max(0,ctOf(p))} yr${ctOf(p)===1?'':'s'}</b><span>Positions</span><b>${posList(p).map(f=>FAM_NAME[f]).join(', ')}</b>${mine?`<span>Condition</span><b>${Math.round(cond(p))}%</b><span>Morale</span><b>${moraleLabel(morale(p))}</b>`:''}</div>
   <div class="pattrs">${grp.map(([g,l])=>`<div class="ag"><h4>${g}</h4>${l.map(([k,n])=>`<div class="ar2"><span>${n}</span><b class="${cv(at[k])}">${at[k]}</b></div>`).join('')}</div>`).join('')}</div>
   <div class="grid2"><div><div class="lbl">Best roles</div>${roles.map(([k,v,f])=>`<div class="ar2"><span>${MROLES[k].n} <span class="note">${FAM_NAME[f]}</span></span><b>${stars5(roleStars(v))}</b></div>`).join('')}</div>
   <div><div class="lbl">This season</div>${ss?`<div class="kv"><span>Apps</span><b>${ss.ap}</b><span>Goals</span><b>${ss.g}</b><span>Assists</span><b>${ss.a}</b><span>Avg rating</span><b>${(ss.r/ss.ap).toFixed(2)}</b><span>Player of the match</span><b>${ss.motm}</b></div>`:`<div class="kv"><span>Apps</span><b>${p.ap}</b><span>Goals</span><b>${p.g}</b><span>Assists</span><b>${p.as}</b></div>`}</div></div>
   <div class="row">${acts}<button class="btn sec" data-act="close">Close</button></div>`); }
function stars5(n){ const f=Math.floor(n), h=n-f>=.5; return `<span class="stars">${'★'.repeat(f)}${h?'⯪':''}<s>${'★'.repeat(5-f-(h?1:0))}</s></span>`; }
// ---------- tactics ----------
function curTac(){ return S.M.tactics[S.M.cur]; }
function ensureSel(){ const M=S.M, t=curTac(); if(!M.sel||M.sel.f!==t.f){ M.sel=Object.assign(pickXI(M.club,t),{f:t.f}); } return M.sel; }
function slotTop(fx){ return (1-(fx-.0)/.8)*100; }
let MPHASE='out';
function shapeName(t){ const F=tacF(t); const xs=F.map((x,i)=>x[0]==='GK'?null:inPosOf(t,i)[0]).filter(v=>v!=null).sort((a,b)=>a-b); const lines=[]; let cur=[xs[0]]; for(let i=1;i<xs.length;i++){ if(xs[i]-cur[cur.length-1]<.09) cur.push(xs[i]); else { lines.push(cur.length); cur=[xs[i]]; } } lines.push(cur.length); return lines.join('-')+' in possession'; }
function tokHTML(i){ const t=curTac(), sel=ensureSel(); const F=tacF(t); const [slot,fx0,fy0]=F[i]; const [fx,fy]=MPHASE==='in'?inPosOf(t,i):[fx0,fy0]; const pid=sel.xi[i]; const p=pid!=null?P(pid):null; const [role,duty]=t.roles[i];
  const v=p?roleRating(p,role,duty,slot):0; const st=roleStars(v); const fam=p?famIn(p,slot):0;
  return `<button class="tok ${MTSEL===i?'on':''} ${p&&!available(p)?'bad':''} ${slot!=='GK'?'drag':''}" style="left:${clamp(fy*100,10,90)}%;top:${clamp(slotTop(fx),6,94)}%" data-act="mSlot" data-arg="${i}" data-i="${i}"><span class="tn">${p?esc(p.n.split(' ').slice(-1)[0]):'Empty'}</span><span class="tr ${st>=3.5?'g':st>=2.5?'y':'r'}">${role} ${dutyL(duty)}</span>${p?condBar(cond(p)):''}${p&&fam<.8?`<span class="tf">${famLabel(fam)}</span>`:''}</button>`; }
function slotPanel(){ const t=curTac(), sel=ensureSel(); if(MTSEL==null) return `<p class="note">Tap a player on the pitch to change who plays there, their role, duty and individual instructions.</p>`;
  const i=MTSEL; const F=tacF(t); const [slot]=F[i]; const fam=SLOT_FAM[slot]; const [role,duty]=t.roles[i]; const pid=sel.xi[i]; const c=mgrClub();
  const cands=c.squad.map(P).map(p=>[p,roleRating(p,role,duty,slot)]).sort((a,b)=>b[1]-a[1]);
  const roleOpts=Object.keys(MROLES).filter(k=>MROLES[k].f.includes(fam)).map(k=>`<option value="${k}" ${k===role?'selected':''}>${MROLES[k].n}</option>`).join('');
  const dutyOpts=MROLES[role].d.map(d=>`<option value="${d}" ${d===duty?'selected':''}>${DUTY_NAME[d]}</option>`).join('');
  const pi=(t.pi&&t.pi[i])||{};
  const piHtml=Object.keys(PI_OPTS).filter(k=>!(k==='cr'&&!['DL','DR','WBL','WBR','ML','MR','AML','AMR'].includes(fam))&&!(fam==='GK'&&k!=='risk')).map(k=>`<div class="fld"><span>${{sh:'Shooting',dr:'Dribbling',cr:'Crossing',risk:'Passing risk',press:'Closing down',fwd:'Positioning',tk:'Tackling'}[k]}</span><select data-mch="pi" data-k="${k}">${[-1,0,1].map(v=>`<option value="${v}" ${(pi[k]||0)===v?'selected':''}>${PI_OPTS[k][v+1]}</option>`).join('')}</select></div>`).join('');
  return `<div class="stack"><div class="row sb"><b>${FAM_NAME[fam]} · slot ${slot}</b><button class="chip" data-act="mSlot" data-arg="-1">Done</button></div>
   <div class="fld"><span>Player</span><select data-mch="slotp">${cands.map(([p,v])=>`<option value="${p.id}" ${p.id===pid?'selected':''}>${esc(p.n)} · ${p.p} · ${'★'.repeat(Math.round(roleStars(v)))} ${!available(p)?'(unavailable)':sel.xi.includes(p.id)&&p.id!==pid?'(in XI)':sel.bench.includes(p.id)?'(bench)':''}</option>`).join('')}</select></div>
   <div class="grid2"><div class="fld"><span>Role</span><select data-mch="role">${roleOpts}</select></div><div class="fld"><span>Duty</span><select data-mch="duty">${dutyOpts}</select></div></div>
   <p class="note">${roleBlurb(role)}</p><div class="lbl">Key attributes</div><p class="note">${MROLES[role].a.map(k=>ANAME[k]||GK_NAMES[k]).join(', ')}</p>
   <div class="lbl">Player instructions</div><div class="grid2">${piHtml}</div></div>`; }
function roleBlurb(r){ const b=MROLES[r].b; const t=[]; if((b.adv||0)>.06) t.push('pushes forward'); if((b.adv||0)<-.05) t.push('drops deep'); if((b.wid||0)>.03) t.push('stays wide'); if((b.wid||0)<-.08) t.push('tucks inside'); if((b.tb||1)>1.25) t.push('plays killer passes'); if((b.cr||1)>1.3) t.push('crosses a lot'); if((b.dr||1)>1.25) t.push('runs with the ball'); if((b.sh||1)>1.3) t.push('shoots often'); if((b.rn||1)>1.3) t.push('runs in behind'); if((b.air||1)>1.4) t.push('target for long balls'); if((b.pr||1)>1.4) t.push('presses hard'); if((b.pr||1)<.6) t.push('saves energy without the ball'); if((b.rm||1)>1.3) t.push('roams'); if(b.sweep) t.push('sweeps behind the line'); if((b.cl||1)>1.4) t.push('clears first'); if((b.lp||1)>1.3) t.push('switches play long'); return t.length?t.join(', ').replace(/^./,x=>x.toUpperCase())+'.':'Balanced, does a bit of everything.'; }
MV['tactics:0']=()=>{ const M=S.M; const c=mgrClub(); if(!c) return '<p class="empty">No club.</p>'; const t=curTac(), sel=ensureSel(); const F=tacF(t);
  const arrows=MPHASE==='in'?F.map(([slot,fx,fy],i)=>{ if(slot==='GK') return ''; const [ix,iy]=inPosOf(t,i); return `<line x1="${fy*100}" y1="${slotTop(fx)}" x2="${iy*100}" y2="${slotTop(ix)}"/><circle cx="${fy*100}" cy="${slotTop(fx)}" r=".9"/>`; }).join(''):'';
  const bench=sel.bench.map((id,j)=>{ const p=P(id); return `<div class="brow"><span>${esc(p.n)}</span><span class="note">${p.p} · ${p.o}</span>${condBar(cond(p))}<select data-mch="bench" data-j="${j}" aria-label="Swap"><option value="">Swap…</option>${c.squad.map(P).filter(q=>!sel.xi.includes(q.id)&&!sel.bench.includes(q.id)).sort((a,b)=>b.o-a.o).map(q=>`<option value="${q.id}">${esc(q.n)} (${q.p} ${q.o})</option>`).join('')}</select></div>`; }).join('');
  return `<div class="tacgrid"><section class="w"><div class="wh"><span>${esc(t.name||'Tactic')} · ${esc(t.f)}${t.cust?' (custom)':''}${t.inPos&&t.inPos.some(Boolean)?' · '+shapeName(t):''}</span><span class="note">Familiarity ${Math.round(t.fam||0)}%</span></div><div class="wb"><div class="phase"><div class="seg"><button class="chip" aria-pressed="${MPHASE==='out'}" data-act="mPhase" data-arg="out">Out of possession</button><button class="chip" aria-pressed="${MPHASE==='in'}" data-act="mPhase" data-arg="in">In possession</button></div><button class="chip" data-act="mResetShape">Reset shape</button></div><p class="note" style="margin:4px 0 6px">${MPHASE==='out'?'Drag players to set your defensive shape. Moving a player into a new zone changes his position.':'Drag players to where they go when you have the ball. Lines show each player\'s movement from his defensive spot.'}</p><div class="tpitch ${MPHASE}" id="tpitch"><div class="tl1"></div><div class="tl2"></div><div class="tl3"></div><svg class="tarrows" viewBox="0 0 100 100" preserveAspectRatio="none">${arrows}</svg>${F.map((x,i)=>tokHTML(i)).join('')}</div></div></section>
   <section class="w"><div class="wh"><span>Setup</span></div><div class="wb"><div class="stack">
    <div class="seg">${M.tactics.map((x,i)=>`<button class="chip" aria-pressed="${M.cur===i}" data-act="mTacSlot" data-arg="${i}">${'ABC'[i]}: ${esc(x.name||'Tactic')}</button>`).join('')}</div>
    <div class="grid2"><div class="fld"><span>Formation</span><select data-mch="form">${Object.keys(FORMATIONS).map(f=>`<option ${f===t.f?'selected':''}>${f}</option>`).join('')}</select></div><div class="fld"><span>Mentality</span><select data-mch="ment">${MENT_NAMES.map((n,i)=>`<option value="${i}" ${t.ti.ment===i?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <div class="fld"><span>Load a style</span><select data-mch="preset"><option value="">Choose a preset…</option>${Object.keys(TACTIC_PRESETS).map(k=>`<option>${k}</option>`).join('')}</select></div>
    ${meter('Familiarity',t.fam||0)}<div class="row"><button class="btn sec" data-act="mAuto">Auto-pick team</button><button class="btn sec" data-act="mClearSel">Reset</button></div>
    <div id="slotPanel">${slotPanel()}</div><div class="lbl">Substitutes</div><div class="bench">${bench}</div></div></div></section></div>`; };
MV['tactics:1']=()=>{ const t=curTac(); if(!mgrClub()) return '<p class="empty">No club.</p>'; const ti=t.ti; const sel=(k)=>`<div class="fld"><span>${TI_OPTS[k].n}</span><select data-mch="ti" data-k="${k}">${TI_OPTS[k].o.map(([v,l])=>`<option value="${v}" ${String(ti[k])===String(v)?'selected':''}>${l}</option>`).join('')}</select></div>`;
  const tog=k=>`<button class="chip" aria-pressed="${!!ti[k]}" data-act="mTog" data-arg="${k}">${TI_TOGGLES[k]}</button>`;
  return `<div class="dash c3">${W('In possession',`<div class="stack"><div class="fld"><span>Mentality</span><select data-mch="ment">${MENT_NAMES.map((n,i)=>`<option value="${i}" ${ti.ment===i?'selected':''}>${n}</option>`).join('')}</select></div>${['pass','tempo','width','focus','f3','cross','drib','creat'].map(sel).join('')}<div class="chips">${tog('pod')}${tog('pis')}${tog('early')}</div></div>`)}
   ${W('In transition',`<div class="stack">${['lost','won','gk'].map(sel).join('')}<p class="note">Counter-pressing wins the ball back high but tires players. Countering hits teams that commit numbers forward. Regrouping keeps your shape and makes you hard to counter.</p></div>`)}
   ${W('Out of possession',`<div class="stack">${['loe','dline','press','tackle','force','crossDef'].map(sel).join('')}<div class="chips">${tog('trap')}${tog('ppd')}</div><p class="note">A high line squeezes the pitch but quick strikers can run in behind. A low block concedes possession but protects your box.</p></div>`)}</div>`; };
MV['tactics:2']=()=>{ const t=curTac(); const c=mgrClub(); if(!c) return '<p class="empty">No club.</p>'; t.sp=t.sp||{corner:'mix'}; const sel=ensureSel(); const pool=sel.xi.concat(sel.bench).filter(x=>x!=null).map(P);
  const pk=(k,lbl,attr)=>`<div class="fld"><span>${lbl}</span><select data-mch="sp" data-k="${k}"><option value="">Auto (best ${ANAME[attr]})</option>${pool.slice().sort((a,b)=>pa(b)[attr]-pa(a)[attr]).map(p=>`<option value="${p.id}" ${t.sp[k]===p.id?'selected':''}>${esc(p.n)} · ${pa(p)[attr]}</option>`).join('')}</select></div>`;
  return `<div class="dash c2">${W('Set piece takers',`<div class="stack">${pk('cl','Left corners','cro')}${pk('cr','Right corners','cro')}${pk('fk','Free kicks','fk')}${pk('pen','Penalties','pen')}${pk('cap','Captain','com')}</div>`)}
   ${W('Corners',`<div class="stack"><div class="fld"><span>Delivery</span><select data-mch="sp" data-k="corner">${[['mix','Mixed'],['near','Near post'],['far','Far post'],['centre','Penalty spot'],['short','Short']].map(([v,l])=>`<option value="${v}" ${t.sp.corner===v?'selected':''}>${l}</option>`).join('')}</select></div><p class="note">Your best headers attack the ball. Near and far post deliveries suit different players. Short corners keep the ball but rarely score.</p></div>`)}</div>`; };
// ---------- drag on the tactics board ----------
let TDRAG=null, TSWALLOW=0;
function tFromPoint(el,x,y){ const r=el.getBoundingClientRect(); const fy=clamp((x-r.left)/r.width,.03,.97); const top=clamp((y-r.top)/r.height,0,1); const fx=clamp((1-top)*.8,.08,.79); return [fx,fy]; }
document.addEventListener('pointerdown',e=>{ const tok=e.target.closest('.tpitch .tok.drag'); if(!tok||!S||S.mode!=='mgr') return; const pitch=tok.closest('.tpitch'); TDRAG={tok,pitch,i:+tok.dataset.i,x0:e.clientX,y0:e.clientY,moved:false,id:e.pointerId}; },{passive:true});
document.addEventListener('pointermove',e=>{ if(!TDRAG||e.pointerId!==TDRAG.id) return; const d=Math.hypot(e.clientX-TDRAG.x0,e.clientY-TDRAG.y0); if(!TDRAG.moved&&d<8) return; if(!TDRAG.moved){ try{ TDRAG.tok.setPointerCapture(e.pointerId); }catch(_){} } TDRAG.moved=true; e.preventDefault();
  const [fx,fy]=tFromPoint(TDRAG.pitch,e.clientX,e.clientY); TDRAG.fx=fx; TDRAG.fy=fy; TDRAG.tok.style.left=clamp(fy*100,10,90)+'%'; TDRAG.tok.style.top=clamp(slotTop(fx),6,94)+'%'; TDRAG.tok.classList.add('dragging');
  if(MPHASE==='out'){ const sl=slotFromPos(fx,fy); let tag=TDRAG.tok.querySelector('.tpos'); if(!tag){ tag=document.createElement('span'); tag.className='tpos'; TDRAG.tok.appendChild(tag); } tag.textContent=FAM_NAME[SLOT_FAM[sl]]; } },{passive:false});
document.addEventListener('pointercancel',()=>{ TDRAG=null; });
document.addEventListener('pointerup',e=>{ if(!TDRAG||e.pointerId!==TDRAG.id) return; const D=TDRAG; TDRAG=null; if(!D.moved) return; TSWALLOW=Date.now(); const t=curTac(); const i=D.i;
  if(MPHASE==='out'){ const F=tacF(t).map(x=>x.slice()); const sl=slotFromPos(D.fx,D.fy); F[i]=[sl,D.fx,D.fy]; t.cust=F; const fam=SLOT_FAM[sl]; const [role,duty]=t.roles[i]; if(!MROLES[role].f.includes(fam)){ t.roles[i]=DEF_ROLE[fam].slice(); toast(`Now ${FAM_NAME[fam]}: role set to ${MROLES[t.roles[i][0]].n}`); } }
  else { t.inPos=t.inPos||new Array(11).fill(null); t.inPos[i]=[D.fx,D.fy]; }
  t.fam=Math.max(25,(t.fam||50)-1); if(MATCH&&S.pending&&S.pending.kind==='mlive') m2dSyncTactic(); render(); saveSoon(); });
document.addEventListener('click',e=>{ if(Date.now()-TSWALLOW<350&&e.target.closest('.tpitch')){ e.stopPropagation(); e.preventDefault(); } },true);
Object.assign(ACT,{ mPhase:p=>{ MPHASE=p; render(); }, mResetShape:()=>{ const t=curTac(); if(MPHASE==='out'){ t.cust=null; t.roles=FORMATIONS[t.f].map(([slot],i)=>{ const fam=SLOT_FAM[slot]; const prev=t.roles[i]; return prev&&MROLES[prev[0]].f.includes(fam)?prev:DEF_ROLE[fam].slice(); }); } else t.inPos=null; render(); saveSoon(); } });

MV['training:0']=()=>{ const M=S.M; if(!mgrClub()) return '<p class="empty">No club.</p>'; const T=M.train;
  const info={bal:'A bit of everything. Steady development.',att:'Finishing, movement and chance creation.',def:'Shape, tackling and defending the box.',tac:'Drills your current tactic. Familiarity grows much faster.',fit:'Sharper fitness: faster recovery and fewer injuries.',set:'Corners and free kicks rehearsed.',prev:'Studies the next opponent. Small familiarity boost.'};
  return `<div class="dash c2">${W('Weekly focus',`<div class="stack"><div class="presets">${Object.keys(TRAIN_FOCUS).map(k=>`<button class="preset ${T.focus===k?'on':''}" data-act="mTrain" data-arg="${k}"><b>${TRAIN_FOCUS[k]}</b><span>${info[k]}</span></button>`).join('')}</div></div>`)}

const V2={raf:0,t:0,last:0,fi:0,speed:2,mode:'key',paused:false,tab:'feed',pos:new Map(),tgt:null,tgtAt:0,htShown:false,ftShown:false,evShown:0,flash:null,teamSig:'',built:false,lastPanel:0,ctlSig:''};
const M2RATE={1:4,2:8,4:16,8:32};
function m2dShow(){ const E=MATCH; if(!E){ S.pending=null; mrender(); return; } const mv=$('#match'); mv.hidden=false;
  if(!V2.built||!mv.querySelector('#m2c')){ Object.assign(V2,{t:Math.max(0,V2.E===E?V2.t:0),fi:V2.E===E?V2.fi:0,pos:V2.E===E?V2.pos:new Map(),htShown:V2.E===E?V2.htShown:false,ftShown:false,evShown:V2.E===E?V2.evShown:0,teamSig:'',ctlSig:'',E});
    mv.innerHTML=`<div class="m2d"><section class="mb m2top"><div id="m2score"></div><div id="m2ctl"></div></section><section class="mb m2pitch"><div class="m2wrap"><canvas id="m2c"></canvas><div id="m2flash" class="m2flash" hidden></div></div></section>
     <section class="mb m2side"><div class="seg" id="m2tabs"></div><div id="m2body" class="m2body"></div></section></div>`; V2.built=true; m2Tabs(); m2Ctl(); m2Body(true); }
  m2dStart(); }
function m2dStart(){ if(V2.raf) return; V2.last=performance.now(); const loop=now=>{ V2.raf=requestAnimationFrame(loop); m2Frame(now); }; V2.raf=requestAnimationFrame(loop); }
function m2dStop(){ if(V2.raf) cancelAnimationFrame(V2.raf); V2.raf=0; V2.built=false; }
function m2Interesting(E,pid){ if(V2.mode==='full') return true; return E.keyPoss.has(pid)||(V2.mode==='ext'&&E.extPoss.has(pid)); }
function m2Ensure(E,t){ let g=0; while(!E.done&&(!E.frames.length||E.frames[E.frames.length-1].t<t+4)&&g++<400){ step(E); aiManage(E); if(E.needSub) break; } }
function m2Frame(now){ const E=MATCH; if(!E||!S.pending||S.pending.kind!=='mlive'){ m2dStop(); return; } const dt=Math.min(.1,(now-V2.last)/1000); V2.last=now;
  if(!V2.paused&&!V2.ftShown){ V2.t+=dt*M2RATE[V2.speed]; m2Ensure(E,V2.t);
    // highlight modes: jump over possessions that never threaten
    if(V2.mode!=='full'){ let guard=0; while(guard++<80){ const fi=m2FrameAt(E,V2.t); const f=E.frames[fi]; if(!f) break; const done=E.frames.length&&E.frames[E.frames.length-1].pid>f.pid; if(m2Interesting(E,f.pid)||!done) break;
        let j=fi+1; while(j<E.frames.length&&(E.frames[j].pid===f.pid||!m2Interesting(E,E.frames[j].pid))) j++;
        if(j>=E.frames.length){ if(E.done){ V2.t=E.frames[E.frames.length-1].t; break; } let g2=0; const n0=E.frames.length; while(!E.done&&g2++<300&&!E.frames.slice(n0).some(x=>m2Interesting(E,x.pid)&&E.frames[E.frames.length-1].pid>x.pid)){ step(E); aiManage(E); if(E.needSub) break; } continue; }
        let nt=Math.max(V2.t,E.frames[j].t-2); if(E.htDone&&V2.t<E.T1&&nt>=E.T1) nt=E.T1; if(nt-V2.t>6){ V2.cut=performance.now(); V2.snap=true; } V2.t=nt; if(nt===E.T1) break; } } }
  if(E.htDone&&V2.t>=E.T1&&!V2.htShown){ V2.htShown=true; V2.paused=true; m2HT(); }
  if(E.needSub&&!V2.subOpen){ V2.paused=true; m2SubModal(E.needSub.pl.id,true); }
  if(E.done&&V2.t>=E.T2-1&&!V2.ftShown){ V2.ftShown=true; V2.t=E.T2; m2Draw(E); m2Panel(E,true); setTimeout(()=>{ m2dStop(); mgrApplyResult(); render(); },900); return; }
  m2Draw(E); if(now-V2.lastPanel>350){ V2.lastPanel=now; m2Panel(E); } }
function m2FrameAt(E,t){ const F=E.frames; let i=Math.min(V2.fi,F.length-1); if(i<0) return 0; while(i>0&&F[i].t>t) i--; while(i<F.length-1&&F[i+1].t<=t) i++; V2.fi=i; return i; }
// ---------- drawing ----------
function m2Draw(E){ const cv=$('#m2c'); if(!cv) return; const wrap=cv.parentElement; const W=wrap.clientWidth, H=Math.round(W*68/105); if(cv.width!==Math.round(W*devicePixelRatio)){ cv.width=Math.round(W*devicePixelRatio); cv.height=Math.round(H*devicePixelRatio); cv.style.height=H+'px'; }
  const g=cv.getContext('2d'); const k=cv.width/105; g.setTransform(1,0,0,1,0,0);
  for(let i=0;i<12;i++){ g.fillStyle=i%2?'#1f5b33':'#23663a'; g.fillRect(i*cv.width/12,0,cv.width/12+1,cv.height); }
  g.strokeStyle='rgba(255,255,255,.75)'; g.lineWidth=Math.max(1,k*.22); const L=(x1,y1,x2,y2)=>{ g.beginPath(); g.moveTo(x1*k,y1*k); g.lineTo(x2*k,y2*k); g.stroke(); }; const R=(x,y,w,h)=>g.strokeRect(x*k,y*k,w*k,h*k);
  R(.3,.3,104.4,67.4); L(52.5,0,52.5,68); g.beginPath(); g.arc(52.5*k,34*k,9.15*k,0,7); g.stroke(); R(0,13.85,16.5,40.3); R(88.5,13.85,16.5,40.3); R(0,24.85,5.5,18.3); R(99.5,24.85,5.5,18.3);
  g.fillStyle='rgba(255,255,255,.8)'; [[11,34],[94,34],[52.5,34]].forEach(([x,y])=>{ g.beginPath(); g.arc(x*k,y*k,k*.35,0,7); g.fill(); });
  g.fillStyle='rgba(255,255,255,.35)'; g.fillRect(-1*k,30.34*k,1.2*k,7.32*k); g.fillRect(104.8*k,30.34*k,1.2*k,7.32*k);
  // ---- ball: held at the feet, then struck at real speed; long balls arc ----
  const F=E.frames; if(!F.length) return; const B=m2Ball(E,V2.t); const bx=B.x, by=B.y;
  // ---- players: shape targets from the live ball, then run there with momentum (game-time physics) ----
  const tg=positions(E,bx,by,B.f.p); const cols=[teamCol(E,0),teamCol(E,1)]; const nowR=performance.now();
  const dtR=Math.min(.1,(nowR-(V2.lastDraw||nowR))/1000); V2.lastDraw=nowR; const dtG=V2.paused||V2.ftShown?0:dtR*M2RATE[V2.speed];
  for(const s of [0,1]){ const list=tg[s]; let near=null, nd=1e9, near2=null, nd2=1e9; if(s!==B.f.p){ for(const [pl,x,y] of list){ if(pl.slot==='GK') continue; const d=Math.hypot(x-bx,y-by); if(d<nd){ near2=near; nd2=nd; nd=d; near=pl; } else if(d<nd2){ nd2=d; near2=pl; } } }
    const pressK=.55+.1*(E.sides[s].ti.press||0);
    for(const [pl,x,y] of list){ let tx=x, ty=y, chase=false;
      if(B.h===pl.id){ tx=bx-(s===0?.7:-.7); ty=by; chase=true; }
      else if(B.recv===pl.id){ tx=B.n.x; ty=B.n.y; chase=true; }
      else if(pl===near){ tx=x+(bx-x)*pressK; ty=y+(by-y)*pressK; chase=true; }
      else if(pl===near2&&(E.sides[s].ti.press||0)>0){ tx=x+(bx-x)*.3; ty=y+(by-y)*.3; }
      let st=V2.pos.get(pl.id); if(!st||V2.snap){ st={x:tx,y:ty,vx:0,vy:0}; V2.pos.set(pl.id,st); }
      const pace=(pl.at.spd+pl.at.acc)/2; const vmax=(chase?4.6:2.6)+pace/99*(chase?3.6:1.8); const acc=chase?5:3;
      let rem=dtG; while(rem>1e-4){ const h=Math.min(.05,rem); rem-=h; const dx=tx-st.x, dy=ty-st.y; let dvx=dx*1.6, dvy=dy*1.6; const sp=Math.hypot(dvx,dvy); if(sp>vmax){ dvx*=vmax/sp; dvy*=vmax/sp; }
        const k=Math.min(1,acc*h); st.vx+=(dvx-st.vx)*k; st.vy+=(dvy-st.vy)*k; st.x+=st.vx*h; st.y+=st.vy*h; }
      if(B.h===pl.id&&Math.hypot(st.x-tx,st.y-ty)>4){ st.x+=(tx-st.x)*.25; st.y+=(ty-st.y)*.25; }
      const px=st.x, py=st.y; const r=1.25*k; g.beginPath(); g.arc(px*k,py*k,r,0,7); g.fillStyle=pl.slot==='GK'?(s===0?'#0f172a':'#7c2d12'):cols[s]; g.fill(); g.lineWidth=Math.max(1,k*.18); g.strokeStyle=B.h===pl.id?'#fff':'rgba(0,0,0,.55)'; g.stroke();
      if(k>5){ g.fillStyle=lum(cols[s])>.6&&pl.slot!=='GK'?'#111':'#fff'; g.font=`600 ${Math.round(k*1.25)}px IBM Plex Sans Condensed, Arial Narrow, sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(String((E.sides[s].xi.indexOf(pl)%11)+1),px*k,py*k+.5); }
      if((B.h===pl.id||B.recv===pl.id)&&k>4){ g.fillStyle='rgba(255,255,255,.9)'; g.font=`500 ${Math.round(k*1.15)}px IBM Plex Sans, sans-serif`; g.textAlign='center'; g.fillText(pl.short,px*k,(py-2.4)*k); } } }
  V2.snap=false;
  const lift=B.air*2.2; g.beginPath(); g.arc(bx*k+k*(.25+lift*.5),by*k+k*(.35+lift*.7),k*.55,0,7); g.fillStyle=`rgba(0,0,0,${.35-B.air*.15})`; g.fill(); g.beginPath(); g.arc(bx*k,(by-lift)*k,k*(.6+B.air*.35),0,7); g.fillStyle='#fff'; g.fill();
  if(V2.cut){ const a=1-(nowR-V2.cut)/350; if(a>0){ g.fillStyle=`rgba(8,10,14,${a*.8})`; g.fillRect(0,0,cv.width,cv.height); } else V2.cut=0; }
  // goal flashes
  const goals=E.events.filter(e=>e.type==='goal'&&e.t<=V2.t); if(goals.length>V2.evShown){ const e=goals[goals.length-1]; V2.evShown=goals.length; const fl=$('#m2flash'); if(fl){ fl.innerHTML=`<b>GOAL</b><span>${esc(e.text.replace('GOAL! ',''))}</span>`; fl.hidden=false; fl.style.borderColor=cols[e.s]; clearTimeout(V2.flT); V2.flT=setTimeout(()=>{ fl.hidden=true; },2600); } } }
function m2Ball(E,t){ const F=E.frames; const i=m2FrameAt(E,t); const f=F[i], n=F[i+1]; if(!n) return {x:f.x,y:f.y,h:f.h,recv:null,air:0,f,n:f};
  const dur=Math.max(.05,n.t-f.t), d=Math.hypot(n.x-f.x,n.y-f.y);
  if(n.ev==='ko'||f.ev==='goal'&&n.ev==='ko'){ return t<n.t-.05?{x:f.x,y:f.y,h:null,recv:null,air:0,f,n}:{x:n.x,y:n.y,h:n.h,recv:null,air:0,f,n}; }
  if(n.h===f.h&&n.p===f.p&&!['goal','miss','save','block','cross','corner','out','longkick'].includes(n.ev)){ const u=clamp((t-f.t)/dur,0,1); return {x:f.x+(n.x-f.x)*u,y:f.y+(n.y-f.y)*u,h:f.h,recv:null,air:0,f,n}; }
  const shot=['goal','miss','save','block','post'].includes(n.ev); const spd=shot?27:n.ev==='longkick'||n.ev==='clear'||d>32?22:n.ev==='cross'?20:15; const fly=clamp(d/spd,.25,dur); const st=n.t-fly;
  if(t<st) return {x:f.x,y:f.y,h:f.h,recv:n.p===f.p?n.h:null,air:0,f,n};
  const u=clamp((t-st)/fly,0,1), ue=u*(1.2-.2*u); const lofted=!shot&&(d>26||n.ev==='cross'||n.ev==='longkick'||n.ev==='corner'); 
  return {x:f.x+(n.x-f.x)*ue,y:f.y+(n.y-f.y)*ue,h:null,recv:n.p===f.p||lofted?n.h:null,air:lofted?Math.sin(Math.PI*u)*Math.min(1,d/40):0,f,n}; }
function lum(hex){ const h=hex.replace('#',''); const v=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16); return (((v>>16)&255)*.299+((v>>8)&255)*.587+(v&255)*.114)/255; }

  el.innerHTML=`<div class="row m2c"><button class="chip" aria-pressed="${V2.paused}" data-act="m2Pause">${V2.paused?'Play':'Pause'}</button>${[1,2,4,8].map(s=>`<button class="chip" aria-pressed="${V2.speed===s}" data-act="m2Speed" data-arg="${s}">${s}x</button>`).join('')}<span class="sep"></span>${[['key','Key'],['ext','Extended'],['full','Full']].map(([m,l])=>`<button class="chip" aria-pressed="${V2.mode===m}" data-act="m2Mode" data-arg="${m}">${l}</button>`).join('')}<button class="chip" data-act="m2Skip">Instant result</button></div>`; }
function m2Tabs(){ const el=$('#m2tabs'); if(!el) return; el.innerHTML=[['feed','Commentary'],['stats','Stats'],['team','Your team'],['tac','Tactics']].map(([k,l])=>`<button class="chip" aria-pressed="${V2.tab===k}" data-act="m2Tab" data-arg="${k}">${l}</button>`).join(''); }
function m2Panel(E,force){ const sc=m2Score(E); const el=$('#m2score'); if(el) el.innerHTML=`<div class="sb3"><div class="t">${crest(club(E.sides[0].cid))}<span>${esc(E.sides[0].name)}</span></div><div class="sc num">${sc[0]} – ${sc[1]}</div><div class="t r">${crest(club(E.sides[1].cid))}<span>${esc(E.sides[1].name)}</span></div></div><div class="clock"><b class="num">${clockLbl(E,Math.min(V2.t,E.T2))}</b><span>${E.comp}${V2.ftShown?' · Full-time':V2.t>=E.T1&&E.htDone&&V2.paused&&V2.t<E.T1+5?' · Half-time':''}</span></div><div class="pbar"><i style="width:${clamp(V2.t/E.T2,0,1)*100}%"></i></div>`;
  m2Ctl(); m2Body(force); }
function m2Body(force){ const E=MATCH; const el=$('#m2body'); if(!E||!el) return; const us=E.user;
  if(V2.tab==='feed'){ const evs=E.events.filter(e=>e.t<=V2.t&&e.type!=='off'); if(!force&&el._n===evs.length&&el._tab==='feed') return; el._n=evs.length; el._tab='feed';
    el.innerHTML=`<div class="evs">${evs.slice().reverse().map(e=>`<div class="ev ${e.type==='goal'?'goal':''}"><span class="mn">${clockLbl(E,e.t)}</span><span class="sd" style="background:${e.s<0?'var(--dim)':teamCol(E,e.s)}"></span><span>${e.type==='goal'?`<b>${esc(e.text)}</b>`:esc(e.text)}${e.xg!=null&&e.type!=='goal'?` <span class="note">xG ${e.xg.toFixed(2)}</span>`:''}</span></div>`).join('')||'<p class="note">Kick-off.</p>'}</div>`; return; }
  if(V2.tab==='stats'){ el._tab='stats'; const s0=E.sides[0].st, s1=E.sides[1].st; const pT=s0.poss+s1.poss||1; const row=(l,a,b,suf)=>{ const tot=(a+b)||1; return `<div class="srow"><b class="num">${a}${suf||''}</b><div><span>${l}</span><div class="sbar"><i style="width:${a/tot*100}%;background:${teamCol(E,0)}"></i><i style="width:${b/tot*100}%;background:${teamCol(E,1)}"></i></div></div><b class="num">${b}${suf||''}</b></div>`; };
    el.innerHTML=row('Possession',Math.round(s0.poss/pT*100),Math.round(s1.poss/pT*100),'%')+row('Shots',s0.sh,s1.sh)+row('On target',s0.sot,s1.sot)+row('xG',+s0.xg.toFixed(2),+s1.xg.toFixed(2))+row('Pass accuracy',Math.round(s0.pc/Math.max(1,s0.pa)*100),Math.round(s1.pc/Math.max(1,s1.pa)*100),'%')+row('Corners',s0.co,s1.co)+row('Fouls',s0.fo,s1.fo)+row('Offsides',s0.off,s1.off)+row('Yellow cards',s0.yc,s1.yc); return; }
  if(V2.tab==='team'){ const sd=E.sides[us]; const on=sd.xi.filter(p=>p.on); const sig=on.map(p=>p.id).join()+'|'+sd.subs;
    if(force||el._tab!=='team'||el._sig!==sig){ el._tab='team'; el._sig=sig; el.innerHTML=`<p class="note">Subs used ${sd.subs}/5. Tap Sub to make a change.</p><table><tbody>${on.map(p=>`<tr><td class="l t">${esc(p.n)}</td><td class="l">${p.slot}</td><td class="l" style="width:26%"><div class="cbar"><i id="m2c-${p.id}"></i></div></td><td><span class="rt" id="m2r-${p.id}">–</span></td><td><button class="chip" data-act="m2Sub" data-arg="${p.id}" ${sd.subs>=5?'disabled':''}>Sub</button></td></tr>`).join('')}</tbody></table>`; }
    on.forEach(p=>{ const c=$('#m2c-'+p.id), r=$('#m2r-'+p.id); if(c){ c.style.width=p.cnd+'%'; c.style.background=p.cnd>=75?'var(--pos)':p.cnd>=60?'var(--warn)':'var(--neg)'; } if(r){ const v=p.r; r.textContent=v.toFixed(1); r.className='rt '+(v>=7?'g':v>=6?'y':'r'); } }); return; }
  if(V2.tab==='tac'){ if(!force&&el._tab==='tac') return; el._tab='tac'; const t=curTac(); const sel=k=>`<div class="fld"><span>${TI_OPTS[k].n}</span><select data-mch="ti" data-k="${k}">${TI_OPTS[k].o.map(([v,l])=>`<option value="${v}" ${String(t.ti[k])===String(v)?'selected':''}>${l}</option>`).join('')}</select></div>`;
    el.innerHTML=`<div class="stack"><div class="fld"><span>Mentality</span><select data-mch="ment">${MENT_NAMES.map((n,i)=>`<option value="${i}" ${t.ti.ment===i?'selected':''}>${n}</option>`).join('')}</select></div><div class="grid2">${['pass','tempo','width','loe','dline','press','lost','won'].map(sel).join('')}</div>
     <div class="lbl">Touchline shouts</div><div class="chips">${[['demand','Demand more'],['focus','Focus'],['encourage','Encourage'],['fire','Fire up'],['calm','Calm down'],['praise','Praise']].map(([k,l])=>`<button class="chip" data-act="m2Shout" data-arg="${k}">${l}</button>`).join('')}</div><p class="note" id="m2shoutRes">${esc(E.talkRes||'')}</p><p class="note">Roles and duties can be changed from the Tactics screen between matches. Changes here take effect straight away.</p></div>`; } }
function m2dSyncTactic(){ const E=MATCH; if(!E) return; const sd=E.sides[E.user]; const t=curTac(); sd.ti=Object.assign({},t.ti); sd.tac=Object.assign({},sd.tac,{ti:sd.ti,sp:t.sp});
  if(t.f===sd.tac.f){ sd.tac.roles=t.roles; sd.tac.pi=t.pi; sd.xi.forEach(pl=>{ const ix=pl.ix!=null?pl.ix:sd.F.findIndex(x=>x[0]===pl.slot); const ip=t.inPos&&t.inPos[ix]; pl.fxIn=ip?ip[0]:null; pl.fyIn=ip?ip[1]:null; if(ix<0) return; const [role,duty]=t.roles[ix]; pl.role=role; pl.duty=duty; pl.b=mergeB(role,duty,(t.pi||{})[ix],sd.ti); }); }
  else sd.xi.forEach(pl=>{ pl.b=mergeB(pl.role,pl.duty,{},sd.ti); }); }
function m2HT(){ const E=MATCH; const sc=m2Score(E); modal(`<span class="label">Half-time</span><p class="disp">${esc(E.sides[0].name)} ${sc[0]} – ${sc[1]} ${esc(E.sides[1].name)}</p><p class="note">Team talk:</p><div class="chips">${Object.keys(MTALKS).map(k=>`<button class="chip" data-act="m2Talk" data-arg="${k}">${MTALKS[k]}</button>`).join('')}</div><p class="note" id="m2talkRes"></p><div class="row"><button class="btn" data-act="m2Resume">Second half</button><button class="btn sec" data-act="m2TacTab">Change tactics first</button></div>`); }
function m2SubModal(pid,forced){ const E=MATCH; const sd=E.sides[E.user]; const pl=sd.xi.find(p=>p.id===pid); if(!pl) return; V2.subOpen=true; const ix=pl.ix!=null?pl.ix:sd.F.findIndex(x=>x[0]===pl.slot); const [role,duty]=sd.tac.roles[ix>=0?ix:0];
  const opts=sd.bench.map(P).filter(p=>available(p)).map(p=>[p,roleRating(p,role,duty,pl.slot)]).sort((a,b)=>b[1]-a[1]);
  modal(`<span class="label">${forced?'Injury':'Substitution'}</span><p class="disp">${esc(pl.n)} off</p><p class="note">${pl.slot} · ${MROLES[role].n}. Condition ${Math.round(pl.cnd)}%, rating ${pl.r.toFixed(1)}.</p><div class="answers">${opts.map(([p,v])=>`<button class="ans" data-act="m2DoSub" data-arg="${pl.id}:${p.id}"><em>${p.p}</em><span>${esc(p.n)} <small>OVR ${p.o} · ${'★'.repeat(Math.round(roleStars(v)))||'☆'} in this role</small></span></button>`).join('')||'<p class="empty">No one left on the bench.</p>'}</div><button class="btn sec" data-act="m2SubCancel">${forced?'Play on with 10':'Cancel'}</button>`); }
Object.assign(ACT,{
  m2Pause:()=>{ V2.paused=!V2.paused; m2Ctl(); }, m2Speed:s=>{ V2.speed=+s; V2.paused=false; m2Ctl(); }, m2Mode:m=>{ V2.mode=m; m2Ctl(); },
  m2Tab:k=>{ V2.tab=k; m2Tabs(); m2Body(true); },
  m2Skip:()=>{ const E=MATCH; simAll(E); V2.t=E.T2; V2.ftShown=true; m2dStop(); mgrApplyResult(); render(); },
  m2Sub:id=>{ V2.paused=true; m2Ctl(); m2SubModal(+id,false); },
  m2DoSub:a=>{ const [off,on]=a.split(':').map(Number); const E=MATCH; const sd=E.sides[E.user]; const pl=sd.xi.find(p=>p.id===off); if(pl&&doSub(E,sd,pl,on,null)){ if(E.needSub&&E.needSub.pl===pl) E.needSub=null; } V2.subOpen=false; closeModal(); V2.paused=false; m2Ctl(); m2Body(true); },
  m2SubCancel:()=>{ const E=MATCH; if(E.needSub){ const pl=E.needSub.pl; pl.on=false; pl.st.min1=E.t; E.needSub=null; } V2.subOpen=false; closeModal(); V2.paused=false; m2Ctl(); m2Body(true); },
  m2Shout:k=>{ const E=MATCH; const sd=E.sides[E.user]; sd.shout={k,until:E.t+600}; const d=k==='encourage'||k==='praise'?2:k==='demand'?(E.score[E.user]<E.score[1-E.user]?2:-1):0; sd.xi.forEach(p=>p.mor=clamp(p.mor+d,5,100)); const r=$('#m2shoutRes'); if(r) r.textContent=({demand:'The players lift the tempo.',focus:'Concentration up: fewer loose passes.',encourage:'Heads go up.',fire:'They get stuck in. Watch the cards.',calm:'They settle down and cut out the rash challenges.',praise:'The lads appreciate it.'})[k]; },
  m2Talk:k=>{ const ok=applyTalk(MATCH,k,'ht'); const r=$('#m2talkRes'); if(r) r.textContent=MATCH.talkRes; },
  m2Resume:()=>{ closeModal(); MATCH.pauseHT=false; V2.paused=false; m2Ctl(); },
  m2TacTab:()=>{ closeModal(); V2.tab='tac'; m2Tabs(); m2Body(true); MATCH.pauseHT=false; m2Ctl(); }
});

</script>
<script>if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})); }
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});</script></body></html>
