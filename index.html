<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Ballers World">
<meta name="theme-color" content="#0f1117"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png">
<style>html,body{background:#0f1117}</style>
</head><body><title>Ballers World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: management-sim desktop — icon sidebar | top bar + sub-tabs | fixed-height widget dashboard that fits one landscape screen, widgets scroll inside themselves */
  --bg:#0f1117; --side:#0a0c11; --panel:#161920; --panel-2:#1d212a; --panel-3:#252a35; --line:#2a2f3b; --line-2:#353b49;
  --text:#e6e9f0; --mute:#8b93a6; --dim:#5f677a;
  --accent:#3b7bf6; --accent-2:#6aa0ff; --pos:#2fbf71; --warn:#e3b324; --neg:#e5484d; --club:#c8102e;
  --cond:'IBM Plex Sans Condensed','Arial Narrow',sans-serif; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:13px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.app{position:fixed;inset:0;display:grid;grid-template-columns:184px minmax(0,1fr);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow-y:auto;scrollbar-width:none}
.brand{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid var(--line);flex:none}
.brand i{width:8px;height:22px;background:var(--club);border-radius:1px}
.nav{display:flex;flex-direction:column;padding:6px 0}
.nav button{display:flex;align-items:center;gap:11px;padding:7px 14px;color:var(--mute);font-weight:500;position:relative;text-align:left}
.nav button:hover{color:var(--text);background:rgba(255,255,255,.03)}
.nav button[aria-current="true"]{color:var(--text);background:rgba(59,123,246,.12)}
.nav button[aria-current="true"]::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:3px;background:var(--accent)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav .cnt{margin-left:auto;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;border-radius:8px;padding:0 6px;line-height:16px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in srgb,var(--club) 22%,var(--bg)) 0,var(--bg) 340px)}
.crest{width:26px;height:30px;flex:none;clip-path:polygon(0 0,100% 0,100% 64%,50% 100%,0 64%);background:linear-gradient(90deg,var(--c1) 0 50%,var(--c2) 50% 100%);display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:9.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.crest.lg{width:58px;height:66px;font-size:17px}
.crumb{min-width:0;line-height:1.15}
.crumb b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span{color:var(--mute);font-size:11.5px;white-space:nowrap}
.topr{margin-left:auto;display:flex;align-items:center;gap:12px}
.lvl{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--mute)}
.lvl b{color:var(--text);font-family:var(--cond);font-weight:700;font-size:13px}
.xpbar{width:110px;height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent)}
.sp{font-family:var(--cond);font-weight:700;font-size:12px;background:var(--warn);color:#1d1600;border-radius:2px;padding:1px 6px}
.date{text-align:right;line-height:1.15;font-size:11.5px;color:var(--mute);white-space:nowrap}
.date b{display:block;color:var(--text);font-weight:600;font-size:12.5px}
.cont{display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-family:var(--cond);font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:0 14px;height:30px;border-radius:3px;white-space:nowrap}
.cont:hover{background:#4a88ff}
.cont svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.4}
.cont.match{background:var(--pos)}
.subs{height:34px;flex:none;display:flex;align-items:stretch;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subs button{padding:0 11px;color:var(--mute);font-weight:500;white-space:nowrap;border-bottom:2px solid transparent}
.subs button:hover{color:var(--text)}
.subs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.content{flex:1;min-height:0;overflow:auto;padding:10px}
/* widgets */
.dash{display:grid;gap:8px;height:100%;min-height:0}
.dash.home{grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
.dash.c2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.dash.c1{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)}
.dash.c3{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
.w{background:var(--panel);border:1px solid var(--line);border-radius:3px;display:flex;flex-direction:column;min-height:0;min-width:0}
.wh{height:28px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute)}
.wh button{color:var(--accent-2);font-family:var(--cond);font-size:12px;letter-spacing:.05em}
.wb{flex:1;min-height:0;overflow:auto;padding:9px 10px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.stack{display:flex;flex-direction:column;gap:8px;min-height:0}
/* next match */
.nm{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;height:100%}
.nm .t{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:13px;min-width:0}
.nm .mid{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mute)}
.nm .mid b{font-family:var(--cond);font-size:20px;color:var(--text);letter-spacing:.03em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv span{color:var(--mute)}
.kv b{font-weight:600;text-align:right}
/* tables */
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:3px 5px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:5px;text-align:right;border-bottom:1px solid rgba(42,47,59,.6);white-space:nowrap}
th.l,td.l{text-align:left}
td.t{max-width:170px;overflow:hidden;text-overflow:ellipsis}
td.wrap{white-space:normal}
tr.me td{background:rgba(59,123,246,.14);color:#fff;font-weight:600}
.w-tbl .wb{padding:0 4px}
.res{display:inline-block;min-width:18px;text-align:center;font-weight:700;font-size:11px;border-radius:2px;padding:0 4px}
.res.W{background:var(--pos);color:#04150b}.res.D{background:var(--panel-3);color:var(--text)}.res.L{background:var(--neg);color:#fff}
.rt{display:inline-block;min-width:30px;text-align:center;font-weight:700;border-radius:2px;padding:0 4px;font-size:11.5px;color:#0b0d12}
.rt.g{background:var(--pos)}.rt.y{background:var(--warn)}.rt.r{background:var(--neg);color:#fff}.rt.n{background:var(--panel-3);color:var(--mute)}
/* status */
.ovrline{display:flex;align-items:center;gap:12px}
.ovr{font-family:var(--cond);font-weight:700;font-size:38px;line-height:.9}
.ovrline .meta{font-size:12px;color:var(--mute);line-height:1.4}
.ovrline .meta b{color:var(--text);font-weight:600}
.meter{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:8px;font-size:12px}
.meter span{color:var(--mute)}
.meter b{text-align:right;font-weight:600}
.bar{height:6px;background:var(--panel-3);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar i.g{background:var(--pos)}.bar i.y{background:var(--warn)}.bar i.r{background:var(--neg)}
.form{display:flex;gap:3px}
.face{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center}
.face div{background:var(--panel-2);border-radius:2px;padding:4px 0}
.face b{display:block;font-family:var(--cond);font-size:17px;font-weight:700}
.face span{font-size:10px;color:var(--mute);letter-spacing:.06em}
.c-hi{color:var(--pos)}.c-mid{color:var(--warn)}.c-lo{color:var(--neg)}
.stars{color:var(--warn);letter-spacing:1px;font-size:12px}.stars s{color:var(--panel-3);text-decoration:none}
/* lists */
.li{display:grid;grid-template-columns:3px 1fr auto;gap:9px;padding:7px 2px;border-bottom:1px solid rgba(42,47,59,.6);align-items:start;text-align:left;width:100%}
.li i{align-self:stretch;border-radius:2px;background:var(--accent)}
.li i.world{background:var(--dim)}.li i.good{background:var(--pos)}.li i.bad{background:var(--neg)}.li i.you{background:var(--warn)}
.li b{font-weight:600;display:block;font-size:12.5px}
.li p{margin:2px 0 0;color:var(--mute);font-size:12px;max-width:70ch}
.li time{font-size:11px;color:var(--dim);white-space:nowrap}
.li.unread b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
.tgt{display:flex;flex-direction:column;gap:3px;padding:5px 0}
.tgt .row{display:flex;justify-content:space-between;font-size:12px}
.tgt .row span{color:var(--mute)}
.tgt .bar{position:relative;overflow:visible}
.tgt .bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text)}
.spark{width:100%;height:70px;display:block}
/* attributes */
.attrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ag h4{margin:0 0 4px;font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:3px}
.ar{display:grid;grid-template-columns:1fr 26px 22px;gap:6px;align-items:center;padding:2px 0;font-size:12.5px}
.ar b{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.ar .tp{height:3px;grid-column:1 / -1;background:var(--panel-3);border-radius:2px;overflow:hidden;margin-top:-1px}
.ar .tp i{display:block;height:100%;background:var(--accent-2);opacity:.6}
.plus{width:22px;height:20px;border-radius:2px;background:var(--accent);color:#fff;font-weight:700;line-height:20px;text-align:center}
.plus:disabled{background:var(--panel-3);color:var(--dim);cursor:not-allowed}
.btn{background:var(--accent);color:#fff;font-weight:600;border-radius:3px;padding:7px 12px;font-size:12.5px}
.btn.sec{background:var(--panel-3);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.opts{display:flex;flex-wrap:wrap;gap:4px}
.opt{border:1px solid var(--line-2);background:var(--panel-2);color:var(--mute);border-radius:2px;padding:5px 10px;font-weight:500;font-size:12.5px}
.opt[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.hard[aria-pressed="true"]{background:var(--neg);border-color:var(--neg)}
.note{color:var(--mute);font-size:12px;line-height:1.45;margin:0}
.lbl{font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;border-radius:2px;padding:0 5px;margin-left:5px;background:var(--panel-3);color:var(--mute)}
.tag.gold{background:var(--warn);color:#1d1600}.tag.grn{background:var(--pos);color:#04150b}
/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dy{background:var(--panel-2);border:1px solid var(--line);border-radius:2px;padding:5px 6px;min-height:52px;display:flex;flex-direction:column;gap:2px}
.dy b{font-size:11px;color:var(--mute);font-weight:600}
.dy span{font-size:12px;font-weight:600;line-height:1.2}
.dy.done{opacity:.4}.dy.now{border-color:var(--accent);background:rgba(59,123,246,.15)}.dy.match span{color:var(--pos)}
/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,7,11,.72);display:flex;align-items:center;justify-content:center;padding:12px}
.sheet{width:100%;max-width:640px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line-2);border-top:3px solid var(--accent);border-radius:3px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.sheet .label{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.sheet .disp{font-family:var(--cond);font-weight:700;font-size:24px;line-height:1.1;margin:0}
.press-q{background:var(--panel-2);border-left:3px solid var(--warn);padding:10px 12px;font-size:14px;line-height:1.45}
.press-q small{display:block;color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.answers{display:flex;flex-direction:column;gap:4px}
.ans{display:grid;grid-template-columns:80px 1fr;gap:10px;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:2px;padding:8px 10px;font-size:13px;line-height:1.4}
.ans:hover{border-color:var(--accent)}
.ans em{font-style:normal;font-family:var(--cond);font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent-2);font-size:12.5px}
.ans small{color:var(--mute)}
textarea{width:100%;min-height:58px;background:var(--bg);border:1px solid var(--line-2);border-radius:2px;color:var(--text);padding:8px;font:inherit;resize:vertical}
.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.scoreline .sc{font-family:var(--cond);font-weight:700;font-size:40px}
.scoreline .tm{display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600}
.rating{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;padding:4px 10px;border-radius:2px;background:var(--warn);color:#1d1600}
.rating.g{background:var(--pos);color:#04150b}.rating.r{background:var(--neg);color:#fff}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sb{justify-content:space-between}
.lines{display:flex;flex-direction:column}
.lines div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.effects{display:flex;flex-wrap:wrap;gap:4px}
.eff{font-size:12px;font-weight:600;border-radius:2px;padding:2px 7px;background:var(--panel-3)}
.eff.up{background:rgba(47,191,113,.18);color:#6fe0a2}.eff.down{background:rgba(229,72,77,.18);color:#ff8d90}
.badge{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-radius:2px;padding:1px 6px;background:var(--warn);color:#1d1600}
.toast{position:fixed;right:12px;bottom:12px;transform:translateY(160%);background:var(--panel-2);border:1px solid var(--line-2);border-left:3px solid var(--accent);color:var(--text);padding:9px 13px;border-radius:3px;font-weight:500;z-index:40;transition:transform .25s;max-width:min(380px,calc(100% - 24px))}
.toast.on{transform:none}
/* rotate */
.rotate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.rotate svg{width:64px;height:64px;stroke:var(--text);fill:none;stroke-width:1.5}
.rotate h2{font-family:var(--cond);font-weight:700;font-size:22px;margin:0;letter-spacing:.03em}
.rotate p{color:var(--mute);margin:0;max-width:32ch;line-height:1.5}
@media (orientation:portrait) and (max-width:760px){ body:not(.portrait-ok) .rotate{display:flex} }
/* compact landscape phones */
@media (max-height:520px), (max-width:980px){
  .app{grid-template-columns:52px minmax(0,1fr)}
  .brand span,.nav .lbt{display:none}
  .brand{padding:0;justify-content:center}
  .nav button{justify-content:center;padding:9px 0}
  .nav .cnt{position:absolute;top:2px;right:4px;margin:0;font-size:9.5px;padding:0 4px;line-height:14px}
  .lvl .xpbar{width:70px}
}
@media (max-height:520px){
  body{font-size:12px}
  .top{height:40px}.subs{height:30px}.content{padding:6px}.dash{gap:6px}
  .wh{height:24px;font-size:11px}.wb{padding:6px 8px}
  .crest.lg{width:42px;height:48px;font-size:13px}
  .nm .mid b{font-size:16px}
  .ovr{font-size:30px}
  td{padding:3px 4px}
  .dy{min-height:40px;padding:3px 4px}
}
@media (max-width:700px){ .lvl,.date{display:none} }
body.portrait-ok{overflow:auto}
body.portrait-ok .app{position:static;min-height:100%;height:auto}
body.portrait-ok .start{position:static}
body.portrait-ok .main{min-height:100vh}
body.portrait-ok .dash{height:auto;grid-template-columns:1fr!important;grid-template-rows:none!important}
body.portrait-ok .w{max-height:none}
body.portrait-ok .attrs{grid-template-columns:1fr}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v3 additions */
select,input[type=text],input[type=number]{background:var(--bg);border:1px solid var(--line-2);border-radius:2px;color:var(--text);font:inherit;padding:5px 7px;min-width:0}
select:focus-visible,input:focus-visible{outline:2px solid var(--accent-2);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--accent)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.fld>span{font-family:var(--cond);font-weight:600;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line-2);background:var(--panel-2);color:var(--mute);border-radius:2px;padding:4px 9px;font-size:12px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:disabled{opacity:.35;cursor:not-allowed}
.start{position:fixed;inset:0;overflow:auto;background:radial-gradient(80% 60% at 70% 0%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),var(--bg);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.start .inner{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.logo{font-family:var(--cond);font-weight:700;font-size:40px;letter-spacing:.06em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:12px}
.logo i{width:10px;height:38px;background:var(--accent)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

  .top{padding-top:8px;flex-wrap:nowrap}.crumb{flex:1;min-width:0}.topr{gap:8px;flex:none}

}

/* v10: draggable tactics board */
.phase{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.tpitch .tok.drag{touch-action:none;cursor:grab}

.tpitch .tok{transition:left .25s,top .25s}
.tpitch.in{background:repeating-linear-gradient(180deg,#1d5530 0 8.33%,#215f37 8.33% 16.66%)}
.tarrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tarrows line{stroke:rgba(255,255,255,.55);stroke-width:.5;stroke-dasharray:1.4 1.1;vector-effect:non-scaling-stroke}
.tarrows circle{fill:rgba(255,255,255,.4)}
.tok .tpos{font-size:9.5px;font-weight:700;color:var(--warn)}

/* v11: stats */
.stiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stile{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stile span{font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stile b{font-family:var(--cond);font-size:24px;line-height:1.1}.stile i{font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trend{width:100%;height:84px;display:block}.trend polyline{fill:none;stroke:var(--accent-2);stroke-width:2;vector-effect:non-scaling-stroke}
.trend circle{fill:var(--warn)}.trend circle.g{fill:var(--pos)}.trend circle.r{fill:var(--neg)}
.trend .ref{stroke:rgba(255,255,255,.25);stroke-dasharray:4 4;vector-effect:non-scaling-stroke}.trend .avg{stroke:rgba(106,160,255,.45);vector-effect:non-scaling-stroke}
.tscroll{overflow-x:auto}.stbl td .sub{display:block;font-size:10px;color:var(--dim)}
@media (orientation:portrait) and (max-width:820px){ .stiles{grid-template-columns:repeat(2,minmax(0,1fr))} }
.ans.evans{grid-template-columns:1fr;font-size:14px;padding:11px 12px}


/* v11: badges */
.medal{--t:#e3b324;position:relative;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--t) 70%,#fff) 0,var(--t) 45%,color-mix(in srgb,var(--t) 55%,#000) 100%);box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--t) 40%,#000),0 2px 6px rgba(0,0,0,.4)}
.medal b{font-family:var(--cond);font-weight:700;font-size:15px;color:#141414;letter-spacing:.02em}
.medal.lock{background:var(--panel-3);box-shadow:inset 0 0 0 3px var(--line-2);filter:none}.medal.lock b{color:var(--dim)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.bcard{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;opacity:.6}
.bcard.got{opacity:1;border-color:var(--line-2)}.bcard b{font-size:13px}.bcard p{margin:1px 0 3px;font-size:11.5px;color:var(--mute)}
.pins{display:flex;gap:10px;flex-wrap:wrap}.pin{display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:23px;padding:3px 12px 3px 3px;font-size:12px;font-weight:600}
.bunlock{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}.bunlock .medal{width:64px;height:64px;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}.bunlock .medal b{font-size:21px}
.post p{white-space:pre-line}.post.thread{border-left:3px solid var(--pos)}.post.stats{border-left:3px solid var(--accent-2)}


/* v12 transfer centre */
.deals{display:flex;flex-direction:column;gap:8px}
.deal{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.deal>div{display:flex;flex-direction:column;min-width:0}.deal .dn{font-weight:800;opacity:.5;font-size:18px}.deal.rec{border-color:var(--accent)}
.rum{padding:10px 12px;border:1px solid var(--line);border-radius:12px}.rum.me{border-color:var(--accent)}.rum[data-act]{cursor:pointer}
.msgfrom{display:flex;gap:10px;align-items:center}.msgfrom>div{display:flex;flex-direction:column}.msgfrom .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:13px;flex:none}
.msgkv{padding:10px 12px;border:1px solid var(--line);border-radius:12px}.li .note{display:block;font-weight:400}
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:6px}
.numc{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);min-width:0}
.numc b{font-size:17px}.numc span{font-size:10px;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.numc.tk{opacity:.55}.numc.me{border-color:var(--accent);background:var(--accent);color:#fff}.numc.me span{color:#fff}
.crest.gen,.crest.img{clip-path:none;background:none;text-shadow:none;width:28px;height:30px}.crest.gen svg,.crest.img img{width:100%;height:100%;display:block;object-fit:contain}
.crest.gen.lg,.crest.img.lg{width:48px;height:52px}
.crestrow{display:flex;flex-wrap:wrap;gap:12px}.cprev{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
label.btn{display:inline-flex;align-items:center;cursor:pointer}
.lglist{display:flex;flex-direction:column;gap:6px}.lgrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.lgrow b{min-width:0;overflow:hidden;text-overflow:ellipsis}.lgrow .btn{padding:6px 12px}
.lgrow{grid-template-columns:auto 1fr auto auto auto}.bpick{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--text);grid-template-columns:auto 1fr auto}

/* ===================== v13: 2026 theme ===================== */
:root{

/* header */

/* ===================== v14: serious, premium (FotMob / FM26 feel) ===================== */
:root{

/* header */
.top{background:linear-gradient(90deg,color-mix(in srgb,var(--club) 16%,transparent),transparent 60%);border-bottom:1px solid var(--line)}

.crumb b{font-family:var(--body);font-weight:700;font-size:17px;letter-spacing:-.01em}

.iupd{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;margin:10px 12px 2px;width:calc(100% - 24px);padding:10px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.iupd span:first-child{font-weight:600;font-size:13.5px}.iupd .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iback{align-self:flex-start;display:block;padding:12px 14px 0;color:var(--accent-2);font-weight:600;font-size:14px}
.rd{padding:16px;display:flex;flex-direction:column;gap:14px}
.rdh{display:flex;gap:12px;align-items:center}.rdh b{display:block;font-size:15px}.rdh span{font-size:12.5px;color:var(--mute)}
.rdt{margin:0;font-size:21px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.rdb{margin:0;font-size:15px;line-height:1.6;color:#d6dce8;white-space:pre-line;max-width:62ch}
.rdkv{border:1px solid var(--line);border-radius:10px;overflow:hidden}.rdkv div{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:13.5px}.rdkv div:last-child{border-bottom:0}.rdkv span{color:var(--mute)}.rdkv b{text-align:right}
.rd .btn{align-self:flex-start}
@media (orientation:portrait) and (max-width:820px){ .ibox{height:auto}.ibox>.w{overflow:visible} }
.mtabs{display:grid;grid-template-columns:1fr 1fr;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}.mtabs button{padding:8px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mute)}.mtabs button.on{background:var(--panel-3);color:var(--text)}
.impbox{border:1px solid rgba(234,179,8,.35);background:rgba(234,179,8,.06);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.imp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding-top:10px;border-top:1px solid var(--line)}.impbox .lbl+.imp{border-top:0;padding-top:0}
.imp>div{display:flex;flex-direction:column;gap:2px;min-width:0}.imp b{font-size:14px}.imp>div>span{font-size:13px}.imp .btn{padding:7px 10px;font-size:12px;white-space:nowrap}
@media (max-width:420px){ .imp{grid-template-columns:1fr} .imp .btn{justify-self:start} }
.fmini{display:inline-flex;gap:2px}.fmini .res{min-width:16px;padding:1px 3px;font-size:10px}
.txi{display:flex;flex-direction:column;gap:14px;padding:6px 0;background:linear-gradient(180deg,rgba(34,197,94,.08),rgba(34,197,94,.02));border-radius:12px}
.txl{display:flex;justify-content:space-around;gap:6px;flex-wrap:wrap}
.txp{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;text-align:center}.txp .crest,.txp .crest.gen,.txp .crest.img{width:30px;height:32px}.txp b{font-size:13px}.txp span{font-size:11px;color:var(--mute)}.txp.me b{color:var(--accent-2)}
.pst{display:flex;flex-direction:column;gap:2px;text-align:left;padding:11px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}.pst b{font-size:14px}.pst span{font-size:12.5px;color:var(--mute)}.pst:disabled{opacity:.45}
.lfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.lfo{display:flex;flex-direction:column;gap:3px;text-align:left;padding:11px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}.lfo.on{border-color:var(--accent);background:rgba(59,130,246,.12)}.lfo b{font-size:14px}.lfo span{font-size:12.5px;color:var(--accent-2);font-weight:600}.lfo i{font-style:normal;font-size:12px;color:var(--mute);line-height:1.4}
.fsub{display:block;font-style:normal;font-size:11px;color:var(--dim)}
.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:62px 28px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line)}.tli:last-child{border-bottom:0}
.tld{font-size:12px;color:var(--dim);padding-top:4px}.tlo{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line-2)}.tlo .hi{width:14px;height:14px;color:var(--accent-2)}
.tli.k-trophy .tlo .hi,.tli.k-tour .tlo .hi,.tli.k-award .tlo .hi{color:var(--gold)}.tli b{display:block;font-size:14px}.tli div span{font-size:12.5px;color:var(--mute)}
.awd{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}.awr{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0}.awr.win span:first-child{font-weight:700}.awr.me span:first-child{color:var(--accent-2)}

  if(tier>=3||big) arts.push({src:pick(outs.filter(o=>o!==arts[0].src)),h:perf==='legend'||perf==='great'?`Is ${last} the most exciting young player in the ${myClub&&myClub.league?LMETA(myClub.league).name:'country'}?`:res==='L'?`Questions for ${myClub?myClub.mgr:'the manager'} after ${score} defeat`:`What we learned from ${myClub?myClub.name:'the game'} vs ${oppName}`,b:'Analysis and reaction from the stadium.'});

    say('@'+tv.replace(/\W/g,''),`"${q}" — ${pun}`,3,true,'tv'); }
  // fans
  const nFans=[0,2,4,6,8][tier]+(big?3:0);
  const usedL=new Set(); const pickU=arr=>{ const left=arr.filter(x=>!usedL.has(x)); const v=pick(left.length?left:arr); usedL.add(v); return v; };
  for(let i=0;i<nFans;i++) say(i%4===3&&opp?handleFor(opp):handleFor(myClub||{short:'FC'}),i%4===3&&opp?(perf==='poor'||perf==='none'?`${last}? Never heard of him. Easy game.`:`Fair play to ${last}, hurt us today.`):pickU(fanLines[perf].concat(perf==='poor'?[`Not ${last}'s day. Move on.`,`${last} looked lost out there`]:perf==='none'?[`Bring ${last} on next week, simple`]:[`${last} is the real deal`,`Can't wait to see more of ${last}`])),1);

  const trend=mine&&tier>=3&&(perf==='legend'||(perf==='great'&&big));

  if(mine) m.followers+=Math.round(buzz*({legend:40,great:15,good:5,ok:1,poor:2,none:0}[perf])*rnd(.5,1.5));
  return {tier,big,posts,arts,trend}; }

// ===================== REALISTIC TRANSFER MARKET =====================
// Market values, contracts, untouchables, rivalries, budgets, player willingness, three-club chains.
const RIVAL_PAIRS=[['Arsenal','Tottenham Hotspur'],['Arsenal','Chelsea'],['Chelsea','Tottenham Hotspur'],['Liverpool','Everton'],['Liverpool','Manchester United'],['Manchester United','Manchester City'],['Newcastle United','Sunderland'],['Aston Villa','Birmingham City'],['West Ham United','Millwall'],['West Ham United','Tottenham Hotspur'],['Crystal Palace','Brighton & Hove Albion'],['Leeds United','Manchester United'],['Sheffield United','Sheffield Wednesday'],['Nottingham Forest','Derby County'],['Bristol City','Bristol Rovers'],['Stoke City','Port Vale'],['Ipswich Town','Norwich City'],['Southampton','Portsmouth'],['Cardiff City','Swansea City'],['Blackburn Rovers','Burnley'],['West Bromwich Albion','Wolverhampton Wanderers'],['Bolton Wanderers','Wigan Athletic'],['Coventry City','Leicester City'],['Fulham','Chelsea'],['Brentford','Queens Park Rangers'],['Charlton Athletic','Millwall'],['Liverpool','Manchester City'],
 ['Real Madrid','FC Barcelona'],['Real Madrid','Atlético de Madrid'],['FC Barcelona','Espanyol'],['Sevilla FC','Real Betis'],['Athletic Club','Real Sociedad'],['Celta','Deportivo de La Coruña'],['Real Oviedo','Sporting de Gijón'],['Valencia CF','Real Madrid'],['FC Barcelona','Atlético de Madrid'],
 ['Inter','AC Milan'],['Inter','Juventus'],['AC Milan','Juventus'],['Juventus','Torino'],['Genoa','Sampdoria'],['Roma','Lazio'],['Napoli','Juventus'],['Fiorentina','Juventus'],['Napoli','Roma'],
 ['Borussia Dortmund','Schalke 04'],['FC Bayern München','Borussia Dortmund'],['Hamburger SV','Werder Bremen'],['Hamburger SV','FC St. Pauli'],['1. FC Köln','Borussia Mönchengladbach'],['FC Bayern München','Bayer 04 Leverkusen'],
 ['Paris Saint-Germain','Olympique de Marseille'],['Olympique Lyonnais','AS Saint-Étienne'],['RC Lens','Lille'],['OGC Nice','AS Monaco'],['Olympique de Marseille','Olympique Lyonnais'],
 ['SL Benfica','Sporting CP'],['SL Benfica','FC Porto'],['FC Porto','Sporting CP'],['SC Braga','Vitória SC'],
 ['AFC Ajax','Feyenoord'],['AFC Ajax','PSV'],['PSV','Feyenoord'],
 ['Shamrock Rovers','Bohemians'],['Bohemians','Shelbourne'],['Shamrock Rovers',"St Patrick's Athletic"],['Dundalk','Drogheda United'],['Derry City','Finn Harps']];
let _rivalSet=null;
function rivalSet(){ if(_rivalSet) return _rivalSet; _rivalSet=new Set(); const byName={}; S.clubs.forEach(c=>byName[c.name]=c.id); RIVAL_PAIRS.forEach(([a,b])=>{ const x=byName[a], y=byName[b]; if(x!=null&&y!=null){ _rivalSet.add(x+':'+y); _rivalSet.add(y+':'+x); } }); return _rivalSet; }
// 2 = derby / historic rival (almost never deal), 1 = direct competitor at the top of the same league, 0 = none
function rivalry(a,b){ if(a==null||b==null) return 0; if(rivalSet().has(a+':'+b)) return 2; const A=club(a), B=club(b); if(A.league&&A.league===B.league&&A.rep>=84&&B.rep>=84) return 1; return 0; }

// ---- market value ----
const LEAGUE_MULT={ENG1:1.3,ESP1:1.0,ITA1:1.0,GER1:1.0,FRA1:.9,POR1:.75,NED1:.7,ENG2:1.1,ESP2:.55,ITA2:.55,GER2:.55,FRA2:.45,POR2:.35,NED2:.4,ENG3:.75,ENG4:.6,ENG5:.5,IRL1:.8,IRL2:.45};
function leagueMult(c,o){ const m=c&&c.league?(LEAGUE_MULT[c.league]||.6):.6; if(o==null) return m; const w=clamp((86-o)/14,0,1); return 1+(m-1)*w; } // elite players are priced on ability, not league
function contractMult(y){ return y<=0?0:y===1?.55:y===2?.85:y===3?1:1.1; }
function ctOf(p){ if(p.ct==null) p.ct=ri(1,5); return p.ct; }
function baseValue(o,a,pt){ return playerValue(o,a,pt); }
function marketValue(p){ const v=baseValue(p.o,p.a,p.pt)*leagueMult(club(p.c),p.o)*contractMult(Math.max(1,ctOf(p))); return Math.max(10000,Math.round(v/sigRound(v))*sigRound(v)); }
function sigRound(v){ return v>=1e7?5e5:v>=1e6?1e5:v>=1e5?1e4:1e3; }
function roundFee(v){ return v<=0?0:Math.round(v/sigRound(v))*sigRound(v); }

// ---- squad standing ----
const POS_GROUP={GK:'GK',CB:'CB',LB:'FB',RB:'FB',LWB:'FB',RWB:'FB',CDM:'CM',CM:'CM',CAM:'AM',LM:'W',RM:'W',LW:'W',RW:'W',CF:'ST',ST:'ST'};
function grp(p){ return POS_GROUP[p]||'CM'; }
const GROUP_NEED={GK:1,CB:2,FB:2,CM:2,AM:1,W:2,ST:1};
function standing(p){ const c=club(p.c); const sq=c.squad.map(P).sort((a,b)=>b.o-a.o); const rank=sq.findIndex(x=>x.id===p.id); const same=sq.filter(x=>grp(x.p)===grp(p.p)); const posRank=same.findIndex(x=>x.id===p.id); return {rank,posRank,starter:posRank<(GROUP_NEED[grp(p.p)]||1)}; }
// untouchable: the core of a big club. They only go if the player forces it AND the fee is silly.
function untouchable(p){ const c=club(p.c); if(c.rep<78||p.a>31) return false; const s=standing(p); return s.rank<4||(s.starter&&p.o>=clubLevel(c)+1)||(p.a<=22&&p.pt>=clubLevel(c)+5&&s.rank<11); }

// ---- budgets ----
const COUNTRY_MONEY={ENG:1.6,ESP:1.1,ITA:1.0,GER:1.05,FRA:.95,POR:.6,NED:.6,IRL:.25};
function budgetFor(c){ return 1e6*Math.exp((c.rep-50)/9.5)*(COUNTRY_MONEY[c.country]||.6)*(c.league&&/2$/.test(c.league)&&c.country!=='ENG'?.5:1); }
function resetBudgets(winter){ _rivalSet=null; S.budgets=S.budgets||{}; S.clubs.forEach(c=>{ if(!c.league||c.b) return; const b=budgetFor(c); S.budgets[c.id]=Math.round(winter?(S.budgets[c.id]||0)*.5+b*.3:b*rnd(.7,1.3)); }); }

// ---- will the player go? ----
const NAT_HOME={ENG:'ENG',IRL:'IRL',FRA:'FRA',GER:'GER',ITA:'ITA',ESP:'ESP',POR:'POR',NED:'NED',SCO:'ENG',WAL:'ENG',NIR:'ENG'};
const CULTURE={ENG:'en',IRL:'en',SCO:'en',WAL:'en',NIR:'en',USA:'en',CAN:'en',AUS:'en',JAM:'en',GHA:'en',NGA:'en',ESP:'es',ARG:'es',URU:'es',COL:'es',MEX:'es',CHI:'es',ECU:'es',PAR:'es',VEN:'es',POR:'pt',BRA:'pt',ANG:'pt',CPV:'pt',MOZ:'pt',FRA:'fr',BEL:'fr',SEN:'fr',CIV:'fr',MLI:'fr',CMR:'fr',MAR:'fr',ALG:'fr',TUN:'fr',GUI:'fr',COD:'fr',ITA:'it',GER:'de',AUT:'de',SUI:'de',NED:'nl',SUR:'nl'};
const LEAGUE_CULTURE={ENG:'en',IRL:'en',ESP:'es',POR:'pt',FRA:'fr',ITA:'it',GER:'de',NED:'nl'};
// weather, lifestyle and pull of the league, as players see it
const LIFESTYLE={ESP:2,ITA:1.5,POR:1.2,FRA:1,ENG:1.6,GER:.6,NED:.2,IRL:-1.5};
function willingness(p,from,to){ const s=standing(p); let w=(to.rep-from.rep)/3.5;
  w+=Math.log(wageBase(to)/wageBase(from))*2.2;
  const best=to.squad.map(P).filter(x=>grp(x.p)===grp(p.p)).sort((a,b)=>b.o-a.o); const slot=(GROUP_NEED[grp(p.p)]||1)-1; const bar=best[slot]?best[slot].o:0;
  w+=p.o>=bar+1?2:p.o>=bar-2?0:-3.5; // will he play?
  if(rivalry(from.id,to.id)===2) w-=6+(p.sn>=4?4:0); else if(rivalry(from.id,to.id)===1) w-=2;
  if(p.sn>=6&&s.rank<6) w-=4; else if(p.sn>=4) w-=1.5; // loyalty, settled family life
  const home=NAT_HOME[p.nt]; if(home&&home===to.country) w+=p.a>=29?4:1.5; else if(home&&home===from.country) w-=p.a>=27?2.5:1;
  if(CULTURE[p.nt]&&CULTURE[p.nt]===LEAGUE_CULTURE[to.country]) w+=1; else if(to.country!==from.country) w-=p.a>=28?1.5:.5;
  w+=(LIFESTYLE[to.country]||0)-(LIFESTYLE[from.country]||0);
  if(S.euro&&isInEurope(to.id)) w+=1.2; if(S.euro&&isInEurope(from.id)) w-=.8;
  if(ctOf(p)<=1) w+=1.5; // running down his deal
  if(!s.starter) w+=2; // not playing, wants out
  return w; }
function isInEurope(cid){ try{ const e=S.euro; if(!e) return false; for(const k in e){ const x=e[k]; if(x&&(x.clubs||x.teams||[]).includes(cid)) return true; } }catch(e){} return false; }

// ---- will the club sell, and for how much? ----
function sellerTerms(p,seller,buyer){ const v=marketValue(p); if(ctOf(p)<=0) return {ok:true,fee:0,free:true};
  const r=rivalry(seller.id,buyer.id); let mult=1, chance=1;
  if(untouchable(p)){ mult=2.4; chance=.08; }
  else { const s=standing(p); if(s.rank<8) { mult=1.35; chance=.6; } else if(s.starter){ mult=1.2; chance=.75; } else { mult=.9; chance=.95; } }
  if(r===2){ chance*=.04; mult*=1.6; } else if(r===1){ chance*=.3; mult*=1.3; }
  if(buyer.rep<seller.rep-4){ chance*=.35; } // big clubs rarely sell down unless he's surplus
  if(ctOf(p)===1){ mult*=.8; chance=Math.min(1,chance*1.6); }
  if(S.week>=WINDOW_WINTER[0]&&S.week<=WINDOW_WINTER[1]&&standing(p).starter) chance*=.5; // mid-season, keep your starters
  if(typeof wlListed==='function'&&wlListed(p)&&r<2){ chance=Math.max(chance,.92); return {ok:Math.random()<chance,fee:roundFee(p.wl.ask*rnd(.92,1.05)),v}; }
  return {ok:Math.random()<chance,fee:roundFee(v*mult*rnd(.95,1.2)),v}; }

function worldTransfers(){
  if(!S.budgets||(S.budgetsS!==S.season&&S.week<=WINDOW_SUMMER[1])){ resetBudgets(false); S.budgetsS=S.season; } else if(S.week===WINDOW_WINTER[0]&&S.budgetsW!==S.season){ resetBudgets(true); S.budgetsW=S.season; }
  const myc=myClubId(); const moves=[]; const clubs=S.clubs.filter(c=>c.league&&c.league!=='EUR'&&!c.b&&S.leagues[c.league]);
  const winter=S.week>=WINDOW_WINTER[0];
  const attempts=winter?22:45;
  // richer clubs act more often
  const weighted=clubs.map(c=>({c,w:Math.sqrt(Math.max(0,S.budgets[c.id]||0))+50})); const tot=weighted.reduce((s,x)=>s+x.w,0);
  const pickBuyer=()=>{ let r=Math.random()*tot; for(const x of weighted){ r-=x.w; if(r<=0) return x.c; } return weighted[0].c; };
  const busy=new Set();
  for(let i=0;i<attempts;i++){
    const b=pickBuyer(); if(busy.has(b.id)||(S.mode==='mgr'&&b.id===myc)) continue; const bl=clubLevel(b); const budget=S.budgets[b.id]||0;
    // find the weakest starting area
    const sq=b.squad.map(P); let need=null, gap=-99;
    for(const g in GROUP_NEED){ const inG=sq.filter(x=>grp(x.p)===g).sort((x,y)=>y.o-x.o); const st=inG[GROUP_NEED[g]-1]; const o=st?st.o:30; const d=bl-o+(inG.length<GROUP_NEED[g]+1?4:0)+rnd(0,3); if(d>gap){ gap=d; need={g,o,inG}; } }
    if(!need||gap<1.5) continue;
    const lo=need.o+2, hi=bl+(b.rep>=85?6:4);
    const cands=S.players.filter(p=>!(S.mode==='mgr'&&p.c===myc)&&grp(p.p)===need.g&&p.o>=lo&&p.o<=hi&&p.a<=32&&p.c!==b.id&&p.mv!==S.season&&!busy.has(p.c)&&club(p.c).league&&club(p.c).league!=='EUR'&&!club(p.c).b&&club(p.c).rep<=b.rep+6);
    if(!cands.length) continue;
    const shortlist=cands.map(p=>({p,s:p.o+(p.a<=24?2:0)-(p.a>=30?2:0)+rnd(0,4)})).sort((x,y)=>y.s-x.s).slice(0,6);
    for(const {p} of shortlist){
      const seller=club(p.c); if(seller.id===myc&&(S.mode==='mgr'||Math.random()<.4)) continue;
      const t=sellerTerms(p,seller,b); if(!t.ok) continue; if(t.fee>budget) continue;
      if(willingness(p,seller,b)+rnd(-2,2)<1.5) continue;
      // chain: buyer offloads its weakest player in that area to a club at his level, that club's weakest goes to the seller
      const out=need.inG.filter(x=>x.mv!==S.season).sort((x,y)=>x.o-y.o)[0]; if(!out) break;
      let Y=null; if(Math.abs(clubLevel(seller)-out.o)<=4&&rivalry(seller.id,b.id)<2) Y=seller;
      else { const ys=clubs.filter(c=>c.id!==myc&&c.id!==b.id&&c.id!==seller.id&&!busy.has(c.id)&&Math.abs(clubLevel(c)-out.o)<=3&&c.rep<b.rep); if(!ys.length) break; Y=ys.find(c=>c.country===b.country&&Math.random()<.7)||pick(ys); }
      // execute
      const exec=(pl,from,to,fee)=>{ from.squad=from.squad.filter(x=>x!==pl.id); to.squad.push(pl.id); pl.c=to.id; pl.sn=0; pl.ct=ri(3,5); pl.mv=S.season; S.budgets[to.id]=(S.budgets[to.id]||0)-fee; S.budgets[from.id]=(S.budgets[from.id]||0)+fee*.7; moves.push({p:pl,from,to,fee,main:pl===p});
        if(S.me&&S.me.mates&&S.me.mates[pl.id]!=null&&to.id!==myc) delete S.me.mates[pl.id]; if(S.me&&to.id===myc&&S.me.mates) S.me.mates[pl.id]=ri(35,50); };
      exec(p,seller,b,t.fee);
      const outFee=roundFee(marketValue(out)*rnd(.6,.9)); exec(out,b,Y,Math.min(outFee,Math.max(0,S.budgets[Y.id]||0)));
      if(Y!==seller){ const w=Y.squad.map(P).filter(x=>grp(x.p)===need.g&&x.id!==out.id&&x.mv!==S.season).sort((x,y)=>x.o-y.o)[0]; if(w) exec(w,Y,seller,roundFee(marketValue(w)*rnd(.5,.8))); }
      busy.add(b.id); busy.add(seller.id); busy.add(Y.id);
      if(S.me&&b.id===myc){ const rv=SEL_GROUP[S.me.pos].includes(p.p); news(rv?'bad':'you',`${club(myc).name} sign ${p.n}`,`${p.n} (${p.p}, ${p.o} OVR) arrives from ${seller.name}${t.free?' on a free transfer':' for '+money(t.fee)}.${rv?' He plays in your position.':''}`); }
      if(S.me&&seller.id===myc&&S.me.club!=null) news('you',`${p.n} leaves for ${b.name}`,`${seller.name} accept ${t.free?'that his contract is up':money(t.fee)}. ${p.n} moves on after ${p.sn||'a few'} seasons.`,true);
      break;
    }
  }
  if(S.week===WINDOW_SUMMER[1]) S.players.forEach(p=>{ if(p.ct<=0) p.ct=ri(1,2); }); // unsold free agents sign short deals where they are
  (S.transfers=S.transfers||[]); moves.sort((a,b)=>b.fee-a.fee).forEach(mv=>S.transfers.unshift({s:S.season,w:S.week,n:mv.p.n,pos:mv.p.p,o:mv.p.o,a:mv.p.a,from:mv.from.id,to:mv.to.id,fee:mv.fee,main:mv.main?1:0})); if(S.transfers.length>400) S.transfers.length=400;
  moves.filter(x=>x.fee>=30e6||(x.p.real&&x.p.o>=80)).slice(0,3).forEach(mv=>news('world',`${mv.p.n} joins ${mv.to.name}`,mv.fee?`${mv.from.name} accept ${money(mv.fee)} for the ${mv.p.a}-year-old ${POS_NAME[mv.p.p].toLowerCase()}.`:`The ${mv.p.a}-year-old arrives on a free after his ${mv.from.name} contract ran out.`));
  refreshLevels(); }

// contracts tick down each summer; most good players renew, some run down and leave on a free
function worldContracts(){ for(const p of S.players){ ctOf(p); p.ct--; if(p.ct<=0){ const s=club(p.c)?standing(p):{rank:30}; const keep=p.a<=31&&(s.rank<14||p.a<=23); if(keep&&Math.random()<.8) p.ct=ri(2,5); else p.ct=0; } } }

// ===================== YOUTH PATHWAY =====================
// Good youth form -> train with the first team -> senior call-up -> breakthrough. Bigger academies come calling.
function youthProgress(rating,g,a){ const m=S.me; if(!m.club) return; m.yform=(m.yform||[]); m.yform.push(rating); if(m.yform.length>8) m.yform.shift();
  m.ystat=m.ystat||{s:S.season,ap:0,g:0,a:0}; if(m.ystat.s!==S.season) m.ystat={s:S.season,ap:0,g:0,a:0}; m.ystat.ap++; m.ystat.g+=g; m.ystat.a+=a;
  const f=avg(m.yform.slice(-4)); const c=myClubObj(); const gap=ovr()-(clubLevel(c)-14); const mgr=c.mgr;
  if(!(m.ftTrain>0)&&m.yform.length>=3&&(f>=7.2||rating>=8.5)&&Math.random()<.7+gap*.03){ m.ftTrain=ri(3,5); m.rel.manager=clamp(m.rel.manager+3,0,100);
    news('good','Called up to first-team training',`${mgr} wants a closer look. You'll train with the senior squad for the next ${m.ftTrain} weeks. Bigger gains in team sessions, and a chance of a matchday call-up.`); return; }
  if(m.ftTrain>0&&!m.callUp&&(f>=7.1||rating>=8.0)&&ovr()>=clubLevel(c)-14&&Math.random()<.6){ m.callUp=true;
    news('good','Senior call-up!',`After your form for the ${S.youth?S.youth.name:'youth side'} (${m.ystat.g} goals, ${m.ystat.a} assists this season), ${mgr} has named you in the first-team squad for the next game.`); } }

// U18 moves follow the real rules: domestic at any age, cross-border only at 16+ inside the EU (so not to or from England)
const EU_LEAGUE=new Set(['IRL','FRA','GER','ITA','ESP','POR','NED']);
function youthOffers(n){ const m=S.me, cur=club(m.club); if(!cur) return 0; if(!n) n=1;
  const yf=m.yform||[]; const f=yf.length?avg(yf.slice(-6)):6.6; const pull=(f-6.7)*1.6+(m.pot-72)/10+(m.breakthrough===S.season?1:0);
  if(pull<.4&&Math.random()>.1) return 0;
  const have=new Set(m.offers.map(x=>x.club));
  const ok=c=>c.league&&!c.b&&c.id!==cur.id&&!have.has(c.id)&&rivalry(cur.id,c.id)<2&&((c.country===cur.country&&c.rep>=cur.rep-3)||(m.age>=16&&c.rep>=cur.rep+4&&EU_LEAGUE.has(c.country)&&EU_LEAGUE.has(cur.country)));
  // spread interest: recent suitors are less likely to come back straight away, and the top few candidates are drawn at random
  m.ysuit=m.ysuit||{}; const recent=id=>(m.ysuit[id]||-99)>=S.season*100+S.week-26;
  let pool=S.clubs.filter(ok).map(c=>({c,s:c.rep+rnd(0,30)-Math.max(0,c.rep-cur.rep-15-pull*8)*1.5-(recent(c.id)?25:0)})); const dom=pool.filter(x=>x.c.country===cur.country), abr=pool.filter(x=>x.c.country!==cur.country); const usePool=(dom.length&&(Math.random()<(pull>3?.4:.75)||!abr.length)?dom:abr).sort((a,b)=>b.s-a.s).slice(0,7); pool.length=0; pool.push(...usePool);
  const picks=shuffle(pool.slice()).sort((a,b)=>b.s-a.s+rnd(-12,12)).slice(0,Math.min(n,pull>1.5?2:1)).map(x=>x.c); picks.forEach(c=>m.ysuit[c.id]=S.season*100+S.week);
  picks.forEach(c=>{ const comp=roundFee(Math.max(20000,myValue()*rnd(.6,1.1),25000*Math.exp((cur.rep-55)/12)));
    m.offers.push({id:Math.random().toString(36).slice(2),club:c.id,type:'youth',fee:comp,wage:roundWage(wageFor(c.id,ovr(),'Youth')),role:'Youth',years:Math.max(1,17-m.age+1),blocked:false,expires:S.week+3,via:'Academy scouts'}); });
  if(picks.length) news('you','Academy interest',`${picks.map(c=>c.name).join(' and ')} ${picks.length>1?'want':'wants'} you in ${picks.length>1?'their academies':'their academy'}. ${cur.name} would receive ${money(m.offers[m.offers.length-1].fee)} in training compensation. Details in Transfers.`);
  return picks.length; }

// ===================== PLAYER CAREER: realistic transfer approaches =====================
// scouting -> bid -> your club accepts / rejects / counters -> improved bids or walk away -> fee agreed -> personal terms
const ROLE_ASK={'Star player':1.8,'Key player':1.45,'First team':1.15,Rotation:.95,Prospect:.85,Youth:.8};
function askingPrice(buyerId){ const m=S.me, c=myClubObj(); if(!c||!m.contract) return 0; const v=myValue(); let a=v*(ROLE_ASK[m.contract.role]||1);
  const y=m.contract.years||1; a*=y<=1?.7:y===2?.95:1.1; if(rivalry(c.id,buyerId)===1) a*=1.3; if(rivalry(c.id,buyerId)===2) a*=2; if(c.rep>=80&&ROLES.indexOf(m.contract.role)>=4) a*=1.2; if(m.transferReq) a*=.82;
  if(m.contract.release&&a>m.contract.release) a=m.contract.release; return roundFee(a); }
function startApproach(cid){ const m=S.me; m.approaches=m.approaches||[]; if(m.approaches.some(x=>x.club===cid&&x.stage!=='dead')) return; const c=club(cid);
  const v=myValue(); const bud=S.budgets&&S.budgets[cid]!=null?Math.max(S.budgets[cid],budgetFor(c)*.3):budgetFor(c); const max=roundFee(Math.min(v*rnd(1.05,1.45)*(c.rep>myClubObj().rep+8?1.1:1),bud*.65));
  m.approaches.push({id:'ap'+Math.random().toString(36).slice(2),club:cid,stage:windowOpen()?'bid':'scout',bid:0,max:Math.max(max,roundFee(v*.8)),rej:0,w:S.week,log:[]});
  if(!windowOpen()) news('you',`${c.name} scouts in the stands`,`${c.name} have been watching you closely. Expect them to make a move when the window opens.`); }
function apLog(a,txt){ a.log.unshift(`W${S.week}: ${txt}`); if(a.log.length>6) a.log.length=6; }
function approachTick(){ const m=S.me; if(!m.approaches||m.club==null||m.loan) return; const mine=myClubObj();
  for(const a of m.approaches){ if(a.stage==='dead'||a.stage==='agreed'||a.tw===S.week) continue; a.tw=S.week; const c=club(a.club);
    if(!windowOpen()){ if(a.stage==='bid'){ a.stage='scout'; apLog(a,'Window closed. They will revisit.'); } continue; }
    if(a.stage==='scout'){ a.stage='bid'; }
    const ask=askingPrice(a.club); a.ask=ask;
    if(!a.bid) a.bid=roundFee(Math.min(a.max,myValue()*rnd(.72,.95))); else a.bid=roundFee(Math.min(a.max,Math.max(a.bid*rnd(1.1,1.22),a.counter||0)));
    const release=m.contract&&m.contract.release&&a.bid>=m.contract.release;
    if(release||a.bid>=ask){ a.stage='agreed'; a.fee=a.bid; apLog(a,`${mine.name} accept ${money(a.bid)}${release?' (release clause)':''}.`);
      const ft=fairTerms(a.club); m.offers.push({id:a.id,club:a.club,type:'transfer',fee:a.bid,wage:roundWage(ft.wage*rnd(.95,1.12)),role:ft.role,years:ft.years,blocked:false,expires:S.week<=WINDOW_SUMMER[1]?WINDOW_SUMMER[1]:WINDOW_WINTER[1],via:'Club to club'});
      news('you',`Fee agreed with ${c.name}`,`${mine.name} have accepted ${money(a.bid)}${release?', triggering your release clause':''}. You have permission to discuss personal terms. Go to Transfers.`); continue; }
    a.rej++;
    if(a.bid>=ask*.85&&a.max>=ask){ a.counter=ask; apLog(a,`Bid of ${money(a.bid)} rejected. ${mine.name} want ${money(ask)}.`); news('you',`${mine.name} reject ${c.name} bid`,`${money(a.bid)} turned down. Your club have told them it would take ${money(ask)}.`,true); continue; }
    if(a.bid>=a.max||a.rej>=3){ a.stage='dead'; apLog(a,`Final bid of ${money(a.bid)} rejected. ${c.name} walk away.`); news('you',`${c.name} pull out`,`After ${a.rej} rejected bid${a.rej>1?'s':''} (last ${money(a.bid)}), ${c.name} have ended their interest. ${mine.name} valued you at ${money(ask)}.`); continue; }
    apLog(a,`Bid of ${money(a.bid)} rejected.`); news('you',`${c.name} bid ${money(a.bid)}`,`${mine.name} rejected it. ${a.rej===1?'Expect an improved offer.':'They are considering their next move.'}`,a.rej>1); }
  m.approaches=m.approaches.filter(a=>a.stage!=='dead'||S.week-a.w<10); }

// effect applier: returns chip list
function evApply(fx){ const m=S.me, out=[]; const add=(l,v)=>{ if(v) out.push([l,v]); };
  for(const k of ['manager','fans','media','tactical']) if(fx[k]){ m.rel[k]=clamp(m.rel[k]+fx[k],0,100); add({manager:'Manager',fans:'Fans',media:'Media',tactical:'Tactical'}[k],fx[k]); }
  if(fx.morale){ m.morale=clamp(m.morale+fx.morale,0,100); add('Morale',fx.morale); }
  if(fx.energy){ m.energy=clamp(m.energy+fx.energy,0,100); add('Energy',fx.energy); }
  if(fx.mates){ for(const k in m.mates) m.mates[k]=clamp(m.mates[k]+fx.mates,0,100); add('Teammates',fx.mates); }
  if(fx.mate){ const [pid,v,name]=fx.mate; m.mates[pid]=clamp((m.mates[pid]==null?45:m.mates[pid])+v,0,100); add(name,v); }
  if(fx.bank){ m.bank+=fx.bank; add(fx.bank>0?'Cash':'Cost',fx.bank); }
  if(fx.followers){ m.followers=Math.max(0,m.followers+fx.followers); add('Followers',fx.followers); }
  if(fx.rep){ m.rep=clamp(m.rep+fx.rep,0,100); add('Reputation',fx.rep); }
  if(fx.sharp){ m.sharp=clamp(m.sharp+fx.sharp,0,100); add('Sharpness',fx.sharp); }
  if(fx.xp){ gainXP(fx.xp); add('XP',fx.xp); }
  if(fx.train){ fx.train.forEach(k=>addTXP(k,14*growthMult())); add('Training','+'); }
  return out; }

// delayed consequences
function evDue(){ const m=S.me; if(!m.evLater||!m.evLater.length) return; const now=evDayAbs(); const due=m.evLater.filter(x=>x.at<=now); m.evLater=m.evLater.filter(x=>x.at>now);
  for(const d of due){ if(d.key==='leak_night'){ news('bad','Night out exposed',`${outlet()} publish photos of you leaving a club at 3am${d.data.tmrw?' the night before a match':''}.`); m.rel.manager=clamp(m.rel.manager-6,0,100); m.rel.fans=clamp(m.rel.fans-4,0,100); m.followers+=ri(2000,8000); if(d.data.tmrw&&m.contract){ const f=roundWage(m.contract.wage*.5+500); m.bank-=f; news('bad','Fined by the club',`${money(f)} for breaching club rules.`); } }
    else if(d.key==='boot_better'){ const v=roundWage(d.data.v*rnd(1.6,2.4)); m.bootDeal=v; m.bank+=v; news('good','Bigger boot deal signed',`The waiting paid off. A global brand signs you for ${money(v)} a year.`); }
    else if(d.key==='boot_none'){ news('you','Boot deal falls through','The bigger offer never came, and the first brand signed someone else.'); }
    else if(d.key==='podcast_clip'){ news('bad','Podcast clip goes viral',`A clip of you saying the dressing room "lacks leaders" is everywhere.`); m.rel.manager=clamp(m.rel.manager-4,0,100); for(const k in m.mates) m.mates[k]=clamp(m.mates[k]-2,0,100); }
    else if(d.key==='rumour_bid'){ if(m.club!=null&&typeof startApproach==='function'){ let cid=d.data.club; if(cid==null){ const big=S.clubs.filter(c=>c.league&&!c.b&&c.rep>myClubObj().rep&&c.id!==m.club); if(big.length) cid=pick(big).id; } if(cid!=null){ startApproach(cid); if(windowOpen()) approachTick(); } } }
    else if(d.key==='invest_result'){ if(Math.random()<.4){ const g=roundWage(d.data.amt*rnd(1.5,3)); m.bank+=g; news('good','Investment pays off',`Your friend's brand takes off. You get back ${money(g)}.`); } else news('bad','Investment goes under',`The business folds. The ${money(d.data.amt)} is gone.`); }
    else if(d.key==='loan_back'){ m.bank+=d.data.amt; news('good','Loan repaid',`${d.data.n} pays you back the ${money(d.data.amt)} with a thank-you note.`); }
    else if(d.key==='promo_scandal'){ news('bad','Sponsored post backfires','The app you promoted turns out to be a scam. Fans are furious.'); m.rel.fans=clamp(m.rel.fans-8,0,100); m.rel.media=clamp(m.rel.media-6,0,100); m.rep=clamp(m.rep-2,0,100); }
    else if(d.key==='niggle_injury'){ if(!m.injury){ injure('training'); } }
    else if(d.key==='agent_renew'){ if(m.contract&&m.club!=null&&!m.offers.some(o=>o.type==='renew')){ if(m.rel.manager>=45||Math.random()<.4){ const ft=fairTerms(m.club); m.offers.push({id:'r'+Math.random().toString(36).slice(2),club:m.club,type:'renew',fee:0,wage:ft.wage,role:ft.role,years:ft.years,blocked:false,expires:S.week+3,via:'Agent'}); news('good','New contract offer',`Your agent got the club to the table. Details in Transfers.`); } else news('you','Club stall on contract','The club say talks will wait until the end of the season.'); } } } }
// pick an event for today
function evMaybe(i,d){ const m=S.me; if(!m||m.club==null||m.loan&&Math.random()<.5) return; if(['match','intlmatch','travel','intltrain'].includes(d.type)) return; if(S.pending||(S.queue&&S.queue.length)) return;
  const now=evDayAbs(); if(m.evNext&&now<m.evNext) return; if(Math.random()>.33) return;
  m.evSeen=m.evSeen||{}; const pool=EVENTS.filter(e=>{ const seen=m.evSeen[e.id]; if(seen!=null){ if(e.once===true) return false; if(S.season-seen<(e.once===false?1:2)) return false; } try{ return !e.cond||e.cond(); }catch(_){ return false; } });
  if(!pool.length) return; const e=pick(pool); let inst=null; try{ inst=e.make(); }catch(_){ inst=null; } if(!inst) return;
  m.evSeen[e.id]=S.season; m.evNext=now+ri(5,9); S.evCur={id:e.id,inst}; S.queue.push({kind:'event',id:e.id,title:inst.title,txt:inst.txt,opts:inst.o.map(o=>o[0])}); }
function evChoose(ix){ const cur=S.evCur; if(!cur||!cur.inst||!cur.inst.o) { S.evCur=null; return {title:'Moving on',choice:'',txt:'You put it behind you.',eff:[]}; } const o=cur.inst.o[ix]; if(!o||typeof o[1]!=='function'){ S.evCur=null; return {title:cur.inst.title||'Moving on',choice:'',txt:'You put it behind you.',eff:[]}; } const res=o[1](); S.evCur=null; (S.me.evLog=S.me.evLog||[]).unshift({when:fmtDate(gameDate()),title:cur.inst.title,choice:o[0],txt:res.txt}); if(S.me.evLog.length>60) S.me.evLog.length=60; return {title:cur.inst.title,choice:o[0],txt:res.txt,eff:res.r||[]}; }

function mailVerdict(L){ try{ const m=S.me; if(!L||L.intl||L.youth||m.club==null) return; const c=myClubObj(); const mg=c.mgr||'The manager';
  if(!L.played){ if(Math.random()<.5) mail('you',`${mg.split(' ').slice(-1)[0]}: keep going`,pick([`You didn't get on today. Keep pushing in training. Your chance will come.`,`I know you wanted minutes. Training this week decides the next team.`,`Unused today. Stay sharp, we've a busy run coming.`]),{from:mg,role:'Manager',cat:'club',go:'manager:0',goLbl:'Talk to the manager'}); return; }

  if(L.g) good.push(L.g>1?`${L.g} goals`:'the goal'); if(L.a) good.push(L.a>1?`${L.a} assists`:'the assist'); if((s.kp||0)>=3) good.push(`${s.kp} chances created`); if((s.tackles||0)>=4) good.push(`${s.tackles} tackles`); if((s.passPct||0)>=88) good.push(`${s.passPct}% passing`);

    const txt=aps.length?`I've had calls about you. ${aps.map(a=>`${club(a.club).name} are ${a.stage==='scout'?'watching':a.stage==='bid'?'bidding':a.stage==='agreed'?'agreed a fee':'in touch'}`).join('; ')}.`:avg(m.form.slice(-5))>=7.2?'Your form is getting noticed. Keep it going and the calls will come.':m.contract&&m.contract.years<=1?'Your deal is running down. We should talk about what you want next.':'Quiet on my end. Focus on your football and I\'ll handle the rest.';

  // club bulletin every 4 weeks
  if(S.week%4===1&&S.week>1){ const r=recordStr(c.id); if(r){ const top=topOf(c.id).g; const lid=c.league; const tab=sortedTable(lid); const leader=club(tab[0]); const T=tbl(lid);

      {from:'Club media',role:c.name,kv:[['League position',`${ord(r.pos)} of ${r.of}`],['Record',`${r.w}W ${r.d}D ${r.l}L · ${r.pts} pts`],['Gap to top',r.pos===1?`Leaders by ${T[c.id][6]-T[tab[1]][6]}`:`${T[tab[0]][6]-r.pts} behind ${leader.name}`],['Goals',`${r.gf} for, ${r.ga} against`],['Top scorer',top&&top.g?`${top.n} (${top.g})`:'–']],go:'comps:0',goLbl:'League table',cat:'club',quiet:true}); } }
  }catch(e){ console.warn('mailWeek',e); } }

function incomingBids(){ const M=S.M, c=mgrClub(); if(!c) return; const sq=c.squad.map(P);

function releasePlayer(pid){ const M=S.M, p=P(pid), c=mgrClub(); const pay=mWage(p)*52*Math.max(0,ctOf(p))*.5; if(pay>M.tb) return `Paying up his contract costs ${money(pay)}, more than your budget.`; M.tb-=pay;
  const dest=S.clubs.filter(z=>z.league&&S.leagues[z.league]&&z.id!==c.id&&clubLevel(z)<=p.o+2&&clubLevel(z)>=p.o-8); const z=dest.length?pick(dest):pick(S.clubs.filter(x=>x.league&&S.leagues[x.league]&&x.id!==c.id));

function mgrSeasonEnd(){ const M=S.M; const A=archiveSeason(); S.lastTables={}; for(const l in A.leagues) S.lastTables[l]=A.leagues[l].rows.map(r=>r[0]);

const CLOUD={db:null,uid:null,meta:{},ready:false,pending:null,timer:0,busy:false,lastErr:null};
const CHUNK=200000;
function cloudPath(p){ return `data/users/${CLOUD.uid}/${p}`; }
async function cloudInit(){
  try{ if(!window.claude||!window.claude.use) return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]); if(!db||!user) return;
    const uid=await user.id(); if(!uid) return; CLOUD.db=db; CLOUD.uid=uid;
    const snap=await db.doc(cloudPath('meta')).get(); CLOUD.meta=(snap.exists&&snap.data().slots)||{}; CLOUD.ready=true;
    if(!S||!S.me||!S.me.first) renderStart();
    // first run with cloud on: push any local-only careers up so they are safe
    const local=slotMeta(); for(const n of [1,2,3]){ const l=local[n], c=CLOUD.meta[n]; if(l&&(!c||(l.saved||0)>(c.saved||0))){ try{ const raw=localStorage.getItem(SLOT_KEY(n)); if(raw){ const obj=unpackS(raw); await cloudWrite(n,l,JSON.stringify(obj)); } }catch(e){} } }
  }catch(e){ CLOUD.ready=false; }
}
function allMeta(){ const l=slotMeta(), out={}; for(const n of [1,2,3]){ const a=l[n], b=CLOUD.meta[n]; out[n]=a&&b?((a.saved||0)>=(b.saved||0)?a:b):(a||b||null); if(out[n]) out[n]=Object.assign({},out[n],{cloud:!!b&&(!a||(b.saved||0)>=(a.saved||0)-1000)}); } return out; }
function cloudQueue(n,entry){ if(!CLOUD.ready) return; CLOUD.pending={n,entry}; if(CLOUD.timer||CLOUD.busy) return; const wait=Math.max(0,(CLOUD.lastAt||0)+20000-Date.now()); CLOUD.timer=setTimeout(cloudFlush,wait); }
async function cloudFlush(){ CLOUD.timer=0; if(!CLOUD.pending||CLOUD.busy||!S||!hasCareer()) return; const {n,entry}=CLOUD.pending; CLOUD.pending=null; if(S.slot!==n) return; CLOUD.busy=true;
  try{ await cloudWrite(n,entry,JSON.stringify(S)); CLOUD.lastErr=null; }catch(e){ CLOUD.lastErr=e&&e.code||'error'; if(e&&e.code==='quota_exceeded') toast('Cloud save storage is full.'); }
  CLOUD.busy=false; CLOUD.lastAt=Date.now(); if(CLOUD.pending) cloudQueue(CLOUD.pending.n,CLOUD.pending.entry); }
async function cloudWrite(n,entry,json){ const db=CLOUD.db; const data=LZString.compressToBase64(json); const slotRef=db.doc(cloudPath('slot'+n));
  const cur=await slotRef.get(); const set=cur.exists&&cur.data().set==='a'?'b':'a'; const k=Math.ceil(data.length/CHUNK); const stamp=entry.saved||Date.now();
  for(let i=0;i<k;i++) await slotRef.collection('chunks').doc(set+i).set({d:data.slice(i*CHUNK,(i+1)*CHUNK),stamp});
  await slotRef.set({set,n:k,stamp}); // flip to the new copy only once every chunk is written
  CLOUD.meta[n]=Object.assign({},entry,{saved:stamp}); await db.doc(cloudPath('meta')).set({slots:CLOUD.meta}); }
async function cloudRead(n){ const db=CLOUD.db; const slotRef=db.doc(cloudPath('slot'+n)); const s=await slotRef.get(); if(!s.exists) return null; const {set,n:k,stamp}=s.data(); let data='';
  for(let i=0;i<k;i++){ const c=await slotRef.collection('chunks').doc(set+i).get(); if(!c.exists||c.data().stamp!==stamp) return null; data+=c.data().d; }
  const json=LZString.decompressFromBase64(data); return json?JSON.parse(json):null; }
async function cloudDelete(n){ if(!CLOUD.ready) return; try{ delete CLOUD.meta[n]; await CLOUD.db.doc(cloudPath('meta')).set({slots:CLOUD.meta}); const ref=CLOUD.db.doc(cloudPath('slot'+n)); await ref.delete(); for(const st of ['a','b']) for(let i=0;i<8;i++) await ref.collection('chunks').doc(st+i).delete(); }catch(e){} }
// load whichever copy is newest: this browser or the cloud
async function loadAny(n){ const l=slotMeta()[n], c=CLOUD.meta[n];
  if(CLOUD.ready&&c&&(!l||(c.saved||0)>(l.saved||0))){ try{ const obj=await cloudRead(n); if(obj&&loadSlot(n,obj)){ try{ localStorage.setItem(SLOT_KEY(n),packS()); const m=slotMeta(); m[n]=c; localStorage.setItem('bw3.meta',JSON.stringify(m)); }catch(e){} return true; } }catch(e){} }
  return loadSlot(n); }
function flushNow(){ if(CLOUD.timer){ clearTimeout(CLOUD.timer); CLOUD.timer=0; cloudFlush(); } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&S&&hasCareer()){ try{ autosave(); }catch(e){} CLOUD.lastAt=0; if(CLOUD.timer){ clearTimeout(CLOUD.timer); CLOUD.timer=0; } cloudFlush(); } });

function tableHTML(lid,rows,compact,hl){ const T=rows; const L=LMETA(lid); const n=T.length;
  return `<table><thead><tr><th>Pos</th><th class="l">Team</th><th>P</th>${compact?'':'<th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th>'}<th>GD</th><th>Pts</th>${compact?'':'<th class="l">Form</th>'}</tr></thead><tbody>${T.map((r,i)=>{ const [id,p,w,d,l,gf,ga,pts,fm]=r; const zone=i<(L.tier===1?0:L.up)?'g':i>=n-L.down&&L.down?'r':'';
   return `<tr class="${id===hl?'me':''}"><td>${zone?`<span class="pill ${zone}">${i+1}</span>`:i+1}</td><td class="l t">${cname(id)}</td><td>${p}</td>${compact?'':`<td>${w}</td><td>${d}</td><td>${l}</td><td>${gf}</td><td>${ga}</td>`}<td>${gf-ga>0?'+':''}${gf-ga}</td><td><b>${pts}</b></td>${compact?'':`<td class="l">${(fm||[]).map(x=>`<span class="res ${x}">${x}</span>`).join(' ')}</td>`}</tr>`; }).join('')}</tbody></table>`; }
function liveRows(lid){ const T=tbl(lid); return sortedTable(lid).map(id=>[id,...T[id]]); }
function wTable(){ const lid=myLeague(); if(!lid||!S.leagues[lid]) return W('League table','<p class="empty">No league.</p>'); return W(LMETA(lid).name,tableHTML(lid,liveRows(lid),true,myClubId()),'comps:0','w-tbl'); }
function wInbox(){ const it=inboxItems().slice(0,6); return W('Inbox',it.map((n,i)=>`<button class="li ${n.read?'':'unread'}" data-act="openMsg" data-arg="${i}"><i class="${n.kind}"></i><div><b>${esc(n.title)}</b><p>${esc(n.body)}</p></div><time>${esc(n.when)}</time></button>`).join('')||'<p class="empty">No messages.</p>','inbox:0'); }
function wTargets(){ const yth=['Youth','Prospect'].includes(S.me.contract&&S.me.contract.role); const t=seasonTotals(S.me.ss,k=>isClubComp(k)&&(yth||!k.startsWith('U:'))), T=seasonTargets(); const ar=avg(t.rat);
  const row=(l,v,tg,w)=>`<div class="tgt"><div class="row"><span>${l}</span><b class="num">${v} <span style="color:var(--dim);font-weight:400">/ ${tg}</span></b></div><div class="bar"><i class="${w>=1?'g':w>=.6?'':'y'}" style="width:${clamp(w,0,1)*100}%"></i></div></div>`;
  return W('Season & targets',`<div class="row" style="gap:14px;margin-bottom:4px">${[['Apps',t.apps],['Goals',t.g],['Assists',t.a],['POTM',t.motm]].map(([l,v])=>`<div><div class="lbl">${l}</div><b style="font-family:var(--cond);font-size:20px">${v}</b></div>`).join('')}</div>
   ${row('Average rating',ar?ar.toFixed(2):'–',T.rating.toFixed(1),ar/T.rating)}${row('Goals',t.g,T.goals,t.g/T.goals)}${row('Appearances',t.apps,T.apps,t.apps/T.apps)}<p class="note">Targets set by the manager for a ${esc((S.me.contract&&S.me.contract.role||'').toLowerCase())} player${yth?', youth games included':''}.</p>`,'career:0'); }

let INBOX_CAT='all', INBOX_OPENED=false;

  return `<div class="stack">${sel.from?`<div class="msgfrom"><span class="av">${esc(ini||'•')}</span><div><b>${esc(sel.from)}</b><span class="note">${esc(sel.role||'')}</span></div></div>`:''}<b style="font-size:16px">${esc(sel.title)}</b><p style="margin:0;line-height:1.6;max-width:62ch;white-space:pre-line">${esc(sel.body)}</p>${sel.kv&&sel.kv.length?`<div class="kv msgkv">${sel.kv.map(([k,v])=>`<span>${esc(k)}</span><b>${esc(String(v))}</b>`).join('')}</div>`:''}${sel.go?`<div class="row"><button class="btn sec" data-act="go" data-arg="${sel.go}">${esc(sel.goLbl||'Open')} ›</button></div>`:''}</div>`; }
VIEWS['inbox:0']=()=>{ const all=inboxItems(); const it=all.filter(n=>INBOX_CAT==='all'||(typeof mailCat==='function'?mailCat(n):'club')===INBOX_CAT); const sel=it.includes(all[INBOX_SEL])?all[INBOX_SEL]:it[0];

  ${narrow&&INBOX_OPENED?'':detail}</div>`; };
VIEWS['schedule:0']=()=>{ return `<div class="dash c1">${W(`Week ${S.week} of ${WEEKS}${INTL_WEEKS.includes(S.week)?' · International break':''}${windowOpen()?' · Transfer window open':''}`,`<div class="stack"><div class="week">${S.days.map((d,i)=>`<div class="dy ${i<S.day?'done':i===S.day?'now':''} ${d.type==='match'||d.type==='intlmatch'?'match':''}"><b>${fmtDate(gameDate(S.week,i))}</b><span>${esc(dayLabel(d))}</span></div>`).join('')}</div>

  return `<div class="dash c1">${W('Fixtures & results',`<table><thead><tr><th class="l">Wk</th><th class="l">Competition</th><th class="l">Opponent</th><th>Result</th><th>Mins</th><th>G</th><th>A</th><th>Rating</th></tr></thead><tbody>${rows}${up}</tbody></table><p class="note">Cup and European opponents are drawn the week of the match.</p>`,null,'w-tbl')}</div>`; };
VIEWS['training:0']=()=>{ const m=S.me; const PO=Object.entries(PERSONAL);
  const grid=`<div class="daygrid"><span></span>${S.days.map((d,i)=>`<span class="h">${WD[gameDate(S.week,i).getUTCDay()]}</span>`).join('')}

   <span class="h">Attendance</span>${S.days.map((d,i)=>d.type==='team'?`<select data-ch="att" data-i="${i}" aria-label="Attendance ${i}">${[['early','Early'],['on','On time'],['late','Late'],['skip','Skip']].map(([k,l])=>`<option value="${k}" ${m.att[i]===k?'selected':''}>${l}</option>`).join('')}</select>`:'<span class="cell">–</span>').join('')}
   <span class="h">Personal</span>${S.days.map((d,i)=>['team','recovery'].includes(d.type)||m.club==null?`<select data-ch="pers" data-i="${i}" aria-label="Personal session ${i}">${PO.map(([k,v])=>`<option value="${k}" ${m.pers[i]===k?'selected':''}>${v.name}</option>`).join('')}</select>`:'<span class="cell">–</span>').join('')}</div>`;

   <div class="fld"><label for="trt">Trait drill target</label><select id="trt" data-ch="traitTarget"><option value="">None</option>${TRAITS.filter(t=>!m.traits.includes(t[0])).map(t=>`<option ${m.traitTarget===t[0]?'selected':''}>${esc(t[0])}</option>`).join('')}</select></div>
   <div class="fld"><label for="cch">Private coach focus</label><select id="cch" data-ch="coachFocus">${PO.filter(([k,v])=>v.a).map(([k,v])=>`<option value="${k}" ${(m.coachFocus||'finishing')===k?'selected':''}>${v.name}</option>`).join('')}</select></div></div></div>`)}
  ${W('How training works',`<div class="kv"><span>Arrive early</span><b class="c-hi">+18% gains, manager notices</b><span>On time</span><b>Normal gains</b><span>Arrive late</span><b class="c-mid">−20% gains, fine (5% of wage)</b><span>Skip</span><b class="c-lo">No gains, big fine, likely dropped</b><span>Private coach</span><b>Double gains, ${money(roundWage(Math.max(300,m.contract?m.contract.wage*.15:300)))} per session</b><span>Spa & recovery</span><b>+12 energy, €150</b><span>Energy now</span><b>${Math.round(m.energy)}</b></div><p class="note">Low energy means smaller gains and more injuries. Gains slow down as you get older and closer to your potential.</p>`)}</div>`; };

function ratingTrend(rs){ rs=rs.slice(-24); if(rs.length<2) return '<p class="note">Your rating trend appears after a couple of games.</p>'; const W0=320,H0=74,mn=5,mx=9.5; const x=i=>i/(rs.length-1)*W0, y=r=>H0-(clamp(r,mn,mx)-mn)/(mx-mn)*H0;
